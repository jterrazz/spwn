description: root --help renders the grouped help page
runs:
    - command: --help
      exit: 0
      stdout: |+
          
          ⬡ spwn - the building blocks of agent intelligence

          Quick Start:
            spwn init                        Scaffold a new project
            spwn agent create neo            Create an agent (auto-creates a single-agent world)
            spwn up                          Bring up every world in spwn.yaml
            spwn agent neo                   Start the world that contains neo

          Entities:
            agent                            Composed minds (create, ls, inspect, fork, talk)
            world                            Deployable groupings (list, inspect, enter, snap)

          Building blocks:
            install <ref>                    Install a dependency (spwn:unix, github.com/...)
            uninstall <ref>                  Remove a dependency
            skill                            Author skill files (new, edit, show, rm, ls)

          Worlds:
            up [name]                        Start every world (or one)
            down [name]                      Stop every world (or one)

          Coordination:
            logs                             System event log (--world, --agent, --type)

          System:
            init                             Create default configs
            auth                             Manage credentials
            upgrade                          Update the CLI

          Run "spwn <command> --help" for details.

