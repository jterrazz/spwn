description: world snap --help lists the save, ls, restore and rm subcommands
fixture: $FIXTURES/docker-pilot/
runs:
    - command: world snap --help
      exit: 0
      stdout: |+
          
          ⬡ world snap - world snapshots

          Usage:
            spwn world snap [command]

          Commands:
            save <world-id>                  Save world state
            ls                               List all snapshots
            restore <snap-id>                Restore from snapshot
            rm <snap-id>                     Remove a snapshot

          Use "spwn world snap <command> --help" for more information.

