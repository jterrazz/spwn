description: --force replaces the stale files a filtered run left behind
fixture: $FIXTURES/docker-pilot/
runs:
    - command: build --tree-only
      exit: 0
      stdout: |4+
          
            ✓  Compile complete
               {{workdir}}/dist

            2 file(s) written, runtime=claude-code

    - command: build --tree-only --agent neo --force
      exit: 0
      stdout: |4+
          
            ✓  Compile complete
               {{workdir}}/dist

            2 file(s) written, runtime=claude-code

      files:
          dist/agents/neo/CLAUDE.md: exists
          dist/world: absent
