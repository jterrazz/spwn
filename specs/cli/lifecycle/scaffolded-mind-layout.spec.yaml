description: init scaffolds the default agent with the expected mind layout
fixture: $FIXTURES/empty/
runs:
    - command: init --name layout-check
      exit: 0
      stdout: |4
            Committed:
              spwn.yaml                      # project manifest (worlds live inline)
              spwn.lock                      # committed dependency pins (like package-lock.json)
              spwn/agents/neo/               # starter agent
              spwn/skills/focus.md           # example local skill  (skill/focus)
              spwn/tools/greet/              # example local tool   (tool/greet)
              spwn/hooks/session-banner.yaml # example local hook   (hook/session-banner)
              spwn/commands/refactor.md      # example slash command (command/refactor)

            Gitignored:
              .spwn/                         # local state

            Next:
              spwn auth                      # verify your credentials
              spwn agent neo                 # open an interactive session with neo
      stderr: |4+
          
            ✓ Initialised spwn project layout-check


      files:
          spwn/agents/neo/SOUL.md: exists
          spwn/agents/neo/agent.yaml: exists
          spwn/agents/neo/playbooks: exists
          spwn/agents/neo/journal: exists
          spwn/agents/neo/identity: absent
          spwn/agents/neo/skills: absent
          spwn/agents/neo/knowledge: absent
          spwn/knowledge: exists
          knowledge: absent
          spwn/worlds: absent
