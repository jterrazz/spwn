description: init then ls, dream and rm walk the whole non-docker journey
fixture: $FIXTURES/empty/
env: isolated
runs:
    - command: init --name lifecycle
      exit: 0
      stdout: |4
            Committed:
              spwn.yaml                      # project manifest (worlds live inline)
              spwn.lock                      # committed dependency pins (like package-lock.json)
              spwn/agents/neo/               # starter agent
              spwn/skills/focus.md           # example local skill  (skill/focus)
              spwn/tools/greet/              # example local tool   (tool/greet)
              spwn/hooks/session-banner.yaml # example local hook   (hook/session-banner)
              spwn/commands/refactor.md      # example slash command (command/refactor)

            Gitignored:
              .spwn/                         # local state

            Next:
              spwn auth                      # verify your credentials
              spwn agent neo                 # open an interactive session with neo
      stderr: |4+
          
            ✓ Initialised spwn project lifecycle


    - command: agent ls
      exit: 0
      stderr: |4+
          
            AGENT   STATUS                  WORLD   
            neo     ○ ○ deployed, stopped   neo     

    - command: agent dream neo
      exit: 0
      stderr: |4+
          
            → Dreaming for agent "neo"...
            Skipped      no journal entries
            Hint         Journal entries are created when worlds are destroyed. Use "spwn down <world>" first.

    - command: agent rm neo
      exit: 0
      stderr: |4+
          
            → Deleting agent "neo"...
            ✓ Deleted agent            neo
            ✓ Updated spwn.yaml        neo

      files:
          spwn/agents/neo: absent
