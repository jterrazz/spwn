description: 'start asks the engine to run a persistent VM again'
fixture:
    - ../../../__fixtures__/vms/
    - ../../../__fixtures__/engine-vm/
env: engine
serve: sshd
runs:
    - command: '--version >/dev/null; /usr/bin/sed -i.bak ''s/"vm_user": "vmu"/"vm_user": "vmu", "services": {"range": "41280-41299"}/'' .config/station/preferences.json; "$STATION" engine run 2>/dev/null & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create --persistent --name api > /dev/null; "$STATION" machines stop api --yes > /dev/null; "$STATION" machines start api; /usr/bin/jq -r .want .local/state/station/vms/api.json; /usr/bin/grep -c "^sh -c" .calls; /usr/bin/grep -c launchctl .calls; kill $d; wait $d; echo stopped > .tart-vms/api; n=0; while [ ! -f .local/state/station/runs/api.exit ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done'
      exit: 0
      stdout: |
          ●	api	started
          running
          2
          0
