description: auth login notion takes the MCP helper path and writes no token without Docker
env:
    - sealed
    - DOCKER_HOST=tcp://127.0.0.1:1
runs:
    - command: auth login notion
      exit: 1
      stdout: |
          Building spwn-mcp-auth:latest (one-time setup)...
          {{any}}
          Cannot connect to the Docker daemon at tcp://127.0.0.1:1. Is the docker daemon running?
      stderr: |4+
          
            Logging in to notion a browser link will appear; click Allow, then this command exits

            ✗ notion login failed      build helper image: exit status 1
              Re-run `spwn auth login notion`. If the helper image build keeps failing, ensure Docker is running.

      files:
          spwn-home/credentials/mcp/oauth: absent
