description: uninstall accepts a bare name and removes the scheme form it added
fixture: $FIXTURES/docker-pilot/
runs:
    - command: install python
      exit: 0
      stdout: |4
            ✓  installed spwn:python
               1 agent updated, spwn.lock pinned
    - command: uninstall python
      exit: 0
      stdout: |4
            ✓  uninstalled spwn:python
               1 agent updated
