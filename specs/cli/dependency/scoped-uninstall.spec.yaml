description: a scoped uninstall keeps the lockfile pin while other agents carry the ref
fixture: ../__fixtures__/severance/
runs:
    - command: install qmd
      exit: 0
      stdout: |4
            ✓  installed spwn:qmd
               4 agents updated, spwn.lock pinned
    - command: uninstall qmd --agent mark
      exit: 0
      stdout: |4
            ✓  uninstalled spwn:qmd
               1 agent updated
      files:
          spwn/agents/mark/agent.yaml:
              equals: |
                  name: mark
                  description: Mark, the team lead, reads the handbook first, delegates second, finishes the batch.
                  role: chief
                  runtime:
                      backend: spwn:claude-code
                  dependencies:
                      - skill/refine
