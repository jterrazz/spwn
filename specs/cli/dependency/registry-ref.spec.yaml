description: a github registry ref is refused as unsupported
fixture: $FIXTURES/docker-pilot/
runs:
    - command: install github:acme/foo
      exit: 1
      stderr: |4+
          
            Error: "github:acme/foo" targets github:acme/foo — remote registries are not yet supported. Use spwn:<name> for built-in dependencies, or author a local one under ./spwn/tools/

