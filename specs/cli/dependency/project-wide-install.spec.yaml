description: a project-wide install reaches every agent in a multi-agent project
fixture: $FIXTURES/empty/
runs:
    - command: init severance
      exit: 0
      stdout: |4
            spwn.yaml          # created
            Worlds added:      mdr
            Agents added:      dylan, helly, irving, mark

            Next:
              spwn up                        # spawn the world
      stderr: |4+
          
            ✓ Installed example spwn:severance


    - command: install qmd
      exit: 0
      stdout: |4
            ✓  installed spwn:qmd
               4 agents updated, spwn.lock pinned
      files:
          spwn/agents/mark/agent.yaml: { contains: "spwn:qmd" }
          spwn/agents/helly/agent.yaml: { contains: "spwn:qmd" }
          spwn/agents/irving/agent.yaml: { contains: "spwn:qmd" }
          spwn/agents/dylan/agent.yaml: { contains: "spwn:qmd" }
