description: --agent narrows an install to a single agent
fixture: $FIXTURES/empty/
runs:
    - command: init severance
      exit: 0
      stdout: |4
            spwn.yaml          # created
            Worlds added:      mdr
            Agents added:      dylan, helly, irving, mark

            Next:
              spwn up                        # spawn the world
      stderr: |4+
          
            ✓ Installed example spwn:severance


    - command: install qmd --agent mark
      exit: 0
      stdout: |4
            ✓  installed spwn:qmd
               1 agent updated, spwn.lock pinned
      files:
          spwn/agents/mark/agent.yaml: { contains: "spwn:qmd" }
