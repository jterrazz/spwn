description: a bare name that misses the catalog is rejected with a known-list hint
fixture: $FIXTURES/docker-pilot/
runs:
    - command: install my-local-tool
      exit: 1
      stderr: |4+
          
            Error: "my-local-tool" is not in the catalog.
          known: architect, build, cli, docker-cli, gh, git, mcp2cli, mempalace, node, notion, python, qmd, unix, x

          hint: pass skill/my-local-tool, tool/my-local-tool, hook/my-local-tool, or command/my-local-tool for a local block

