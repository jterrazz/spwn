description: --agent attaches an explicit local skill to one agent
fixture: $FIXTURES/empty/
runs:
    - command: init severance
      exit: 0
      stdout: |4
            spwn.yaml          # created
            Worlds added:      mdr
            Agents added:      dylan, helly, irving, mark

            Next:
              spwn up                        # spawn the world
      stderr: |4+
          
            ✓ Installed example spwn:severance


    - command: install skill/refine --agent dylan
      exit: 0
      stdout: |4
            ✓  installed skill/refine
               1 agent updated, spwn.lock pinned
      files:
          spwn/agents/dylan/agent.yaml: { contains: skill/refine }
