description: a local ref in a multi-agent project still needs --agent
fixture: $FIXTURES/empty/
runs:
    - command: init severance
      exit: 0
      stdout: |4
            spwn.yaml          # created
            Worlds added:      mdr
            Agents added:      dylan, helly, irving, mark

            Next:
              spwn up                        # spawn the world
      stderr: |4+
          
            ✓ Installed example spwn:severance


    - command: install skill/refine
      exit: 1
      stderr: |4+
          
            Error: "skill/refine" is a local ref — pass --agent <name> to attach it to one agent, or author a new one with `spwn skill new refine` / `spwn/tools/refine/` / `spwn/hooks/refine.yaml` / `spwn/commands/refine.md`

