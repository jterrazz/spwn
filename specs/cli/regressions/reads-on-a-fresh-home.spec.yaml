description: every read on a fresh home leaves the home as it found it, with no ~/.spwn
env: sealed
runs:
    - command: auth
      exit: 0
      stderr: |4+
          
            ⬡ Credentials

            Anthropic
              · oauth          not set  ·  run `claude login` on the host; Spwn picks up credentials automatically
              · api_key        not set  ·  spwn auth login anthropic --api-key sk-ant-...

            OpenAI
              · oauth          not set  ·  run `codex login` on the host; Spwn picks up credentials automatically
              · api_key        not set  ·  spwn auth login openai --api-key sk-... or export OPENAI_API_KEY=sk-...

            Tools (CLI)
              · github         not set  ·  spwn auth login github
              · google         not set  ·  spwn auth login google

            Tools (MCP)
              · notion         not set  ·  spwn auth login notion

            Default: none set  ·  spwn auth default <provider>

      files:
          spwn-home: absent
          empty-home/.spwn: absent

    - command: status
      exit: 0
      stderr: |4+
          
            spwn vdev
            {{workdir}}/spwn-home · not configured · 0 skills

            ── Worlds ────────────────────────────────────── none ──
               spwn up --agent <name> -w .

            ── Architect ──────────────────────────────── offline ──

      files:
          spwn-home: absent
          empty-home/.spwn: absent

    - command: ls
      exit: 0
      stderr: |4+
          
            ✓ No agents yet.

      files:
          spwn-home: absent
          empty-home/.spwn: absent

    - command: agent ls
      exit: 0
      stderr: |4+
          
            ✓ No agents yet.

      files:
          spwn-home: absent
          empty-home/.spwn: absent

    - command: architect status
      exit: 0
      stderr: |4+
          
            Architect:   not running

            Start with: spwn architect start

      files:
          spwn-home: absent
          empty-home/.spwn: absent

    - command: automation ls
      exit: 1
      stderr: |4+
          
            Error: no spwn.yaml found: run `spwn init` first

      files:
          spwn-home: absent
          empty-home/.spwn: absent

    - command: check
      exit: 1
      stderr: |4+
          
            Error: no spwn.yaml found: run `spwn init` first

      files:
          spwn-home: absent
          empty-home/.spwn: absent

    - command: cookie-sync providers
      exit: 0
      stdout: |4+
          
            0 provider(s) registered:


      files:
          spwn-home: absent
          empty-home/.spwn: absent

    - command: cookie-sync status
      exit: 0
      stdout: |4+
          
            · no providers registered (no gate elements use cookies yet)

      files:
          spwn-home: absent
          empty-home/.spwn: absent

    - command: logs
      exit: 0
      stdout: |
          No events yet.
      files:
          spwn-home: absent
          empty-home/.spwn: absent

    - command: skill ls
      exit: 0
      stderr: |
          No skills authored yet.
          Create one with 'spwn skill new <name>'.
      files:
          spwn-home: absent
          empty-home/.spwn: absent

    - command: world list
      exit: 0
      stderr: |4+
          
            ✓ No active worlds.

      files:
          spwn-home: absent
          empty-home/.spwn: absent
