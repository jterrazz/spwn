description: init severance installs a check-passing four-agent project
fixture: $FIXTURES/empty/
runs:
    - command: init severance
      exit: 0
      stdout: |4
            spwn.yaml          # created
            Worlds added:      mdr
            Agents added:      dylan, helly, irving, mark

            Next:
              spwn up                        # spawn the world
      stderr: |4+
          
            ✓ Installed example spwn:severance


    - command: check
      exit: 0
      stdout: |4+
          
            ✓  Project is valid
               {{workdir}}/spwn.yaml

      files:
          spwn/agents/mark/agent.yaml: exists
          spwn/agents/mark/SOUL.md: exists
          spwn/agents/helly/agent.yaml: exists
          spwn/agents/helly/SOUL.md: exists
          spwn/agents/irving/agent.yaml: exists
          spwn/agents/irving/SOUL.md: exists
          spwn/agents/dylan/agent.yaml: exists
          spwn/agents/dylan/SOUL.md: exists
          spwn/knowledge: exists
          spwn.yaml: { contains: "knowledge: ./spwn/knowledge" }
