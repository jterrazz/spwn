description: web --help documents the core flags
fixture: $FIXTURES/empty/
env: isolated
runs:
    - command: web --help
      exit: 0
      stdout: |+
          
          Starts the Web UI (Next.js frontend + Go API server) and opens it
          in your default browser. Blocks until Ctrl+C.

          ⚠ Experimental: this command is in development and may change or break without notice.

          Usage:
            spwn web [flags]

          Flags:
            -h, --help          help for web
                --no-open       Don't open the browser
            -p, --port string   API server port (default "3001")

