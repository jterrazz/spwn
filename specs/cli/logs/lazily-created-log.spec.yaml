description: the activity log is created only by the first real event
fixture: $FIXTURES/empty/
env: isolated
runs:
    - command: --version
      exit: 0
      stdout: |
          spwn version {{string}}
      files:
          spwn-home/activity.jsonl: absent
    - command: agent create neo
      exit: 0
      stderr: |4+
          
            → Creating agent "neo"...
            ✓ Created agent            neo
            ✓ Created soul             SOUL.md

            ✓ Spawn with: spwn up --agent neo

      files:
          spwn-home/activity.jsonl: { contains: 'agent.created' }
