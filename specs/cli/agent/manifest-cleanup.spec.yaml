description: agent rm cleans the manifest so check stays green
fixture: $FIXTURES/empty/
runs:
    - command: init
      exit: 0
      stdout: |4
            Committed:
              spwn.yaml                      # project manifest (worlds live inline)
              spwn.lock                      # committed dependency pins (like package-lock.json)
              spwn/agents/neo/               # starter agent
              spwn/skills/focus.md           # example local skill  (skill/focus)
              spwn/tools/greet/              # example local tool   (tool/greet)
              spwn/hooks/session-banner.yaml # example local hook   (hook/session-banner)
              spwn/commands/refactor.md      # example slash command (command/refactor)

            Gitignored:
              .spwn/                         # local state

            Next:
              spwn auth                      # verify your credentials
              spwn agent neo                 # open an interactive session with neo
      stderr: |4+
          
            ✓ Initialised spwn project {{string}}


    - command: agent new trinity
      exit: 0
      stderr: |4+
          
            → Creating agent "trinity"...
            ✓ Created agent            trinity
            ✓ Created soul             SOUL.md
            ✓ Added world to spwn.yaml trinity

            ✓ Spawn with: spwn up --agent trinity

    - command: agent rm trinity
      exit: 0
      stderr: |4+
          
            → Deleting agent "trinity"...
            ✓ Deleted agent            trinity
            ✓ Updated spwn.yaml        trinity

    - command: check
      exit: 0
      stdout: |4+
          
            ✓  Project is valid
               {{workdir}}/spwn.yaml

