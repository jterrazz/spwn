description: agent create --force succeeds even when the agent already exists
fixture: $FIXTURES/empty/
env: isolated
runs:
    - command: agent create neo
      exit: 0
      stderr: |4+
          
            → Creating agent "neo"...
            ✓ Created agent            neo
            ✓ Created soul             SOUL.md

            ✓ Spawn with: spwn up --agent neo

    - command: agent create neo --force
      exit: 0
      stderr: |4+
          
            → Creating agent "neo"...
            ✓ Re-scaffolded agent      neo

            ✓ Spawn with: spwn up --agent neo

      files:
          spwn-home/agents/neo/SOUL.md: exists
