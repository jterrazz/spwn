description: rm deletes the agent from disk
fixture: $FIXTURES/empty/
env: isolated
runs:
    - command: agent create temp
      exit: 0
      stderr: |4+
          
            → Creating agent "temp"...
            ✓ Created agent            temp
            ✓ Created soul             SOUL.md

            ✓ Spawn with: spwn up --agent temp

    - command: agent rm temp
      exit: 0
      stderr: |4+
          
            → Deleting agent "temp"...
            ✓ Deleted agent            temp

      files:
          spwn-home/agents/temp: absent
