description: import restores an agent from its own export
fixture: $FIXTURES/empty/
env: isolated
runs:
    - command: agent create neo
      exit: 0
      stderr: |4+
          
            → Creating agent "neo"...
            ✓ Created agent            neo
            ✓ Created soul             SOUL.md

            ✓ Spawn with: spwn up --agent neo

    - command: agent export neo
      exit: 0
      stderr: |4+
          
            → Exporting agent neo...
            ✓ Exported                 neo.tar.gz

    - command: agent rm neo
      exit: 0
      stderr: |4+
          
            → Deleting agent "neo"...
            ✓ Deleted agent            neo

    - command: agent import neo.tar.gz
      exit: 0
      stderr: |4+
          
            → Importing agent neo...
            ✓ Imported agent           neo

      files:
          spwn-home/agents/neo/SOUL.md: exists
