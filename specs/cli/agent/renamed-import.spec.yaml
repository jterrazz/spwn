description: import --as renames the agent on the way back in
fixture: $FIXTURES/empty/
env: isolated
runs:
    - command: agent create neo
      exit: 0
      stderr: |4+
          
            → Creating agent "neo"...
            ✓ Created agent            neo
            ✓ Created soul             SOUL.md

            ✓ Spawn with: spwn up --agent neo

    - command: agent export neo
      exit: 0
      stderr: |4+
          
            → Exporting agent neo...
            ✓ Exported                 neo.tar.gz

    - command: agent rm neo
      exit: 0
      stderr: |4+
          
            → Deleting agent "neo"...
            ✓ Deleted agent            neo

    - command: agent import neo.tar.gz --as neo-copy
      exit: 0
      stderr: |4+
          
            → Importing agent neo-copy...
            ✓ Imported agent           neo-copy

      files:
          spwn-home/agents/neo-copy/SOUL.md: exists
          spwn-home/agents/neo/SOUL.md: absent
