description: creating the same agent twice fails cleanly
fixture: $FIXTURES/empty/
env: isolated
runs:
    - command: agent create neo
      exit: 0
      stderr: |4+
          
            → Creating agent "neo"...
            ✓ Created agent            neo
            ✓ Created soul             SOUL.md

            ✓ Spawn with: spwn up --agent neo

    - command: agent create neo
      exit: 1
      stderr: |4+
          
            → Creating agent "neo"...
            ✗ Agent creation failed    agent "neo" already exists
              Run "spwn agent rm neo" first, or pass --force to re-scaffold

