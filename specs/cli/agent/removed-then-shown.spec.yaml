description: rm then show reports the agent as not found
fixture: $FIXTURES/empty/
env: isolated
runs:
    - command: agent create temp
      exit: 0
      stderr: |4+
          
            → Creating agent "temp"...
            ✓ Created agent            temp
            ✓ Created soul             SOUL.md

            ✓ Spawn with: spwn up --agent temp

    - command: agent rm temp
      exit: 0
      stderr: |4+
          
            → Deleting agent "temp"...
            ✓ Deleted agent            temp

    - command: agent show temp
      exit: 1
      stderr: |4+
          
            Error: agent "temp" not found

