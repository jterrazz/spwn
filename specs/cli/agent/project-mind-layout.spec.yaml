description: agent create inside a project writes the mind under spwn/agents/
fixture: $FIXTURES/single-agent/
runs:
    - command: agent create trinity
      exit: 0
      stderr: |4+
          
            → Creating agent "trinity"...
            ✓ Created agent            trinity
            ✓ Created soul             SOUL.md
            ✓ Added world to spwn.yaml trinity

            ✓ Spawn with: spwn up --agent trinity

      files:
          spwn/agents/trinity/SOUL.md: { contains: "# Default Soul" }
          spwn/agents/trinity/playbooks: exists
          spwn/agents/trinity/journal: exists
          spwn/agents/trinity/skills: absent
          spwn/agents/trinity/identity: absent
          spwn/agents/trinity/knowledge: absent
          spwn/agents/trinity/core: absent
          spwn/agents/trinity/memory: absent
          spwn/agents/trinity/sessions: absent
