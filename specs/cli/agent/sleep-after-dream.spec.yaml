description: sleep right after dream preserves the fresh reflexion
fixture:
    - $FIXTURES/single-agent/
    - journal/
runs:
    - command: agent dream neo
      exit: 0
      stderr: |4+
          
            → Dreaming for agent "neo"...
            ✓ Entries analyzed         2
            ✓ Completed                2
            ✓ Failed                   0
            ✓ Success rate             100%
            ✓ Written to               {{workdir}}/spwn/agents/neo/playbooks/auto-reflexion.md

    - command: agent sleep neo
      exit: 0
      stderr: |4+
          
            → Sleep cycle for agent "neo"...
            ✓ Archived playbooks       0
            ✓ Pruned sessions          0

      files:
          spwn/agents/neo/playbooks/auto-reflexion.md: exists
