description: export writes a tar.gz next to the project
fixture: $FIXTURES/empty/
env: isolated
runs:
    - command: agent create neo
      exit: 0
      stderr: |4+
          
            → Creating agent "neo"...
            ✓ Created agent            neo
            ✓ Created soul             SOUL.md

            ✓ Spawn with: spwn up --agent neo

    - command: agent export neo
      exit: 0
      stderr: |4+
          
            → Exporting agent neo...
            ✓ Exported                 neo.tar.gz

      files:
          neo.tar.gz: exists
