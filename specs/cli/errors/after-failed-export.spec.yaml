description: a failed export leaves the agent roster intact
fixture: $FIXTURES/empty/
env: isolated
runs:
    - command: init
      exit: 0
      stdout: |4
            Committed:
              spwn.yaml                      # project manifest (worlds live inline)
              spwn.lock                      # committed dependency pins (like package-lock.json)
              spwn/agents/neo/               # starter agent
              spwn/skills/focus.md           # example local skill  (skill/focus)
              spwn/tools/greet/              # example local tool   (tool/greet)
              spwn/hooks/session-banner.yaml # example local hook   (hook/session-banner)
              spwn/commands/refactor.md      # example slash command (command/refactor)

            Gitignored:
              .spwn/                         # local state

            Next:
              spwn auth                      # verify your credentials
              spwn agent neo                 # open an interactive session with neo
      stderr: |4+
          
            ✓ Initialised spwn project {{string}}


    - command: agent create neoprime
      exit: 0
      stderr: |4+
          
            → Creating agent "neoprime"...
            ✓ Created agent            neoprime
            ✓ Created soul             SOUL.md
            ✓ Added world to spwn.yaml neoprime

            ✓ Spawn with: spwn up --agent neoprime

    - command: agent export ghost
      exit: 1
      stderr: |4+
          
            → Exporting agent ghost...
            ✗ Export failed            agent "ghost" not found
              Check that agent "ghost" exists with "spwn agent ls"

    - command: agent ls
      exit: 0
      stderr: |4+
          
            AGENT      STATUS                  WORLD      
            neo        ○ ○ deployed, stopped   neo        
            neoprime   ○ ○ deployed, stopped   neoprime   

