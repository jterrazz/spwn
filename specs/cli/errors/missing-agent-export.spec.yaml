description: exporting a missing agent names it and hints at agent ls
fixture: $FIXTURES/empty/
env: isolated
runs:
    - command: agent export nonexistent
      exit: 1
      stderr: |4+
          
            → Exporting agent nonexistent...
            ✗ Export failed            agent "nonexistent" not found
              Check that agent "nonexistent" exists with "spwn agent ls"

