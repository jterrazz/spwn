description: 'three panes at 110, overlay at 105, columns left out at 85, no sidebar at 70, one line under 60'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Overview · This Mac
          send ]]
          see Not installed
          see ┓╭─ This Mac ─
          send q
      exit: 0
    - command: '--version >/dev/null; terminal --size 105x34 "$STATION"'
      stdin: |
          see Overview · This Mac
          send ]]
          see Not installed
          gone ┓╭─ This Mac ─
          send \x09
          see ┏━ This Mac ━
          send q
      exit: 0
    - command: '--version >/dev/null; terminal --size 85x34 "$STATION" | /usr/bin/sed -n "4,14p" | /usr/bin/perl -CS -lne ''print substr($_, 24)'''
      stdin: |
          see mac-mini         1
          send \x1b
          see 85 columns:
          gone ◌
          screen
          send q
      exit: 0
      stdout: |
          ┃     MACHINE     KIND       CPU    PORTS  NEED             ┃
          ┃   ● This Mac    Mac        ▃ 34%  0 · 0  9                ┃
          ┃   ├─ ○ api      Workspace  –      –      –                ┃
          ┃   └─ ● linux-1  Workspace  ▁ 8%   0 · 2  –                ┃
          ┃   ● mac-mini    Mac        ▂ 21%  0 · 0  1                ┃
          ┃   └─ ● infra    Server     ▂ 18%  0 · 0  –                ┃
          ┃                                                           ┃
          ┃   85 columns: MEMORY, DISK and AWAKE left out             ┃
          ┃                                                           ┃
          ┃   4 running · 1 stopped · PORTS: public · private         ┃
          ┃                                                           ┃
    - command: '--version >/dev/null; terminal --size 70x34 "$STATION" | /usr/bin/head -3'
      stdin: |
          see Needs you
          see station  ● This Mac
          gone MACHINES
          screen
          send q
      exit: 0
      stdout: |
          station  ● This Mac · Engine running · Awake off
           All machines › This Mac › Overview
          ┏━ Overview · This Mac ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
    - command: '--version >/dev/null; terminal --size 50x34 "$STATION"'
      stdin: |
          see station needs 60 × 16; this terminal is 50 × 34
          see station overview prints it
          send q
      exit: 0
    - command: '--version >/dev/null; terminal --size 110x12 "$STATION"'
      stdin: |
          see station needs 60 × 16; this terminal is 110 × 12 · station overview prints it
          send q
      exit: 0
