description: 'A password that is not in the vault is refused'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, subject, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"grants.remove","in":{"Entry":"pw-404","To":"linux-1","Confirm":"yes"}}
      exit: 0
      stdout: |
          {"code":"grant.unknown-entry","subject":"pw-404","message":"no password pw-404 in this Mac's vault"}
