description: 'A removal without yes asks first and removes nothing'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, subject, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"grants.remove","in":{"Entry":"pw-1","ToKind":"machine","To":"linux-1"}}
      exit: 0
      stdout: |
          {"code":"confirm.yes-needed","subject":"linux-1","message":"refusing without --yes: linux-1"}
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out | {mac: .Mac, entries: [.Entries[] | [.ID, .Label, .Program, .Kind, .AgentGrantable, [.Grants[] | [.ToKind, .To, .Until, .State]]]]}'''
      stdin: |
          {"v":2,"id":"1","watch":"vault.list","in":{}}
      exit: 0
      stdout: |
          {"mac":"jterrazz-macbook-pro","entries":[["pw-1","GitHub deploy","gh","fine-grained",true,[["machine","linux-1","2026-11-04T14:00:00Z","active"]]],["pw-2","npm publish","npm","token",false,[]],["pw-3","Claude Max","claude","oauth-token",false,[]]]}
