description: 'A workspace grants nothing: the vault is the Mac''s'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.this_mac = "linux-1"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, field, subject, message, hint} end'''
      stdin: |
          {"v":2,"id":"1","call":"grants.add","in":{"Entry":"pw-2","ToKind":"machine","To":"linux-1","For":3600000000000}}
      exit: 0
      stdout: |
          {"code":"section.not-for-this-machine","field":null,"subject":"linux-1","message":"passwords and grants are a Mac's","hint":"run station overview for what linux-1 has"}
