description: 'A password granted to a workspace lands there and stays until it is removed'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, field, subject, message, hint} end'''
      stdin: |
          {"v":2,"id":"1","call":"grants.add","in":{"Entry":"pw-1","ToKind":"machine","To":"linux-1"}}
      exit: 0
      stdout: |
          {}
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out | {verdict: .Verdict.Sentence, tone: .Verdict.Tone, rows: [.Programs[] | [.Program, .State, .How, .Action, .Line, .Ask]]}'''
      stdin: |
          {"v":2,"id":"1","watch":"accounts.list","in":{"Machine":"linux-1"}}
      exit: 0
      stdout: |
          {"verdict":"Signed in to 3 of 4 programs","tone":"plain","rows":[["gh","signed-in","granted","remove",null,"Remove GitHub? The grant ends here; the token stays yours."],["npm","signed-in","granted","remove",null,"Remove npm? The grant ends here; the token stays yours."],["claude","signed-in","own","sign-out",null,"Sign out of Claude? The token stays valid at Claude."],["wrangler","broken",null,"sign-in-again","Refused at the provider",null]]}
