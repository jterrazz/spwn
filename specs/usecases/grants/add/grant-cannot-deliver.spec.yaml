description: 'A grant that cannot reach the machine is refused and recorded nowhere'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].accounts.undeliverable = ["linux-1"]'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, field, subject, message, hint} end'''
      stdin: |
          {"v":2,"id":"1","call":"grants.add","in":{"Entry":"pw-1","ToKind":"machine","To":"linux-1","For":3600000000000}}
      exit: 0
      stdout: |
          {"code":"grant.cannot-deliver","field":null,"subject":"linux-1","message":"the grant could not reach linux-1: nothing was granted","hint":"check that linux-1 answers, then grant again"}
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out | {mac: .Mac, entries: [.Entries[] | [.ID, .Label, .Program, .Kind, .AgentGrantable, [.Grants[] | [.ToKind, .To, .Until, .State]]]]}'''
      stdin: |
          {"v":2,"id":"1","watch":"vault.list","in":{}}
      exit: 0
      stdout: |
          {"mac":"jterrazz-macbook-pro","entries":[["pw-1","GitHub deploy","gh","fine-grained",true,[]],["pw-2","npm publish","npm","token",false,[["machine","linux-1","{{iso8601}}","active"]]],["pw-3","Claude Max","claude","oauth-token",false,[]]]}
