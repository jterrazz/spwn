description: 'A grant to a machine may last until it is removed: it has no end time'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, field, subject, message, hint} end'''
      stdin: |
          {"v":2,"id":"1","call":"grants.add","in":{"Entry":"pw-2","ToKind":"machine","To":"linux-1","For":0}}
      exit: 0
      stdout: |
          {}
