description: 'A password that is not fine-grained is not one an agent may hold'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["macbook-pro"].vms["linux-1"].agents = {"journal": {"s1": {"name": "review-bot", "vm": "linux-1", "app": "claude-code", "session": "s1", "state": "working"}}}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, field, subject, message, hint} end'''
      stdin: |
          {"v":2,"id":"1","call":"grants.add","in":{"Entry":"pw-2","ToKind":"agent","To":"review-bot","Workspace":"linux-1"}}
      exit: 0
      stdout: |
          {"code":"grant.not-agent-grantable","field":null,"subject":"pw-2","message":"password pw-2 is not one an agent may hold","hint":"an agent holds a fine-grained token only"}
