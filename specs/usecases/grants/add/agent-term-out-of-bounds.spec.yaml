description: 'an agent''s grant never lasts until removed: a term of 0 is refused'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].vms["linux-1"].agents = {"journal": {"s1": {"name": "review-bot", "vm": "linux-1", "app": "claude-code", "session": "s1", "state": "working"}}}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, field, subject, message, hint} end'''
      stdin: |
          {"v":2,"id":"1","call":"grants.add","in":{"Entry":"pw-1","ToKind":"agent","To":"review-bot","Workspace":"linux-1","For":0}}
      exit: 0
      stdout: |
          {"code":"grant.term-out-of-bounds","field":"term","subject":"0s","message":"an agent's grant lasts 1 min to 7 d, never until removed, not 0s","hint":"ask for a term of 4h"}
