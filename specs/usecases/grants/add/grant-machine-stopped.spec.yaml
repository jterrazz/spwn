description: 'A stopped workspace has nowhere for a grant to land'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, field, subject, message, hint} end'''
      stdin: |
          {"v":2,"id":"1","call":"grants.add","in":{"Entry":"pw-2","ToKind":"machine","To":"api","For":3600000000000}}
      exit: 0
      stdout: |
          {"code":"grant.machine-stopped","field":null,"subject":"api","message":"api is stopped: a grant has nowhere to land","hint":"start it first"}
