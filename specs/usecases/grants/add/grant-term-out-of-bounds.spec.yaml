description: 'A term past 7 days is refused and names its field'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, field, subject, message, hint} end'''
      stdin: |
          {"v":2,"id":"1","call":"grants.add","in":{"Entry":"pw-2","ToKind":"machine","To":"linux-1","For":691200000000000}}
      exit: 0
      stdout: |
          {"code":"grant.term-out-of-bounds","field":"term","subject":"192h0m0s","message":"a grant lasts 1 min to 7 d, or until it is removed, not 192h0m0s","hint":"ask for a term of 4h"}
