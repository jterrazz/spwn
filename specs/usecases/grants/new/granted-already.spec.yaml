description: 'A machine already granted this password can be picked again'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out.Targets[] | [.To, .Fit, .Line]'''
      stdin: |
          {"v":2,"id":"1","watch":"grants.new","in":{"Entry":"pw-2"}}
      exit: 0
      stdout: |
          ["api","no","Start the machine first"]
          ["linux-1","fits","Granted already; granting again replaces it"]
          ["infra","no","A server keeps its own sign-ins"]
