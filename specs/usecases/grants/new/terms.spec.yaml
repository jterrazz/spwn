description: 'an agent stops at 7 days; a machine may also pick until removed'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out.Terms[] | [.ToKind, .For, .Label, .Default]'''
      stdin: |
          {"v":2,"id":"1","watch":"grants.new","in":{"Entry":"pw-1"}}
      exit: 0
      stdout: |
          ["machine",3600000000000,"1 hour",false]
          ["machine",14400000000000,"4 hours",false]
          ["machine",43200000000000,"12 hours",true]
          ["machine",86400000000000,"1 day",false]
          ["machine",604800000000000,"7 days",false]
          ["machine",0,"Until removed",false]
          ["agent",3600000000000,"1 hour",false]
          ["agent",14400000000000,"4 hours",false]
          ["agent",43200000000000,"12 hours",true]
          ["agent",86400000000000,"1 day",false]
          ["agent",604800000000000,"7 days",false]
