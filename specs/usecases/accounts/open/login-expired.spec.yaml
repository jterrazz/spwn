description: 'an exchange past its time is refused and opens nothing'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["macbook-pro"].accounts.exchanges = {"ex-9": {"program": "gh", "kind": "device-code", "site": "github.com", "expires": "2026-11-04T09:00:00Z"}}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, subject, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"accounts.open","in":{"Exchange":"ex-9"}}
      exit: 0
      stdout: |
          {"code":"login.expired","subject":"ex-9","message":"the sign-in expired before ex-9 was approved"}
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["macbook-pro"].accounts.opened'' world.json'
      exit: 0
      stdout: |
          null
