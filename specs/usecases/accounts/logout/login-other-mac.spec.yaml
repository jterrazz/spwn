description: 'a VM of another Mac is signed out by that Mac, not this one'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, subject, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"accounts.logout","in":{"Machine":"infra","Program":"gh","Confirm":"yes"}}
      exit: 0
      stdout: |
          {"code":"login.other-mac","subject":"jterrazz-mac-mini","message":"this sign-in runs on jterrazz-mac-mini, which another Mac holds"}
