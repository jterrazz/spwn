description: 'signing out gh, confirmed, leaves the row signed out'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out | [.Program, .State, .Action] else .error | {code, subject, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"accounts.logout","in":{"Program":"gh","Confirm":"yes"}}
      exit: 0
      stdout: |
          ["gh","","sign-out"]
