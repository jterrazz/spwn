description: 'gh gives a code to enter at github.com, then the row is signed in'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''del(.macs["macbook-pro"].accounts.programs.gh)'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out | if .Step then {step: [.Step.Kind, .Step.Code, .Step.Site, .Step.Exchange, .Step.Line, (.Step.Expires > .Step.Now), .Step.Title]} else {signed: [.Programs[0].Program, .Programs[0].State, .Programs[0].How, .Programs[0].Action]} end'''
      stdin: |
          {"v":2,"id":"1","watch":"accounts.login","in":{"Program":"gh"}}
      exit: 0
      stdout: |
          {"step":["device-code","WDJB-MJHT","github.com","ex-4","Enter this code at github.com. macbook-pro signs in by itself once you approve it.",true,"Sign in to gh on macbook-pro"]}
          {"signed":["gh","signed-in","own","sign-out"]}
