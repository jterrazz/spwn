description: 'a VM is signed in by the engine of its own Mac, and its row then reads signed in'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out | if .Step then {step: [.Step.Kind, .Step.Site, .Step.Line]} elif .Programs then {signed: [.Programs[] | select(.Program == "gh") | .State, .Action]} else . end'''
      stdin: |
          {"v":2,"id":"1","watch":"accounts.login","in":{"Machine":"linux-1","Program":"gh"}}
      exit: 0
      stdout: |
          {"step":["device-code","github.com","Enter this code at github.com"]}
          {"signed":["signed-in","sign-out"]}
