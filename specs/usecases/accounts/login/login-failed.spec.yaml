description: 'A login the provider turns down ends failed'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''del(.macs["jterrazz-macbook-pro"].accounts.programs.gh) | .macs["jterrazz-macbook-pro"].accounts.logins = {"gh": {"end": "failed"}}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.error) | .error | {code, field, subject, message, hint}'''
      stdin: |
          {"v":2,"id":"1","watch":"accounts.login","in":{"Program":"gh"}}
      exit: 0
      stdout: |
          {"code":"login.failed","field":null,"subject":"gh","message":"GitHub could not sign in","hint":"start the sign-in again"}
