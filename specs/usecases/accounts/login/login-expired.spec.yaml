description: 'A code never pasted back ends expired'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''del(.macs["jterrazz-macbook-pro"].accounts.programs.claude)'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.error) | .error | {code, field, subject, message, hint}'''
      stdin: |
          {"v":2,"id":"1","watch":"accounts.login","in":{"Program":"claude"}}
      exit: 0
      stdout: |
          {"code":"login.expired","field":null,"subject":"claude","message":"the sign-in expired before Claude was approved","hint":"start the sign-in again"}
