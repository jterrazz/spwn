description: 'A stopped VM has no action: its rows say to start it first'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out | {verdict: .Verdict.Sentence, tone: .Verdict.Tone, rows: [.Programs[] | [.Program, .State, .How, .Action, .Line, .Ask]]}'''
      stdin: |
          {"v":2,"id":"1","watch":"accounts.list","in":{"Machine":"api"}}
      exit: 0
      stdout: |
          {"verdict":"api is stopped: its sign-ins are read when it runs","tone":"warn","rows":[["gh","signed-out",null,"none","Start the machine first",null],["npm","signed-out",null,"none","Start the machine first",null],["claude","signed-out",null,"none","Start the machine first",null],["wrangler","signed-out",null,"none","Start the machine first",null]]}
