description: 'settings.json becomes preferences.json once, and every command then reads it: the Mac keeps its name'
env: fresh-v2
runs:
    - command: 'init > /dev/null; /usr/bin/jq -c ''.macs["macbook-pro"] | [(.files // {} | keys), .preferences.name]'' world.json'
      exit: 0
      stdout: |
          [[],"macbook-pro"]
    - command: 'machines --this-mac'
      exit: 0
      stdout: |
          ✗	macbook-pro	Mac	macbook-pro	Engine not installed
          # Needs you
          ◐	This Mac	has no engine installed	station engine start
