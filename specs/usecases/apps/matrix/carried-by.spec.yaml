description: 'apps.matrix: a column per Mac and workspace, a row per app some machine carries, and its count'
env:
    - two-macs
    - engine
runs:
    - command: 'guest serve --stdio | /usr/bin/jq -c ''{columns: [.out.Columns[] | .Name], servers: .out.Servers, rows: [.out.Rows[] | select(.Name == "node" or .Name == "ghostty") | {n: .Name, carry: .Carry, of: .Of, cells: [.Cells[] | {s: .State, v: .Version, newest: .Newest, here: (.NotHere | not)}]}]}'''
      stdin: |
          {"v":2,"id":"1","call":"apps.matrix","target":{},"in":{}}
      exit: 0
      stdout: |
          {"columns":["jterrazz-macbook-pro","jterrazz-mac-mini","linux-1","api"],"servers":["infra"],"rows":[{"n":"node","carry":2,"of":3,"cells":[{"s":"update-available","v":"22.11.0","newest":"24.11.0","here":true},{"s":"not-installed","v":"","newest":"","here":true},{"s":"ok","v":"22.11.0","newest":"","here":true},{"s":"not-known","v":"","newest":"","here":true}]},{"n":"ghostty","carry":1,"of":2,"cells":[{"s":"ok","v":"1.2.0","newest":"","here":true},{"s":"not-installed","v":"","newest":"","here":true},{"s":"not-installed","v":"","newest":"","here":false},{"s":"not-known","v":"","newest":"","here":true}]}]}
