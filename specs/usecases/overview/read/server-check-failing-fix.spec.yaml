description: 'a server whose check fails needs you on its Mac''s Overview, its fix the restart of it by name'
env:
    - stories
    - engine
runs:
    - command: 'overview --on mac-mini | /usr/bin/grep infra'
      exit: 0
      stdout: |
          ✗	infra check failing since 10:18	station machines restart infra
          	VMs	● infra running · ● linux-3 running · ● review-bot running
