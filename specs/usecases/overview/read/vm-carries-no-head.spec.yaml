description: 'a running VM''s Overview comes as its guest answers it, with no head of its own'
env:
    - stories
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out.Summary.Head | [.Name, has("Verdict")]'' | /usr/bin/tail -1'
      stdin: |
          {"v":2,"id":"1","watch":"overview.read","target":{"name":"linux-1"},"in":{}}
      exit: 0
      stdout: |
          ["linux-1",false]
