description: 'the play world''s Overview holds what needs you, port 5000 first, beside what can wait'
env:
    - stories
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out.Summary | [.Verdict, [.Needs[] | [.Subject, .Upkeep, .Verb]]]'' | /usr/bin/tail -1'
      stdin: |
          {"v":2,"id":"1","watch":"overview.read","in":{}}
      exit: 0
      stdout: |
          [{"Tone":"bad","Sentence":"2 things need you.","Line":"port 5000 is reachable outside Tailscale"},[["macbook-pro:5000","needs-you","review"],["com.example.brain.x-snapshot","needs-you","remove"],["firewall","can-wait","fix"]]]
