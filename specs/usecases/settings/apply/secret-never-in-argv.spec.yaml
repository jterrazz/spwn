description: 'a setting password is never an argument: no flag takes it, a value on the line is refused'
env: two-macs
runs:
    - command: 'settings apply autologin --password sk-ant-oat01-x'
      exit: 2
      stderr: |
          Error: unknown flag: --password
          Hint: run station settings apply --help
    - command: 'settings apply autologin sk-ant-oat01-x'
      exit: 2
      stderr: |
          Error: autologin asks a value: run it on a terminal
          Hint: station settings apply autologin
    - command: '--version >/dev/null; /usr/bin/grep -c sk-ant world.json'
      exit: 1
      stdout: |
          0
