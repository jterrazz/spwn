description: 'settings.matrix: the shelf counts the settings some machine holds and those the catalog holds'
env:
    - two-macs
    - engine
runs:
    - command: 'guest serve --stdio | /usr/bin/jq -c ''{shelf: .out.Verdict, holds: [.out.Rows[] | select(.Name == "firewall") | {n: .Name, holds: [.Cells[] | .Holds]}]}'''
      stdin: |
          {"v":2,"id":"1","call":"settings.matrix","target":{},"in":{}}
      exit: 0
      stdout: |
          {"shelf":{"Mine":{"Tone":"plain","Sentence":"4 settings are on your machines"},"Catalog":{"Tone":"plain","Sentence":"25 settings are in the catalog"}},"holds":[{"n":"firewall","holds":[true,true,false,false]}]}
