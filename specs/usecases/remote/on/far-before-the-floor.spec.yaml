description: 'a far Mac on a release before the floor is refused whatever it serves; a build of no release is not'
env: mini-old
runs:
    - command: 'world upgrade mac-mini v0.0.9'
      exit: 0
    - command: 'ports declare 5000 --via lan --on mac-mini'
      exit: 1
      stderr: |
          Error: mac-mini runs station v0.0.9: this station speaks to v0.1.0 and later
          Hint: update station on mac-mini (scripts/install.sh there)
    - command: 'world upgrade mac-mini v0.0.9-3-gabcdef1'
      exit: 0
    - command: 'ports declare 5000 --via lan --on mac-mini'
      exit: 0
      stdout: |
          	On mac-mini:
          ●	5000 on mac-mini	declared public (your LAN)
