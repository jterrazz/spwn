description: 'machines.list says what holds each VM: a server always on, a VM of yours kept until you delete it'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | [.out.All.Macs[].VMs[]? | [.Name, .Hold]]'' | /usr/bin/tail -1'
      stdin: |
          {"v":2,"id":"1","watch":"machines.list","in":{}}
      exit: 0
      stdout: |
          [["api",{"State":"yours","Sentence":"Yours. Stays until you delete it."}],["linux-1",{"State":"yours","Sentence":"Yours. Deleted when it powers off."}],["infra",{"State":"always-on","Sentence":"Always on. Stopping it needs its name typed."}]]
