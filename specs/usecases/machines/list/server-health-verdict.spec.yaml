description: 'machines.list carries each server''s health verdict and what the engine kept of its check'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | [.out.All.Macs[].VMs[]? | [.Name, .Health, .LatencyNote]]'' | /usr/bin/tail -1'
      stdin: |
          {"v":2,"id":"1","watch":"machines.list","in":{}}
      exit: 0
      stdout: |
          [["api",null,null],["linux-1",null,null],["infra",{"Tone":"ok","Sentence":"Healthy."},"The engine kept one check so far."]]
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | [.out.All.Macs[] | [.Name, .Engine.State]]'' | /usr/bin/tail -1'
      stdin: |
          {"v":2,"id":"1","watch":"machines.list","in":{}}
      exit: 0
      stdout: |
          [["macbook-pro","running"],["mac-mini","running"]]
