description: 'a running VM its Mac has not read, its guest not connected, heads its row only running and pending'
env:
    - stories
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''del(.macs["macbook-pro"].vms["linux-1"].guest) | del(.macs["macbook-pro"].engine.memory["linux-1"].drift)'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | [.out.All.Macs[].VMs[]? | select(.Name == "linux-1") | [.Head, .Pending]][0]'' | /usr/bin/tail -1'
      stdin: |
          {"v":2,"id":"1","watch":"machines.list","in":{"ThisMac":true}}
      exit: 0
      stdout: |
          [{"Tone":"ok","Sentence":"Running.","Line":"Lot L2.5, settings from a machine file. Up 2 h."},true]
