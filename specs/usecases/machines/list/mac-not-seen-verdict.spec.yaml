description: 'a Mac that does not answer says since when it is not seen, never down, and its VMs read not seen'
env:
    - mini-offline
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | [.out.All.Macs[] | [.Name, .Unseen, [.VMs[]? | [.Name, .State, .Hold.State]]]]'' | /usr/bin/tail -1'
      stdin: |
          {"v":2,"id":"1","watch":"machines.list","in":{}}
      exit: 0
      stdout: |
          [["macbook-pro",null,[["api","stopped","yours"],["linux-1","running","yours"]]],["mac-mini",{"Tone":"plain","Sentence":"mac-mini has not been seen for 6 h.","Line":"Nothing proves it is down: it may be asleep, or off your network."},[["infra","unknown","not-seen"]]]]
