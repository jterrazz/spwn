description: 'a Mac with no VM rolls up empty, beside one whose server is down'
env:
    - standings
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | [[.out.All.Macs[] | [.Name, .Standing, .Machines.State, .Machines.N]], [.out.All.Standing.State, .out.All.Standing.N]]'' | /usr/bin/tail -1'
      stdin: |
          {"v":2,"id":"1","watch":"machines.list","in":{}}
      exit: 0
      stdout: |
          [[["macbook-pro","online","down",1],["mac-mini","online","empty",null]],["down",1]]
