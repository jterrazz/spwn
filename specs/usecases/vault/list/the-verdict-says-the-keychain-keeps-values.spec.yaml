description: 'the passwords verdict says under its count that a value never leaves the Keychain'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out.Verdict | [.Sentence, .Line]'''
      stdin: |
          {"v":2,"id":"1","watch":"vault.list","in":{}}
      exit: 0
      stdout: |
          ["3 kept, 1 granted","a value never leaves this Mac's Keychain to be shown"]
