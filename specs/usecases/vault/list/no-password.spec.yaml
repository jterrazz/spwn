description: 'A Mac that keeps no password says so in its verdict'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].accounts.passwords = []'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out | [.Verdict.Sentence, .Verdict.Tone, (.Entries | length)]'''
      stdin: |
          {"v":2,"id":"1","watch":"vault.list","in":{}}
      exit: 0
      stdout: |
          ["No password kept yet","plain",0]
