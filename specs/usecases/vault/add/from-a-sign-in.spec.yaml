description: 'A password taken from this Mac''s gh sign-in is kept as the kind gh holds'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, field, subject, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"vault.add","in":{"Label":"my gh","Program":"gh","From":"sign-in"}}
      exit: 0
      stdout: |
          {"ID":"pw-4"}
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out | {mac: .Mac, entries: [.Entries[] | [.ID, .Label, .Program, .Kind, .AgentGrantable, [.Grants[] | [.ToKind, .To]]]]}'''
      stdin: |
          {"v":2,"id":"1","watch":"vault.list","in":{}}
      exit: 0
      stdout: |
          {"mac":"macbook-pro","entries":[["pw-1","GitHub deploy","gh","fine-grained",true,[]],["pw-2","npm publish","npm","token",false,[["machine","linux-1"]]],["pw-3","Claude Max","claude","oauth-token",false,[]],["pw-4","my gh","gh","oauth-token",false,[]]]}
