description: 'the mini keeps a password in its own vault'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.this_mac = "mac-mini"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, field, subject, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"vault.add","in":{"Label":"ci","Program":"npm","Kind":"token","From":"typed","Value":"correct horse"}}
      exit: 0
      stdout: |
          {"ID":"pw-1"}
