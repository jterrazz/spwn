description: 'a password cannot be taken from a sign-in that is not there'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''del(.macs["jterrazz-macbook-pro"].accounts.programs.gh)'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, field, subject, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"vault.add","in":{"Label":"gh","Program":"gh","Kind":"token","From":"sign-in"}}
      exit: 0
      stdout: |
          {"code":"vault.not-signed-in","field":null,"subject":"gh","message":"GitHub is not signed in on this Mac: there is nothing to add"}
