description: 'A typed password sent without a kind is refused as unreadable input'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, field, subject, message, hint} end'''
      stdin: |
          {"v":2,"id":"1","call":"vault.add","in":{"Label":"docs","Program":"gh","From":"typed","Value":"FAKE000"}}
      exit: 0
      stdout: |
          {"code":"call.bad-input","field":null,"subject":"vault.add","message":"vault.add cannot read its input","hint":"check the request against Kind"}
