description: 'A removal without yes asks first and removes nothing'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out | [.Removed[] | .To] else .error | {code, subject, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"vault.remove","in":{"ID":"pw-2"}}
      exit: 0
      stdout: |
          {"code":"confirm.yes-needed","subject":"pw-2","message":"refusing without --yes: pw-2"}
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out | {mac: .Mac, entries: [.Entries[] | [.ID, .Label, .Program, .Kind, [.Grants[] | .To]]]}'''
      stdin: |
          {"v":2,"id":"1","watch":"vault.list","in":{}}
      exit: 0
      stdout: |
          {"mac":"macbook-pro","entries":[["pw-1","GitHub deploy","gh","fine-grained",[]],["pw-2","npm publish","npm","token",["linux-1"]],["pw-3","Claude Max","claude","oauth-token",[]]]}
