description: 'the mini removes a password from its own vault'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["mac-mini"].accounts.passwords = [{"ID": "pw-1", "Label": "ci", "Program": "npm", "Kind": "token", "Added": "2026-10-30T09:00:00Z", "AgentGrantable": false, "Grants": []}]'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq ''.this_mac = "mac-mini"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out | [.Removed[] | [.ToKind, .To]] else .error | {code, subject, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"vault.remove","in":{"ID":"pw-1","Confirm":"yes"}}
      exit: 0
      stdout: |
          []
