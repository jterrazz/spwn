description: 'the mini frees what nothing uses on its own disk: this mac''s old image is none of its, and stays'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.this_mac = "mac-mini"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.error) | .error | {code, subject}'''
      stdin: |
          {"v":2,"id":"1","call":"disk.free-unused","in":{"Names":["station-linux@2026.10.20"],"Confirm":"station-linux@2026.10.20"}}
      exit: 0
      stdout: |
          {"code":"disk.not-freeable","subject":"station-linux@2026.10.20"}
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["macbook-pro"].vms | keys'' world.json'
      exit: 0
      stdout: |
          ["api","linux-1","station-image-station-linux-2026.10.20","station-image-station-linux-2026.11.01"]
