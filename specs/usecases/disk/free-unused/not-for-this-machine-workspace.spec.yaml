description: 'inside a workspace, free-unused is refused: only a mac makes vms'
env:
    - in-workspace
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.error) | .error | {code, message}'''
      stdin: |
          {"v":2,"id":"1","call":"disk.free-unused","in":{"Names":["base-ubuntu@2026.10.20"],"Confirm":"base-ubuntu@2026.10.20"}}
      exit: 0
      stdout: |
          {"code":"section.not-for-this-machine","message":"linux-1 holds no machine disk: only a Mac makes VMs"}
