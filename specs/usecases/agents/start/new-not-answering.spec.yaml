description: 'an ephemeral workspace that is silent is kept, its agent not started, and the failure says why'
env: two-macs
runs:
    - command: 'world fault Guest.Serve'
      exit: 0
    - command: 'agents start "Build the landing page" --new --memory 4G'
      exit: 1
      stderr: |
          Error: linux-2 does not answer
          Hint: station machines linux-2
    - command: 'machines --this-mac | /usr/bin/grep linux-2'
      exit: 0
      stdout: |
          ●	linux-2	Workspace	macbook-pro	Running · ephemeral	4 CPU	4 GB
