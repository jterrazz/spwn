description: 'a reboot of its Mac leaves every workspace stopped and kept: a workspace never starts by itself'
env: two-macs
runs:
    - command: 'world reboot macbook-pro'
      exit: 0
    - command: 'machines --this-mac'
      exit: 0
      stdout: |
          ●	macbook-pro	Mac	macbook-pro	Engine running
          ○	api	Workspace	macbook-pro	Stopped · persistent	4 CPU	8 GB
          ○	linux-1	Workspace	macbook-pro	Stopped · ephemeral	4 CPU	8 GB	ended with its Mac
