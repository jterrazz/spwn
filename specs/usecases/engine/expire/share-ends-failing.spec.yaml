description: 'an ended share the VM fails to delete keeps its copy and its share, and is told'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["linux-1"].secrets = {"session:github": "fake-session-github-of-this-mac"} | .macs["macbook-pro"].stores.shares = {"linux-1": [{"name": "session:github", "at": "2026-11-04T10:00:00Z", "until": "2026-11-04T14:00:00Z"}]}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'world fault Guest.Exec'
      exit: 0
    - command: 'world advance 4h'
      exit: 0
    - command: '--version >/dev/null; "$STATION" accounts > /dev/null'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq -c ''[(.macs["linux-1"].secrets // {} | keys), (.macs["macbook-pro"].stores.shares["linux-1"] // [] | map(.name))]'' world.json; /usr/bin/jq -c ''[.told[] | [.Kind, .Subject, .Text]] | unique'' world.json'
      exit: 0
      stdout: |
          [["session:github"],["session:github"]]
          [["take_back_failed","linux-1 share","taking GitHub back failed: deleting the copies failed for \"linux-1\": studio: the credential store is not writable"]]
