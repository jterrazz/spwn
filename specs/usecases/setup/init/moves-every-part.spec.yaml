description: 'init moves every part of the old homes it relocates, and disk flags none of them after'
env: fresh
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["macbook-pro"].disk.files = {"~/.bun/install/global/node_modules/skills/cli.mjs": 180000000, "~/.bun/bin/bun": 52000000, "~/.bun/install/cache/skills@1.0.0/package.json": 64000, "~/.bun/_bun": 8000, "~/go/bin/golangci-lint": 59000000, "~/go/pkg/mod/cache/download/x": 2300000, "~/go/pkg/sumdb/sum.golang.org/latest": 4000, "~/.npm/_cacache/index-v5/x": 800000}'' world.json > next.json && /bin/mv next.json world.json'
      exit: 0
    - command: 'init --name macbook-pro --yes > /dev/null'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["macbook-pro"].disk.files | keys'' world.json'
      exit: 0
      stdout: |
          ["~/.cache/bun/install/skills@1.0.0/package.json","~/.cache/go/mod/cache/download/x","~/.cache/npm/_cacache/index-v5/x","~/.local/share/bun/bin/bun","~/.local/share/bun/install/global/node_modules/skills/cli.mjs","~/.local/share/go/bin/golangci-lint","~/.local/share/go/pkg/sumdb/sum.golang.org/latest"]
    - command: 'disk --json | /usr/bin/jq -c .findings'
      exit: 0
      stdout: |
          []
