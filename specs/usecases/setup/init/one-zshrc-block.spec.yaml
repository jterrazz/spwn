description: 'init rewrites an edited station block into the one block, keeping the owner''s lines'
fixture: ./__fixtures__/edited-zshrc/
env: fresh
runs:
    - command: 'init --name macbook-pro > /dev/null'
      exit: 0
    - command: 'init > /dev/null; /usr/bin/grep -c "^# >>> station >>>$" .zshrc; /bin/cat .zshrc'
      exit: 0
      stdout: |
          1
          export EDITOR=vim


          alias gs='git status'

          # >>> station >>>
          export PATH="$HOME/.local/bin:$PATH"
          command -v station >/dev/null 2>&1 && eval "$(station shell zsh)"
          # <<< station <<<
