description: 'piped without --yes, init says what it would move, then is refused before any step'
env: fresh
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["macbook-pro"].disk.files = {"~/.bun/install/global/node_modules/skills/cli.mjs": 180000000, "~/.bun/bin/bun": 52000000, "~/.bun/install/cache/skills@1.0.0/package.json": 64000, "~/.bun/_bun": 8000, "~/go/bin/golangci-lint": 59000000, "~/go/pkg/mod/cache/download/x": 2300000, "~/go/pkg/sumdb/sum.golang.org/latest": 4000, "~/.npm/_cacache/index-v5/x": 800000}'' world.json > next.json && /bin/mv next.json world.json'
      exit: 0
    - command: 'init --name macbook-pro'
      exit: 2
      stdout: |
          # To move
          ○	~/.bun/install/global	to ~/.local/share/bun/install/global	180 MB
          ○	~/.bun/bin	to ~/.local/share/bun/bin	52.0 MB
          ○	~/.bun/install/cache	to ~/.cache/bun/install	64.0 KB
          ○	~/.bun/_bun	deleted: its app writes it again	8.0 KB
          ○	~/go/bin	to ~/.local/share/go/bin	59.0 MB
          ○	~/go/pkg/mod	to ~/.cache/go/mod	2.3 MB
          ○	~/go/pkg/sumdb	to ~/.local/share/go/pkg/sumdb	4.0 KB
          ○	~/.npm	to ~/.cache/npm	800 KB
      stderr: |
          Error: refusing to move the apps' files without --yes
          Hint: re-run with --yes
      files:
          .zshrc: absent
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["macbook-pro"].disk.files | keys'' world.json'
      exit: 0
      stdout: |
          ["~/.bun/_bun","~/.bun/bin/bun","~/.bun/install/cache/skills@1.0.0/package.json","~/.bun/install/global/node_modules/skills/cli.mjs","~/.npm/_cacache/index-v5/x","~/go/bin/golangci-lint","~/go/pkg/mod/cache/download/x","~/go/pkg/sumdb/sum.golang.org/latest"]
