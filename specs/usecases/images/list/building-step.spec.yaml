description: 'an image being built is listed at its step, Step 2 of 4, and is never offered Delete'
env:
    - creating
    - engine
runs:
    - command: 'guest serve --stdio | /usr/bin/jq -s -c ''[.[] | select(.out)] | last | .out | map([.Record.name, .Record.version, .Newest, .Deletable, .Building])'''
      stdin: |
          {"v":2,"id":"1","call":"images.list","in":{}}
      exit: 0
      stdout: |
          [["base-ubuntu","2026.11.04",false,false,{"Step":"packages","Position":2,"Steps":4,"Sentence":"Step 2 of 4"}]]
    - command: 'images'
      exit: 0
      stdout: |
          ○	base-ubuntu	2026.11.04		macbook-pro	building: Packages, Step 2 of 4
          ○	base-macos				not built yet
    - command: 'images --json | /usr/bin/jq -c ''.images'''
      exit: 0
      stdout: |
          [{"name":"base-ubuntu","version":"2026.11.04","size_bytes":0,"mac":"macbook-pro","vms":[],"newest":false,"deletable":false,"building":"Step 2 of 4"}]
