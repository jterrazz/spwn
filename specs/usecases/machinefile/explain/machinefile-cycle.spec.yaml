description: 'a cycle of extends is printed around its loop'
env: two-macs
runs:
    - command: 'world edit macbook-pro machinefiles/jterrazz-base.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-base
          extends: [macbook-pro]
      exit: 0
    - command: 'world edit macbook-pro machinefiles/macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: macbook-pro
          machine: { kind: computer, system: { os: macos } }
          extends: [jterrazz-base]
      exit: 0
    - command: 'explain'
      exit: 2
      stderr: |
          Error: a cycle in extends: macbook-pro extends jterrazz-base extends macbook-pro
          Hint: break it: one of them must not need the other
