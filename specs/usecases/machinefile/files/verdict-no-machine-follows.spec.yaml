description: 'no machine follows a file: the page says so, plain'
env:
    - stories
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''del(.macs["macbook-pro"].preferences.machinefile) | del(.macs["macbook-pro"].vms[]?.kept.template)'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'guest serve --stdio | /usr/bin/jq -c ''.out.Verdict'''
      stdin: |
          {"v":2,"id":"1","call":"machinefile.files","target":{},"in":{}}
      exit: 0
      stdout: |
          {"Tone":"plain","Sentence":"No machine follows a file."}
