description: 'the files station ships say what they are, and a file that says nothing has an empty description'
env:
    - stories
    - engine
runs:
    - command: 'guest serve --stdio | /usr/bin/jq -c ''.out.Files[] | {name: .Name, shelf: .Shelf, description: .Description}'''
      stdin: |
          {"v":2,"id":"1","call":"machinefile.files","target":{},"in":{}}
      exit: 0
      stdout: |
          {"name":"base","shelf":"yours","description":""}
          {"name":"linux-1","shelf":"yours","description":""}
          {"name":"linux-dev","shelf":"yours","description":""}
          {"name":"macbook-pro","shelf":"yours","description":""}
          {"name":"station-linux","shelf":"shipped","description":"A Linux workspace with the runtime manager, git, zsh, Docker and headless Chromium's libraries"}
          {"name":"station-macos","shelf":"shipped","description":"A macOS workspace with Homebrew, git and zsh"}
          {"name":"studio-linux","shelf":"yours","description":""}
