description: 'a provider silent past its budget reads late and never holds the answer'
fixture:
    - ./__fixtures__/accounts/
env: engine
runs:
    - command: '--version >/dev/null; /bin/mkdir -p root; /bin/mkdir -p answers/accounts; echo slow > answers/accounts/gh.mode; echo 30 > answers/accounts/gh.slow; s=$(/bin/date +%s); n=0; { printf ''%s\n'' ''{"v":1,"type":"hello","host":"macbook","vm":"api","keys":[],"env":{},"ignored":[22],"min_port":1024}'' ''{"v":1,"type":"request","id":"h1","op":"accounts"}''; while ! /usr/bin/grep -q ''"type":"reply"'' out.jsonl 2>/dev/null && [ $n -lt 200 ]; do /bin/sleep 0.1; n=$((n+1)); done; } | STATION_MACHINE_KIND=linux STATION_SYSTEM_ROOT=$PWD/root "$STATION" guest > out.jsonl; e=$(/bin/date +%s); [ $((e - s)) -lt 7 ] && echo fast; /usr/bin/jq -r ''select(.type == "reply") | .result[] | select(.provider == "github") | [.provider, .state, .reason, .detail] | @tsv'' out.jsonl; /usr/bin/jq ''select(.type == "reply") | .result | length'' out.jsonl'
      exit: 0
      stdout: |
          fast
          github	degraded	late	no answer in 5s
          8
