description: 'docker is read only where a credential store is configured, and a credential is never fetched'
fixture:
    - ./__fixtures__/accounts/
env: engine
runs:
    - command: '--version >/dev/null; /bin/mkdir -p root; n=0; { printf ''%s\n'' ''{"v":1,"type":"hello","host":"macbook","vm":"api","keys":[],"env":{},"ignored":[22],"min_port":1024}'' ''{"v":1,"type":"request","id":"h1","op":"accounts"}''; while ! /usr/bin/grep -q ''"type":"reply"'' out.jsonl 2>/dev/null && [ $n -lt 200 ]; do /bin/sleep 0.1; n=$((n+1)); done; } | STATION_MACHINE_KIND=linux STATION_SYSTEM_ROOT=$PWD/root "$STATION" guest > out.jsonl; /usr/bin/jq -r ''select(.type == "reply") | .result[] | select(.provider == "docker") | [.provider, .state, (.identity // [] | join(", ")), .detail] | @tsv'' out.jsonl; /usr/bin/grep -c "docker-credential-osxkeychain list" .calls; /usr/bin/grep -c "docker-credential-osxkeychain get" .calls'
      exit: 1
      stdout: |
          docker	ok	deploy	
          1
          0
    - command: '--version >/dev/null; /bin/rm .docker/config.json out.jsonl; n=0; { printf ''%s\n'' ''{"v":1,"type":"hello","host":"macbook","vm":"api","keys":[],"env":{},"ignored":[22],"min_port":1024}'' ''{"v":1,"type":"request","id":"h1","op":"accounts"}''; while ! /usr/bin/grep -q ''"type":"reply"'' out.jsonl 2>/dev/null && [ $n -lt 200 ]; do /bin/sleep 0.1; n=$((n+1)); done; } | STATION_MACHINE_KIND=linux STATION_SYSTEM_ROOT=$PWD/root "$STATION" guest > out.jsonl; /usr/bin/jq ''select(.type == "reply") | [.result[] | select(.provider == "docker")] | length'' out.jsonl'
      exit: 0
      stdout: |
          0
