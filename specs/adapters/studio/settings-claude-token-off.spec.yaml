description: 'off on the Claude token deletes it from studio, and it is off here'
fixture:
    - ./__fixtures__/settings-studio/
runs:
    - command: 'settings off claude-token --yes'
      exit: 0
      stdout: |
          ●	claude-token	operator:claude:oauth-token: deleted from the studio credential store
      files:
          .calls:
              equals: |
                  studio credentials export operator:claude:oauth-token
                  studio credentials delete operator:claude:oauth-token
          .config/station/preferences.json:
              equals: |
                  {
                    "off_here": [
                      "claude-token"
                    ]
                  }
