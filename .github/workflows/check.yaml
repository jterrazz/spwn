name: Check

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

# invariant: every job calls one Makefile gesture, and Turborepo reads go.work and pnpm-workspace.yaml into one task graph, so a job needs pnpm even when its work is pure Go; a job running anything `make` does not is a bug
# value: each job restores and saves the Turborepo cache at .artifacts/turbo under a key of its own, one entry per run, restored by prefix (this branch's newest run, then any branch on this lockfile, then any), because two jobs saving one key race, and a job only replays the tasks it ran

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-26.04-arm
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.25'
                  cache-dependency-path: apps/cli/go.sum
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - uses: actions/cache/restore@v4
              id: turbo
              with:
                  path: .artifacts/turbo
                  key: turbo-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
                  restore-keys: |
                      turbo-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
                      turbo-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-
                      turbo-lint-${{ runner.os }}-${{ runner.arch }}-
            - run: make lint
            - uses: actions/cache/save@v4
              if: always()
              with:
                  path: .artifacts/turbo
                  key: ${{ steps.turbo.outputs.cache-primary-key }}-${{ github.run_id }}

    test:
        name: Test
        runs-on: ubuntu-26.04-arm
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.25'
                  cache-dependency-path: apps/cli/go.sum
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm -C specs exec playwright install --with-deps chromium-headless-shell
            - uses: actions/cache/restore@v4
              id: turbo
              with:
                  path: .artifacts/turbo
                  key: turbo-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
                  restore-keys: |
                      turbo-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
                      turbo-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-
                      turbo-test-${{ runner.os }}-${{ runner.arch }}-
            - run: make test
            - uses: actions/cache/save@v4
              if: always()
              with:
                  path: .artifacts/turbo
                  key: ${{ steps.turbo.outputs.cache-primary-key }}-${{ github.run_id }}

    mutation:
        name: Mutation
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-26.04-arm
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.25'
                  cache-dependency-path: apps/cli/go.sum
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - uses: actions/cache/restore@v4
              id: turbo
              with:
                  path: .artifacts/turbo
                  key: turbo-mutation-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
                  restore-keys: |
                      turbo-mutation-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
                      turbo-mutation-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-
                      turbo-mutation-${{ runner.os }}-${{ runner.arch }}-
            - run: make mutation
            - uses: actions/cache/save@v4
              if: always()
              with:
                  path: .artifacts/turbo
                  key: ${{ steps.turbo.outputs.cache-primary-key }}-${{ github.run_id }}

    e2e:
        name: E2E
        timeout-minutes: 40
        runs-on: ubuntu-26.04-arm
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.25'
                  cache-dependency-path: apps/cli/go.sum
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - uses: actions/cache/restore@v4
              id: turbo
              with:
                  path: .artifacts/turbo
                  key: turbo-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
                  restore-keys: |
                      turbo-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
                      turbo-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-
                      turbo-e2e-${{ runner.os }}-${{ runner.arch }}-
            - run: make test-go-e2e
            - run: make test-compile-e2e
            - uses: actions/cache/save@v4
              if: always()
              with:
                  path: .artifacts/turbo
                  key: ${{ steps.turbo.outputs.cache-primary-key }}-${{ github.run_id }}

    # value: the smoke specs build world images from scratch, about ten minutes cold, so they run on main alone
    smoke:
        name: Smoke
        if: github.event_name == 'push'
        timeout-minutes: 30
        runs-on: ubuntu-26.04-arm
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.25'
                  cache-dependency-path: apps/cli/go.sum
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - uses: actions/cache/restore@v4
              id: turbo
              with:
                  path: .artifacts/turbo
                  key: turbo-smoke-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
                  restore-keys: |
                      turbo-smoke-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
                      turbo-smoke-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-
                      turbo-smoke-${{ runner.os }}-${{ runner.arch }}-
            - run: make test-smoke
            - uses: actions/cache/save@v4
              if: always()
              with:
                  path: .artifacts/turbo
                  key: ${{ steps.turbo.outputs.cache-primary-key }}-${{ github.run_id }}

    build:
        name: Build
        runs-on: ubuntu-26.04-arm
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.25'
                  cache-dependency-path: apps/cli/go.sum
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - uses: actions/cache/restore@v4
              id: turbo
              with:
                  path: .artifacts/turbo
                  key: turbo-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
                  restore-keys: |
                      turbo-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
                      turbo-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-
                      turbo-build-${{ runner.os }}-${{ runner.arch }}-
            - run: make build
            - uses: actions/cache/save@v4
              if: always()
              with:
                  path: .artifacts/turbo
                  key: ${{ steps.turbo.outputs.cache-primary-key }}-${{ github.run_id }}
