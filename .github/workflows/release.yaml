name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    # value: a release ships three things — the CLI, built by goreleaser into the release this job opens (its cross-compiled matrix, checksums and archives); the Tauri desktop app, built, signed and notarized by the shared reusable workflow, which bundles the CLI as a sidecar and so rebuilds it on disk; and the updater manifest, latest.json, signed from the desktop archives once they are uploaded
    cli:
        name: CLI release
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-go@v5
              with:
                  go-version: '1.25'
                  cache-dependency-path: apps/cli/go.sum

            - name: Run GoReleaser
              uses: goreleaser/goreleaser-action@v6
              with:
                  version: '~> v2'
                  args: release --clean
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # value: the desktop app and its updater manifest are off (`if: false`) until the signing and notarization secrets are in place; the CLI job alone serves `curl | bash` and `spwn upgrade`
    desktop:
        name: Desktop release
        if: false
        needs: cli
        uses: jterrazz/jterrazz-actions/.github/workflows/release-tauri.yaml@main
        with:
            project-path: apps/web
            go-version: '1.25'
            pre-build-script: |
                # invariant: the embedded catalog is a gitignored mirror only `go generate` writes; every build needs it first
                cd packages/dependency && go generate ./... && cd ../..
                cd apps/cli && go build -o ../../.artifacts/go/spwn ./cmd/spwn
                cd ../..
            release-name: 'spwn ${{ github.ref_name }}'
            release-body: 'CLI + desktop app for managing AI agent worlds'
        secrets: inherit

    updater:
        name: Updater manifest
        if: false
        needs: desktop
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust (for cargo-tauri signer)
              uses: dtolnay/rust-toolchain@stable

            - name: Install tauri-cli
              run: cargo install tauri-cli --version "^2" --locked

            - name: Download release artifacts and generate latest.json
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              run: |
                  set -euo pipefail
                  TAG="${{ github.ref_name }}"
                  VERSION="${TAG#v}"
                  REPO="${{ github.repository }}"
                  BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
                  WORKDIR=$(mktemp -d)

                  sign_and_add() {
                    local platform="$1" asset="$2"
                    local url="${BASE_URL}/${asset}"

                    echo "Processing ${platform} → ${asset}"

                    if ! gh release download "${TAG}" --pattern "${asset}" --dir "${WORKDIR}" 2>/dev/null; then
                      echo "  Skipping ${platform}: ${asset} not found"
                      return 1
                    fi

                    # hazard: the key is passed from the environment, never a file, whose encoding the signer misreads
                    cargo tauri signer sign \
                      --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
                      --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
                      "${WORKDIR}/${asset}" 2>&1 || true

                    local sig=""
                    if [ -f "${WORKDIR}/${asset}.sig" ]; then
                      sig=$(cat "${WORKDIR}/${asset}.sig")
                    fi

                    if [ -z "$sig" ]; then
                      echo "  Warning: no signature for ${platform}"
                      return 1
                    fi

                    echo "  Signed ${platform} ✓"
                    # hazard: a file collects the entries, because a variable set inside this function's subshell is lost
                    printf '"%s": { "signature": "%s", "url": "%s" }\n' \
                      "$platform" "$sig" "$url" >> "${WORKDIR}/entries.txt"
                  }

                  touch "${WORKDIR}/entries.txt"

                  sign_and_add "darwin-aarch64" "spwn_aarch64.app.tar.gz" || true
                  sign_and_add "darwin-x86_64" "spwn_x64.app.tar.gz" || true

                  # outside: Tauri uploads the Linux AppImage bare, with no .tar.gz around it
                  sign_and_add "linux-x86_64" "spwn_${VERSION}_amd64.AppImage" || true

                  if [ ! -s "${WORKDIR}/entries.txt" ]; then
                    echo "Warning: no platforms were signed - latest.json not generated"
                    exit 0
                  fi

                  ENTRIES=$(paste -sd ',' "${WORKDIR}/entries.txt" | sed 's/,/, /g')

                  PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  python3 -c "
                  import json, sys
                  entries_raw = '''${ENTRIES}'''
                  platforms = {}
                  for entry in entries_raw.split('\n'):
                    entry = entry.strip()
                    if not entry: continue
                    obj = json.loads('{' + entry + '}')
                    platforms.update(obj)
                  manifest = {
                    'version': '${VERSION}',
                    'notes': 'spwn ${TAG}',
                    'pub_date': '${PUB_DATE}',
                    'platforms': platforms
                  }
                  json.dump(manifest, open('${WORKDIR}/latest.json', 'w'), indent=2)
                  json.dump(manifest, sys.stdout, indent=2)
                  print()
                  "

                  gh release upload "${TAG}" "${WORKDIR}/latest.json" --clobber
                  echo "latest.json uploaded to ${TAG} ✓"
