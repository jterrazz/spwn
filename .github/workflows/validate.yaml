name: Validate

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

# invariant: every job calls one Makefile gesture, and Turborepo reads go.work and pnpm-workspace.yaml into one task graph, so a job needs pnpm even when its work is pure Go; a job running anything `make` does not is a bug
# value: each job restores and saves the Turborepo cache at .artifacts/turbo under a key of its own, one entry per run, restored by prefix — this branch's newest run, then any branch on this lockfile, then any — because two jobs saving one key race, and a job only replays the tasks it ran

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.25'
                  cache-dependency-path: apps/cli/go.sum
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - uses: actions/cache/restore@v4
              id: turbo
              with:
                  path: .artifacts/turbo
                  key: turbo-lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
                  restore-keys: |
                      turbo-lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
                      turbo-lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
                      turbo-lint-${{ runner.os }}-
            - run: make lint
            - uses: actions/cache/save@v4
              if: always()
              with:
                  path: .artifacts/turbo
                  key: ${{ steps.turbo.outputs.cache-primary-key }}-${{ github.run_id }}

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.25'
                  cache-dependency-path: apps/cli/go.sum
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm -C specs exec playwright install --with-deps chromium-headless-shell
            - uses: actions/cache/restore@v4
              id: turbo
              with:
                  path: .artifacts/turbo
                  key: turbo-test-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
                  restore-keys: |
                      turbo-test-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
                      turbo-test-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
                      turbo-test-${{ runner.os }}-
            - run: make test
            - uses: actions/cache/save@v4
              if: always()
              with:
                  path: .artifacts/turbo
                  key: ${{ steps.turbo.outputs.cache-primary-key }}-${{ github.run_id }}

    mutation:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.25'
                  cache-dependency-path: apps/cli/go.sum
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - uses: actions/cache/restore@v4
              id: turbo
              with:
                  path: .artifacts/turbo
                  key: turbo-mutation-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
                  restore-keys: |
                      turbo-mutation-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
                      turbo-mutation-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
                      turbo-mutation-${{ runner.os }}-
            - run: make mutation
            - uses: actions/cache/save@v4
              if: always()
              with:
                  path: .artifacts/turbo
                  key: ${{ steps.turbo.outputs.cache-primary-key }}-${{ github.run_id }}

    go-e2e:
        timeout-minutes: 40
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.25'
                  cache-dependency-path: apps/cli/go.sum
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - uses: actions/cache/restore@v4
              id: turbo
              with:
                  path: .artifacts/turbo
                  key: turbo-go-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
                  restore-keys: |
                      turbo-go-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
                      turbo-go-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
                      turbo-go-e2e-${{ runner.os }}-
            - run: make test-go-e2e
            - run: make test-compile-e2e
            - uses: actions/cache/save@v4
              if: always()
              with:
                  path: .artifacts/turbo
                  key: ${{ steps.turbo.outputs.cache-primary-key }}-${{ github.run_id }}

    # value: the smoke specs build world images from scratch, about ten minutes cold, so they run on main alone
    smoke:
        if: github.event_name == 'push'
        timeout-minutes: 30
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.25'
                  cache-dependency-path: apps/cli/go.sum
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - uses: actions/cache/restore@v4
              id: turbo
              with:
                  path: .artifacts/turbo
                  key: turbo-smoke-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
                  restore-keys: |
                      turbo-smoke-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
                      turbo-smoke-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
                      turbo-smoke-${{ runner.os }}-
            - run: make test-smoke
            - uses: actions/cache/save@v4
              if: always()
              with:
                  path: .artifacts/turbo
                  key: ${{ steps.turbo.outputs.cache-primary-key }}-${{ github.run_id }}

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.25'
                  cache-dependency-path: apps/cli/go.sum
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - uses: actions/cache/restore@v4
              id: turbo
              with:
                  path: .artifacts/turbo
                  key: turbo-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
                  restore-keys: |
                      turbo-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
                      turbo-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
                      turbo-build-${{ runner.os }}-
            - run: make build
            - uses: actions/cache/save@v4
              if: always()
              with:
                  path: .artifacts/turbo
                  key: ${{ steps.turbo.outputs.cache-primary-key }}-${{ github.run_id }}
