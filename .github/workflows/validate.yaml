    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/cli/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        id: turbo
        with:
          path: .artifacts/turbo
          key: turbo-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
          restore-keys: |
            turbo-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
            turbo-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-build-${{ runner.os }}-
      - run: make build
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .artifacts/turbo
          key: ${{ steps.turbo.outputs.cache-primary-key }}-${{ github.run_id }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        id: turbo
        with:
          path: .artifacts/turbo
          key: turbo-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
          restore-keys: |
            turbo-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
            turbo-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-web-${{ runner.os }}-
      - run: make web-build
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .artifacts/turbo
          key: ${{ steps.turbo.outputs.cache-primary-key }}-${{ github.run_id }}
