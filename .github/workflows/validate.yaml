name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Every job sets up Go + pnpm/node then calls a Makefile target. The
# source of truth for what gets linted/tested/built is go.work +
# pnpm-workspace.yaml, which Turborepo reads to build one task graph
# across both toolchains — so a job that runs any Makefile target needs
# pnpm even when the work it triggers is pure Go. If this workflow ever
# drifts from local `make ...`, it's a bug.
#
# Each job restores and saves the Turborepo cache at `.artifacts/turbo`:
# one entry per run so the cache tracks HEAD, restored by prefix — this
# branch's newest run, then any branch on this lockfile, then any. The
# key is per job because two jobs saving one key race, and a job only
# ever replays the tasks it ran.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/cli/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        id: turbo
        with:
          path: .artifacts/turbo
          key: turbo-lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
          restore-keys: |
            turbo-lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
            turbo-lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-lint-${{ runner.os }}-
      - run: make lint
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .artifacts/turbo
          key: ${{ steps.turbo.outputs.cache-primary-key }}-${{ github.run_id }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/cli/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        id: turbo
        with:
          path: .artifacts/turbo
          key: turbo-test-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
          restore-keys: |
            turbo-test-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
            turbo-test-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-test-${{ runner.os }}-
      - run: make test
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .artifacts/turbo
          key: ${{ steps.turbo.outputs.cache-primary-key }}-${{ github.run_id }}

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: make test-contracts

  web-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        id: turbo
        with:
          path: .artifacts/turbo
          key: turbo-web-unit-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
          restore-keys: |
            turbo-web-unit-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
            turbo-web-unit-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-web-unit-${{ runner.os }}-
      - run: make test-web-unit
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .artifacts/turbo
          key: ${{ steps.turbo.outputs.cache-primary-key }}-${{ github.run_id }}

  gate-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        id: turbo
        with:
          path: .artifacts/turbo
          key: turbo-gate-node-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
          restore-keys: |
            turbo-gate-node-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
            turbo-gate-node-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-gate-node-${{ runner.os }}-
      - run: make test-gate-node
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .artifacts/turbo
          key: ${{ steps.turbo.outputs.cache-primary-key }}-${{ github.run_id }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/cli/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        id: turbo
        with:
          path: .artifacts/turbo
          key: turbo-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
          restore-keys: |
            turbo-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
            turbo-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-e2e-${{ runner.os }}-
      - run: make test-cli
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .artifacts/turbo
          key: ${{ steps.turbo.outputs.cache-primary-key }}-${{ github.run_id }}

  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/cli/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        id: turbo
        with:
          path: .artifacts/turbo
          key: turbo-docker-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
          restore-keys: |
            turbo-docker-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
            turbo-docker-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-docker-e2e-${{ runner.os }}-
      - run: make test-go-e2e
      - run: make test-compile-e2e
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .artifacts/turbo
          key: ${{ steps.turbo.outputs.cache-primary-key }}-${{ github.run_id }}

  # Real-build smoke tests: spwn init (default + every catalog example)
  # -> spwn up -> tool probe. Exercises the actual image build path
  # that every other e2e test bypasses via SPWN_BASE_IMAGE. Runs only
  # on push to main because each test builds a Docker image from
  # scratch and the full suite takes ~10 minutes on a cold machine.
  smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/cli/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        id: turbo
        with:
          path: .artifacts/turbo
          key: turbo-smoke-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
          restore-keys: |
            turbo-smoke-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
            turbo-smoke-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-smoke-${{ runner.os }}-
      - run: make test-smoke
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .artifacts/turbo
          key: ${{ steps.turbo.outputs.cache-primary-key }}-${{ github.run_id }}

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/cli/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C tests exec playwright install --with-deps chromium
      - uses: actions/cache/restore@v4
        id: turbo
        with:
          path: .artifacts/turbo
          key: turbo-web-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}
          restore-keys: |
            turbo-web-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
            turbo-web-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-web-e2e-${{ runner.os }}-
      - run: make test-web
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .artifacts/turbo
          key: ${{ steps.turbo.outputs.cache-primary-key }}-${{ github.run_id }}

  build:
