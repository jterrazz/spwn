name: Publish
run-name: Publish ${{ github.ref_name }}

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    # value: a release ships the CLI, built by goreleaser into the release this job opens (its cross-compiled matrix, checksums and archives); it alone serves `curl | bash` and `spwn upgrade`
    publish:
        name: Publish
        runs-on: ubuntu-26.04-arm
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-go@v5
              with:
                  go-version: '1.25'
                  cache-dependency-path: apps/cli/go.sum

            - name: Run GoReleaser
              uses: goreleaser/goreleaser-action@v6
              with:
                  version: '~> v2'
                  args: release --clean
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
