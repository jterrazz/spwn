name: Publish
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Dry run' || 'Publish' }} ${{ github.ref_name }}

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: read

# value: where the signing secrets live, the one place a move of them is written; `.github/actions/signing-secrets` reads them by the job's OIDC token
env:
    SIGNING_SECRETS_PROJECT: studio-ci
    SIGNING_SECRETS_PATH: /spwn
    # value: the version stamped into every station binary, the one inside Spwn.app included: the tag, or dry-run-<sha> on a dry run
    STATION_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dry-run-{0}', github.sha) }}

# invariant: one run per ref at a time, never cancelled half way through a release
concurrency:
    group: publish-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # invariant: main and a v* tag, the refs Infisical gives a token to, ship only signed and notarized macOS artefacts, so either fails here, before any build, unless every signing secret is read; a dry run on another branch reads none and builds unsigned
    signing:
        name: Signing
        runs-on: ubuntu-26.04-arm
        permissions:
            contents: read
            id-token: write
        outputs:
            signed: ${{ steps.require.outputs.signed }}
        steps:
            - uses: actions/checkout@v4
            - if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
              uses: ./.github/actions/signing-secrets
              with:
                  names: APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY
                  project: ${{ env.SIGNING_SECRETS_PROJECT }}
                  path: ${{ env.SIGNING_SECRETS_PATH }}
            - id: require
              run: scripts/sign-macos.sh require

    # value: station's linux binaries need no cgo, so they cross-build on Linux; its darwin ones need cgo for IOKit and build on a Mac below
    machines-linux:
        name: Machines (linux)
        runs-on: ubuntu-26.04-arm
        defaults:
            run:
                working-directory: machines
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version-file: machines/go.work
                  cache-dependency-path: machines/go.work.sum
            - name: Build the binaries
              env:
                  LDFLAGS: -X github.com/jterrazz/studio-station/apps/engine/wire.version=${{ env.STATION_VERSION }}
              run: |
                  set -euo pipefail
                  dist="$RUNNER_TEMP/station"
                  mkdir -p "$dist"
                  for arch in arm64 amd64; do
                      CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -ldflags "$LDFLAGS" -o "$dist/station-linux-$arch" ./apps/engine/cmd/station
                  done
            - uses: actions/upload-artifact@v4
              with:
                  name: station-linux
                  path: ${{ runner.temp }}/station/*
                  if-no-files-found: error

    machines-darwin:
        name: Machines (darwin)
        needs: [signing]
        runs-on: macos-26
        permissions:
            contents: read
            id-token: write
        defaults:
            run:
                working-directory: machines
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Select Xcode
              run: |
                  set -euo pipefail
                  xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
                  sudo xcode-select -s "$xcode"
                  xcodebuild -version
                  swift --version
            - uses: actions/setup-go@v5
              with:
                  go-version-file: machines/go.work
                  cache-dependency-path: machines/go.work.sum
            - name: Build the binaries with cgo
              env:
                  # value: the oldest macOS the binaries run on, Sonoma
                  MACOSX_DEPLOYMENT_TARGET: '14.0'
                  LDFLAGS: -X github.com/jterrazz/studio-station/apps/engine/wire.version=${{ env.STATION_VERSION }}
              run: |
                  set -euo pipefail
                  dist="$RUNNER_TEMP/station"
                  mkdir -p "$dist"
                  sdk=$(xcrun --sdk macosx --show-sdk-path)
                  make enclave
                  for arch in arm64 amd64; do
                      case "$arch" in arm64) target=arm64 ;; amd64) target=x86_64 ;; esac
                      CGO_ENABLED=1 GOOS=darwin GOARCH="$arch" CC="clang -arch $target -isysroot $sdk -mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET" \
                          go build -ldflags "$LDFLAGS" -o "$dist/station-darwin-$arch" ./apps/engine/cmd/station
                      # invariant: a darwin asset without cgo has no IOKit, so it is never released
                      go version -m "$dist/station-darwin-$arch" | grep -q 'CGO_ENABLED=1'
                      lipo -archs "$dist/station-darwin-$arch"
                      minos=$(vtool -show-build "$dist/station-darwin-$arch" | awk '$1 == "minos" { print $2 }')
                      echo "station-darwin-$arch minos $minos"
                      [ "$minos" = "$MACOSX_DEPLOYMENT_TARGET" ]
                  done
                  "$dist/station-darwin-arm64" --version
            - name: Read the signing secrets
              if: needs.signing.outputs.signed == 'true'
              uses: ./.github/actions/signing-secrets
              with:
                  names: APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
                  project: ${{ env.SIGNING_SECRETS_PROJECT }}
                  path: ${{ env.SIGNING_SECRETS_PATH }}
            - name: Import the signing identity
              if: needs.signing.outputs.signed == 'true'
              run: ../scripts/sign-macos.sh keychain
            # value: a bare binary cannot be stapled, so both are notarized inside one zip that is not shipped, and Gatekeeper reads their ticket online
            - name: Sign and notarize the binaries
              if: needs.signing.outputs.signed == 'true'
              run: |
                  set -euo pipefail
                  dist="$RUNNER_TEMP/station"
                  ../scripts/sign-macos.sh sign "$dist/station-darwin-arm64" "$dist/station-darwin-amd64"
                  mkdir -p "$RUNNER_TEMP/notary/station-darwin"
                  cp "$dist/station-darwin-arm64" "$dist/station-darwin-amd64" "$RUNNER_TEMP/notary/station-darwin/"
                  ditto -c -k --keepParent "$RUNNER_TEMP/notary/station-darwin" "$RUNNER_TEMP/notary/station-darwin.zip"
                  ../scripts/sign-macos.sh notarize "$RUNNER_TEMP/notary/station-darwin.zip"
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - name: Rust, when the runner's image has none
              run: |
                  set -euo pipefail
                  if ! command -v cargo >/dev/null; then
                      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
                      echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
                  fi
            # invariant: Spwn.app carries the darwin-arm64 station built and signed above, which the window's signing signs again under the bundle's identifier (ADR-073)
            - name: Build Spwn.app
              run: |
                  set -euo pipefail
                  cargo --version
                  make window ENGINE="$RUNNER_TEMP/station/station-darwin-arm64" ENGINE_VERSION="$STATION_VERSION"
                  vtool -show-build .artifacts/window/Spwn.app/Contents/MacOS/spwn-window | awk '$1 == "minos"'
                  vtool -show-build .artifacts/window/Spwn.app/Contents/Library/LoginItems/Station.app/Contents/MacOS/StationMenuBar | awk '$1 == "minos"'
            - name: Sign, notarize and staple Spwn.app
              if: needs.signing.outputs.signed == 'true'
              run: |
                  set -euo pipefail
                  ../scripts/sign-macos.sh sign .artifacts/window/Spwn.app
                  mkdir -p "$RUNNER_TEMP/notary"
                  ditto -c -k --keepParent .artifacts/window/Spwn.app "$RUNNER_TEMP/notary/Spwn.app.zip"
                  ../scripts/sign-macos.sh notarize "$RUNNER_TEMP/notary/Spwn.app.zip"
                  ../scripts/sign-macos.sh staple .artifacts/window/Spwn.app
            # value: the minisign verifier the update's check runs, pinned, built from crates.io by the cargo the job already holds
            - name: Install rsign
              if: needs.signing.outputs.signed == 'true'
              run: |
                  set -euo pipefail
                  cargo install rsign2 --version 0.6.7 --locked --root "$RUNNER_TEMP/rsign"
                  echo "$RUNNER_TEMP/rsign/bin" >> "$GITHUB_PATH"
            # invariant: the update is packed from the stapled app, and its signature verifies against the public key every window carries, before anything is uploaded
            - name: Pack, sign and verify Spwn.app's update
              if: needs.signing.outputs.signed == 'true'
              run: |
                  set -euo pipefail
                  ../scripts/window-update.sh archive .artifacts/window/Spwn.app "$RUNNER_TEMP/station"
                  ../scripts/window-update.sh sign "$RUNNER_TEMP/station/Spwn.app.tar.gz"
                  ../scripts/window-update.sh manifest .artifacts/window/Spwn.app "$RUNNER_TEMP/station"
            # invariant: the shipped zips are made after the staple, so the apps they carry hold their ticket offline
            - name: Zip Spwn.app
              run: |
                  set -euo pipefail
                  ditto -c -k --keepParent .artifacts/window/Spwn.app "$RUNNER_TEMP/station/Spwn_darwin_arm64.zip"
                  codesign -dv .artifacts/window/Spwn.app/Contents/Library/LoginItems/Station.app
                  codesign -dv .artifacts/window/Spwn.app
                  codesign -dv ".artifacts/window/Spwn.app/Contents/MacOS/Spwn Engine"
            - name: Delete the signing keychain
              if: always() && needs.signing.outputs.signed == 'true'
              run: ../scripts/sign-macos.sh cleanup
            - uses: actions/upload-artifact@v4
              with:
                  name: station-darwin
                  path: ${{ runner.temp }}/station/*
                  if-no-files-found: error

    # value: one release per tag, opened once by goreleaser: spwn's archives, plus station's binaries, Spwn_darwin_arm64.zip and, on a signed run, the window's update (Spwn.app.tar.gz, its .sig, latest.json) as extra files, every asset listed in the one checksums.txt
    # invariant: the release opens only once both station jobs are built, so a failed station leaves no spwn-only release
    # value: on macOS, because GoReleaser's post-build hook signs and notarizes spwn's darwin binaries with codesign and notarytool before it archives them
    publish:
        name: Publish
        needs: [signing, machines-linux, machines-darwin]
        runs-on: macos-26
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.work
                  cache-dependency-path: apps/cli/go.sum
            - uses: actions/download-artifact@v4
              with:
                  pattern: station-*
                  path: .artifacts/station
                  merge-multiple: true
            - run: ls -l .artifacts/station
            - name: Read the signing secrets
              if: needs.signing.outputs.signed == 'true'
              uses: ./.github/actions/signing-secrets
              with:
                  names: APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
                  project: ${{ env.SIGNING_SECRETS_PROJECT }}
                  path: ${{ env.SIGNING_SECRETS_PATH }}
            - name: Import the signing identity
              if: needs.signing.outputs.signed == 'true'
              run: scripts/sign-macos.sh keychain
            - name: Run GoReleaser
              uses: goreleaser/goreleaser-action@v6
              with:
                  version: '~> v2'
                  args: release --clean ${{ github.event_name == 'workflow_dispatch' && '--snapshot' || '' }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # value: read by the spwn build's post hook in .goreleaser.yml, `scripts/sign-macos.sh binary`
                  MACOS_SIGN: ${{ needs.signing.outputs.signed }}
            - run: cat .artifacts/goreleaser/checksums.txt
            - name: Delete the signing keychain
              if: always() && needs.signing.outputs.signed == 'true'
              run: scripts/sign-macos.sh cleanup
