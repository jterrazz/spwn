      - text: failed
      - 'heading "Error: station-darwin-arm64 does not match its checksum, nothing installed" [level=1]'
      - paragraph: The installer ended with exit code 1. Its output is kept below.
      - log "The installer's output": "Detecting the newest release... Version: v0.22.0 Downloading spwn_darwin_arm64.tar.gz... Downloading station-darwin-arm64... Error: station-darwin-arm64 does not match its checksum, nothing installed"
      - button "Retry"
      - button "Done"
    - region "Engine":
      - heading "Engine" [level=2]
      - text: Engine v0.21.0 running Latest release Checked 4 Nov, 09:00
      - button "Check now"
  - region "mac-mini":
    - heading "mac-mini" [level=2]
