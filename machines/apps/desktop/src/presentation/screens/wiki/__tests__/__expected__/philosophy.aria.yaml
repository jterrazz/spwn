      - button "10min"
    - heading "Philosophy" [level=1]
    - paragraph: The seven convictions Spwn is built on, written as principles a newcomer can apply to a design choice; the vision holds the case they serve, and this page holds the rules. The owner confirmed the seven on 2026-11-21 (his answer).
    - region "Philosophy":
      - region "Table all":
        - text: Table conviction
        - button "Philosophy"
