    - heading "macbook-pro" [level=2]
    - heading "Nothing to free." [level=1]
    - paragraph:
      - img "Nothing to free."
      - text: "on macbook-pro: no machine and no file of yours is touched"
    - region "Disk":
      - heading "Disk" [level=2]
      - paragraph: 582 GB of 994 GB used
      - button "Rescan"
      - paragraph: This Mac itself holds 562 GB. Outside any machine, Machines holds 20.1 GB.
      - 'img "What holds the disk of macbook-pro: System 21.4 GB · Your data 530 GB · Caches 10.2 GB · Machine disks 20 GB · Machines'' logs 120 MB · Free 412 GB"'
      - list "The parts":
        - listitem: System 21.4 GB
        - listitem: Your data 530 GB
        - listitem: Caches 10.2 GB
        - listitem: Machine disks 20 GB
        - listitem: Machines' logs 120 MB
