      - paragraph: Every image and every disk Machines holds is a machine's or the newest.
      - paragraph: Caches hold 10.3 GB. Each app rebuilds its own when it needs it.
      - button "Free 10.3 GB"
    - region "By app":
      - heading "By app each app says in the catalog which of its folders are cache, data or settings" [level=2]
      - text: go ~/Library/Caches/go-build cache 8.2 GB
      - button "Free go": Free
      - text: homebrew ~/Library/Caches/Homebrew cache 1.4 GB
      - button "Free homebrew": Free
      - text: node ~/.cache/npm cache 600 MB
      - button "Free node": Free
      - text: station ~/.local/state/station/logs/*.log cache 120 MB
      - button "Free station": Free
      - text: xcode ~/Library/Developer/CoreSimulator/Devices data 6.3 GB
      - button "Erase… xcode": Erase…
      - text: claude ~/.claude/projects data 2.1 GB
      - button "Erase… claude": Erase…
      - paragraph: Data and settings are never freed here. Erasing an app's data is asked for by name.
