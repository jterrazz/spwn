[package]
name = "spwn-window"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
libc = "0.2"
tauri-plugin-updater = "2.14.1"

[dev-dependencies]
tauri = { version = "2.12.1", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-service-management = "0.3"

# value: the release's size profile (README, Its bundle): what the window ships is this binary, signed.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "debuginfo"
