description: 'a VM of another Mac stops sharing through that Mac''s engine, over ssh, with no question'
fixture:
    - ../../__fixtures__/vms/
    - ./__fixtures__/ports-remote/
runs:
    - command: 'ports stop-sharing w 3000; /usr/bin/grep -c ''station engine attach'' .calls'
      exit: 0
      stdout: |
          ●	w:3000	not shared
          1
