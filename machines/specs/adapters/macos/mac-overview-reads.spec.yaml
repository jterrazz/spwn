description: 'on a Mac the background list runs its own commands, and launchd is only listed and printed'
fixture:
    - ./__fixtures__/status-tools-mixed/
    - ./__fixtures__/status-mac/
    - ./__fixtures__/status-processes/
    - ./__fixtures__/status-registered/
env:
    - USER=tester
    - SHELL=/bin/zsh
runs:
    - command: 'background --json | /usr/bin/jq -c ''.tasks | map([.label, .group, .state, .scope, .owner])'''
      exit: 0
      stdout: |
          [["TC3Q7MAJXF.com.adguard.safari.AdGuard.Helper","known","running","user","AdGuard"],["ai.example.gone","orphan","not-loaded","user",""],["ai.example.x","unknown","running","user",""],["ai.example.y","unknown","failing","user",""],["com.docker.vmnetd","orphan","not-loaded","root","Docker.app"],["dev.orbstack.OrbStack.privhelper","known","loaded","root","OrbStack"]]
    - command: 'background --json | /usr/bin/jq -r ''.tasks[] | select(.fix != null) | .fix.command'' | /usr/bin/sed ''s|gui/[0-9]*/|gui/UID/|'''
      exit: 0
      stdout: |
          station background remove ai.example.gone
          station background remove ai.example.y
          sudo launchctl bootout system/com.docker.vmnetd && sudo rm /Library/LaunchDaemons/com.docker.vmnetd.plist
          sudo launchctl bootout system/dev.orbstack.OrbStack.privhelper && sudo rm /Library/LaunchDaemons/dev.orbstack.OrbStack.privhelper.plist
    - command: 'background --all | /usr/bin/sed -e ''s|gui/[0-9]*/|gui/UID/|'''
      exit: 0
      stdout: |
          # Failing	1 ✗
          ✗	ai.example.y	user	failing · last exit 1		~/Library/LaunchAgents/ai.example.y.plist · station background remove ai.example.y
          # Orphans	2 ◐
          ◐	ai.example.gone	user	not loaded		~/Library/LaunchAgents/ai.example.gone.plist · station background remove ai.example.gone
          ◐	com.docker.vmnetd	root	not loaded	Docker.app (gone)	/Library/LaunchDaemons/com.docker.vmnetd.plist · sudo launchctl bootout system/com.docker.vmnetd && sudo rm /Library/LaunchDaemons/com.docker.vmnetd.plist
          # Known apps	2 ●
          ●	TC3Q7MAJXF.com.adguard.safari.AdGuard.Helper	user	running · pid 2211	AdGuard (gone)
          ●	dev.orbstack.OrbStack.privhelper	root	idle	OrbStack	/Library/LaunchDaemons/dev.orbstack.OrbStack.privhelper.plist
          # Unknown	1 ●
          ●	ai.example.x	user	running · pid 12		~/Library/LaunchAgents/ai.example.x.plist
    - command: '--version >/dev/null; /usr/bin/grep "^launchctl" .calls | /usr/bin/grep -c -v -E "^launchctl (list|print|print-disabled) ?"'
      exit: 1
      stdout: |
          0
