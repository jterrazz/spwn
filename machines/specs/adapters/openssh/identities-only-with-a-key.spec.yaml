description: 'a Mac added with a key offers only that key; one added without a key offers the default'
fixture:
    - ../../__fixtures__/far-mac/
env: engine
runs:
    - command: '--version >/dev/null; "$STATION" machines add mac-mini --user jterrazz.agent --key "~/.ssh/agent_key" >/dev/null; /usr/bin/grep -c "IdentitiesOnly yes" .ssh/config'
      exit: 0
      stdout: |
          1
    - command: 'machines forget mac-mini --yes >/dev/null; "$STATION" machines add mac-mini >/dev/null; /usr/bin/grep -c "IdentitiesOnly" .ssh/config'
      exit: 1
      stdout: |
          0
