description: 'bare machines writes the address and bare blocks of another Mac''s VM, with its Mac''s login'
fixture:
    - ../../__fixtures__/hosts-x-y/
    - ../../__fixtures__/machines-stubs/
    - ../../__fixtures__/fleet-y-answers/
runs:
    - command: 'machines --json | /usr/bin/jq -r ''.macs | length | tostring'''
      exit: 0
      stdout: |
          2
      files:
          .ssh/config:
              equals: |
                  # >>> jterrazz machine y >>>
                  Host y
                    HostName y
                    User u
                    IdentityAgent ~/.local/state/station/agent.sock
                    IdentityFile "~/.local/state/station/device-key.pub"
                    IdentitiesOnly yes
                    ServerAliveInterval 30
                    ServerAliveCountMax 3
                    UserKnownHostsFile ~/.local/state/station/known_hosts/y
                    StrictHostKeyChecking accept-new
                  # <<< jterrazz machine y <<<

                  # >>> jterrazz machine w.y >>>
                  Host w.y
                    HostName w.y
                    User u
                    IdentityAgent ~/.local/state/station/agent.sock
                    IdentityFile "~/.local/state/station/device-key.pub"
                    IdentitiesOnly yes
                    ServerAliveInterval 30
                    ServerAliveCountMax 3
                    UserKnownHostsFile ~/.local/state/station/known_hosts/w.y
                    StrictHostKeyChecking accept-new
                    ProxyCommand ssh y -- "sh -c 'PATH=\"\$HOME/.local/bin:/usr/local/bin:\$PATH\" exec station \"\$@\"' station machines pipe w"
                  # <<< jterrazz machine w.y <<<

                  # >>> jterrazz machine w >>>
                  Host w
                    HostName w
                    User u
                    IdentityAgent ~/.local/state/station/agent.sock
                    IdentityFile "~/.local/state/station/device-key.pub"
                    IdentitiesOnly yes
                    ServerAliveInterval 30
                    ServerAliveCountMax 3
                    UserKnownHostsFile ~/.local/state/station/known_hosts/w
                    StrictHostKeyChecking accept-new
                    ProxyCommand ssh y -- "sh -c 'PATH=\"\$HOME/.local/bin:/usr/local/bin:\$PATH\" exec station \"\$@\"' station machines pipe w"
                  # <<< jterrazz machine w <<<
