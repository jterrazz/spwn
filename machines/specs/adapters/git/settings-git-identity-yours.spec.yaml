description: 'git-identity refuses to replace an identity Machines did not write, and writes nothing'
fixture:
    - ../../__fixtures__/terminal/
    - ./__fixtures__/settings-git-identity/
env: terminal
runs:
    - command: '--version >/dev/null; /usr/bin/printf "user.name=Jane Doe\nuser.email=mine@example.com\n" > .stub-gitconfig'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | .out[0].Steps'''
      stdin: |
          {"v":2,"id":"1","call":"settings.apply","in":{"Names":["git-identity"],"Values":{"git-identity":{"name":"Jane Doe","email":"jane@example.com"}}}}
      exit: 0
      stdout: |
          [{"Label":"failed","State":"broken","Detail":"user.email is already set for every repository, and not by Machines: unset it with `git config --global --unset user.email`, or drop the git-identity setting"}]
    - command: '--version >/dev/null; /bin/cat .stub-gitconfig; /usr/bin/grep -c "config --global user\.[a-z]* " .calls || true'
      exit: 0
      stdout: |
          user.name=Jane Doe
          user.email=mine@example.com
          0
