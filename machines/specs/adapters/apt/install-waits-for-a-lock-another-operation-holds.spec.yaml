description: 'an apt install waits for the lock an unattended upgrade holds, then installs once it is let go'
fixture:
    - ./__fixtures__/ubuntu/
    - ./__fixtures__/lock-held-briefly/
env:
    - STATION_MACHINE_KIND=linux
runs:
    - command: 'apps install jq'
      exit: 0
      stdout: |
          ●	jq	1.0	apt
      files:
          dpkg-lock: absent
          .local/state/station/logs/jq.log:
              contains: 'Waiting for cache lock: Could not get lock /var/lib/dpkg/lock-frontend. It is held by process 4242 (unattended-upgr)'
