description: 'a code printed after its link is read and the device page opens'
fixture:
    - ./__fixtures__/signins/
env: engine
runs:
    - command: '--version >/dev/null;  /bin/mkdir tmp; TMPDIR=$PWD/tmp "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .error then .error.code elif .out.Step then [.out.Step.Kind, .out.Step.Code, .out.Step.Site] else [.out.Programs[0].State, .out.Programs[0].Who] end''; /bin/ls tmp | /usr/bin/wc -l | /usr/bin/tr -d " "'
      stdin: |
          {"v":2,"id":"1","watch":"accounts.login","in":{"Program":"wrangler"}}
      exit: 0
      stdout: |
          ["device-code","FAKE0000","dash.cloudflare.com"]
          ["signed-in","you@example.com"]
          0
