description: 'an audience asked of a Mac whose station cannot honour it is refused before the share is sent'
env: mini-old
runs:
    - command: 'ports share infra 3000 --to private --on mac-mini'
      exit: 1
      stderr: |
          Error: mac-mini runs station dev, which has no ports.share.to
          Hint: update station on mac-mini (run curl -fsSL https://spwn.sh/install.sh | bash there)
    - command: 'ports share infra 3000 --on mac-mini'
      exit: 1
      stderr: |
          Error: Tailscale is signed out on This Mac: ports are local only
          Hint: open Tailscale and sign in
