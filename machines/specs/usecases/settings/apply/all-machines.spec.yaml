description: 'apply --all-machines: applied where it lives, skipped per setting where not'
env: two-macs
runs:
    - command: 'settings apply starship-dotfiles --all-machines'
      exit: 0
      stdout: |
          ●	macbook-pro	starship-dotfiles · ~/.config/starship.toml: written
          ●	mac-mini	starship-dotfiles · ~/.config/starship.toml: written
          ●	linux-1	starship-dotfiles · ~/.config/starship.toml: written
          –	api	skipped (stopped)
          –	infra	skipped (server)
    - command: '--version >/dev/null; test -f .config/starship.toml && echo written here'
      exit: 0
      stdout: |
          written here
    - command: 'settings --on mac-mini --json | /usr/bin/jq -r ''.settings[] | select(.name == "starship-dotfiles") | .state'''
      exit: 0
      stdout: |
          applied
    - command: 'settings --on linux-1 --json | /usr/bin/jq -r ''.settings[] | select(.name == "starship-dotfiles") | .state'''
      exit: 0
      stdout: |
          applied
    - command: 'settings --on mac-mini --json | /usr/bin/jq -r ''.settings[] | select(.name == "dns") | .state'''
      exit: 0
      stdout: |
          not-applied
    - command: 'settings apply starship-dotfiles dns --all-machines'
      exit: 0
      stdout: |
          ●	macbook-pro	starship-dotfiles · ~/.config/starship.toml: written
          ●	macbook-pro	dns · dns: applied
          ●	mac-mini	starship-dotfiles · ~/.config/starship.toml: written
          ●	mac-mini	dns · dns: applied
          ●	linux-1	starship-dotfiles · ~/.config/starship.toml: written
          –	linux-1	skipped (dns is for Macs only)
          –	api	skipped (stopped)
          –	infra	skipped (server)
    - command: 'settings --on mac-mini --json | /usr/bin/jq -r ''.settings[] | select(.name == "dns") | .state'''
      exit: 0
      stdout: |
          applied
    - command: 'settings --on linux-1 --json | /usr/bin/jq -r ''.settings[] | select(.name == "dns") | .state'''
      exit: 0
      stdout: |
          not-for-this-machine
    - command: 'settings apply sshd dns --all-machines'
      exit: 0
      stdout: |
          ●	macbook-pro	dns · dns: applied
          ○	macbook-pro	sshd · needs admin rights · sudo ~/.local/bin/station settings apply sshd
          ●	mac-mini	dns · dns: applied
          ○	mac-mini	sshd · needs admin rights · ssh -t mac-mini 'sudo ~/.local/bin/station settings apply sshd'
          –	linux-1	skipped (sshd is for Macs only)
          –	linux-1	skipped (dns is for Macs only)
          –	api	skipped (stopped)
          –	infra	skipped (server)
    - command: 'settings --on mac-mini --json | /usr/bin/jq -r ''.settings[] | select(.name == "sshd") | .state'''
      exit: 0
      stdout: |
          not-applied
    - command: 'settings --on mac-mini --json | /usr/bin/jq -r ''.settings[] | select(.name == "dns") | .state'''
      exit: 0
      stdout: |
          applied
    - command: 'settings --json | /usr/bin/jq -r ''.settings[] | select(.name == "sshd") | .state'''
      exit: 0
      stdout: |
          not-for-this-machine
