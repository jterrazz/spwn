description: 'on a terminal, a setting with a value asks it in a form, the password never echoed, then applies it'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - bare-mac
    - terminal
runs:
    - command: 'world admin on'
      exit: 0
    - command: '--version >/dev/null; terminal "$STATION" settings apply autologin'
      stdin: |
          see ┃ User to log in
          send jterrazz.agent\r
          see ┃ Password of the user
          send sk-ant-oat01-x\r
          see ●
          screen
      exit: 0
      stdout: |
          Configure autologin
            User to log in
            the account that logs in by itself at boot, no default
            > jterrazz.agent

          ┃ Password of the user
          ●       autologin       autologin: applied
    - command: 'settings autologin --json | /usr/bin/jq -r .setting.state'
      exit: 0
      stdout: |
          applied
    - command: '--version >/dev/null; /usr/bin/grep -c sk-ant world.json'
      exit: 1
      stdout: |
          0
