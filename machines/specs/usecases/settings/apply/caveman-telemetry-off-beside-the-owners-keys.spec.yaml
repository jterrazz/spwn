description: an owner's recorded caveman telemetry choice is kept, and said, beside his keys
fixture: ../__fixtures__/caveman/
env: two-macs
runs:
    - command: '--version >/dev/null; /bin/mkdir -p .caveman; printf ''{\n  "apiUrl": "https://example.invalid",\n  "telemetry": {\n    "enabled": true,\n    "decidedAt": "2026-11-01T00:00:00.000Z",\n    "promptVersion": 6,\n    "anonymousId": "a1"\n  }\n}\n'' > .caveman/cloud.json'
      exit: 0
    - command: 'settings apply caveman-telemetry-off'
      exit: 0
      stdout: |
          ●	caveman-telemetry-off
          ●	~/.caveman/cloud.json	as Machines wrote it: nothing written
          ◐	~/.caveman/cloud.json /telemetry/enabled	kept: still yours, not this setting's value, so it does not hold
          ◐	~/.caveman/cloud.json /telemetry/decidedAt	kept: still yours, not this setting's value, so it does not hold
    - command: 'settings caveman-telemetry-off'
      exit: 0
      stdout: |
          ○	caveman-telemetry-off	not applied · kept: ~/.caveman/cloud.json /telemetry/enabled, ~/.caveman/cloud.json /telemetry/decidedAt still yours, not this setting's value, so it does not hold	the value is yours: change it yourself, or leave it
          # Detail
          group	Set by Machines
          does	caveman sends no usage telemetry, its choice recorded off before its first run
          lives on	Macs, Linux VMs, macOS VMs
          where	~/.caveman/cloud.json
    - command: 'settings apply | /usr/bin/grep -c caveman-telemetry-off'
      exit: 1
      stdout: |
          0
    - command: '--version >/dev/null; /bin/cat .caveman/cloud.json'
      exit: 0
      stdout: |
          {
            "apiUrl": "https://example.invalid",
            "telemetry": {
              "enabled": true,
              "decidedAt": "2026-11-01T00:00:00.000Z",
              "promptVersion": 6,
              "anonymousId": "a1"
            }
          }
