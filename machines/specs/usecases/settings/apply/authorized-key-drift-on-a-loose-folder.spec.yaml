description: 'a ~/.ssh others can open reads changed, its mode in the diff, and a confirmed apply sets it to 0700'
env:
    - in-workspace
    - engine
runs:
    - command: 'world admin on'
      exit: 0
    - command: '--version >/dev/null; umask 022; /bin/mkdir -p root/root'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | .out[0].Steps'''
      stdin: |
          {"v":2,"id":"1","call":"settings.apply","in":{"Names":["authorized-key"],"Values":{"authorized-key":{"user":"root","key":"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGZ2c8e4bOqkqO0+5N0VXlFz4sVJyDQzH+LVRG4RvMZb ci@deploy"}}}}
      exit: 0
      stdout: |
          [{"Label":"/root/.ssh/authorized_keys","State":"ok","Detail":"written"}]
    - command: '--version >/dev/null; /bin/chmod 755 root/root/.ssh'
      exit: 0
    - command: 'settings authorized-key | /usr/bin/sed -n 1p'
      exit: 0
      stdout: |
          ◐	authorized-key	changed since just now	station settings diff authorized-key
    - command: 'settings diff authorized-key'
      exit: 0
      stdout: |
          --- Machines' /root/.ssh
          +++ /root/.ssh
          @@ -1,1 +1,1 @@
          -0700
          +0755
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | .out[0].Steps'''
      stdin: |
          {"v":2,"id":"1","call":"settings.apply","in":{"Names":["authorized-key"],"Values":{"authorized-key":{"user":"root","key":"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGZ2c8e4bOqkqO0+5N0VXlFz4sVJyDQzH+LVRG4RvMZb ci@deploy"}},"Confirm":"yes"}}
      exit: 0
      stdout: |
          [{"Label":"/root/.ssh/authorized_keys","State":"ok","Detail":"already there"}]
    - command: '--version >/dev/null; /usr/bin/stat -c ''%a %n'' root/root/.ssh'
      exit: 0
      stdout: |
          700 root/root/.ssh
    - command: 'settings authorized-key | /usr/bin/sed -n 1p'
      exit: 0
      stdout: |
          ●	authorized-key	applied · /root/.ssh/authorized_keys
