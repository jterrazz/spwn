description: 'off a terminal, a setting that asks a value is refused before any question or effect'
env: bare-mac
runs:
    - command: 'settings apply autologin </dev/null'
      exit: 2
      stderr: |
          Error: autologin asks a value: run it on a terminal
          Hint: station settings apply autologin
    - command: 'settings autologin --json | /usr/bin/jq -r .setting.state'
      exit: 0
      stdout: |
          not-applied
    - command: 'settings apply ssh-key </dev/null'
      exit: 2
      stderr: |
          Error: ssh-key asks a value: run it on a terminal
          Hint: station settings apply ssh-key
