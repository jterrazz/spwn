description: 'a block whose end marker is gone is refused with its repair, and the owner''s keys after it stay'
env:
    - in-workspace
    - engine
runs:
    - command: 'world admin on'
      exit: 0
    - command: '--version >/dev/null; /bin/mkdir -p root/root/.ssh && printf ''# >>> station:authorized-key >>>\nssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOWNERownerOWNERownerOWNERownerOWNERowner owner@laptop\n'' > root/root/.ssh/authorized_keys && /bin/cp root/root/.ssh/authorized_keys before'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | .out[0].Steps[0].Detail'''
      stdin: |
          {"v":2,"id":"1","call":"settings.apply","in":{"Names":["authorized-key"],"Values":{"authorized-key":{"user":"root","key":"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGZ2c8e4bOqkqO0+5N0VXlFz4sVJyDQzH+LVRG4RvMZb ci@deploy"}}}}
      exit: 0
      stdout: |
          "/root/.ssh/authorized_keys holds a damaged station:authorized-key block, a start with no end or two blocks, not touched: leave one `# >>> station:authorized-key >>>` line and one `# <<< station:authorized-key <<<` line around Machines' keys, then apply again"
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | .out[0].Steps[0].Detail'''
      stdin: |
          {"v":2,"id":"1","call":"settings.apply","in":{"Names":["authorized-key"],"Values":{"authorized-key":{"user":"root","key":"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGZ2c8e4bOqkqO0+5N0VXlFz4sVJyDQzH+LVRG4RvMZb ci@deploy"}}}}
      exit: 0
      stdout: |
          "/root/.ssh/authorized_keys holds a damaged station:authorized-key block, a start with no end or two blocks, not touched: leave one `# >>> station:authorized-key >>>` line and one `# <<< station:authorized-key <<<` line around Machines' keys, then apply again"
    - command: '--version >/dev/null; /usr/bin/cmp before root/root/.ssh/authorized_keys && echo byte for byte'
      exit: 0
      stdout: |
          byte for byte
