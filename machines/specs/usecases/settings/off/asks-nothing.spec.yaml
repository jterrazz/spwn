description: 'off a terminal, off asks nothing: the setting is off here at once'
env: two-macs
runs:
    - command: 'settings apply hushlogin'
      exit: 0
      stdout: |
          ●	hushlogin	~/.hushlogin: created
    - command: 'settings off hushlogin </dev/null'
      exit: 0
      stdout: |
          ●	hushlogin	~/.hushlogin: removed
    - command: 'settings hushlogin --json | /usr/bin/jq -r .setting.state'
      exit: 0
      stdout: |
          off-here
