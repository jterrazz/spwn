description: 'a device of the book this Mac''s engine holds is let in at its door'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" devices add mac-mini $("$STATION" devices --on mac-mini --json | /usr/bin/jq -r .key) --channels pipe >/dev/null'
      exit: 0
    - command: 'world knock macbook-pro mac-mini'
      exit: 0
      stdout: |
          door: mac-mini let in, key SHA256:BoS4yciLAuSqrxlufZLEPNDAgryOX/2NniX6/wFZYoY
