description: 'once mac-mini is updated the same call runs: its calls are read again at each connection'
env: mini-old
runs:
    - command: 'ports declare 5000 --via lan --on mac-mini'
      exit: 1
      stderr: |
          Error: mac-mini runs station dev, which has no ports.declare
          Hint: update station on mac-mini (run curl -fsSL https://spwn.sh/install.sh | bash there)
    - command: 'world upgrade mac-mini ""'
      exit: 0
    - command: 'ports declare 5000 --via lan --on mac-mini'
      exit: 0
      stdout: |
          	On mac-mini:
          ●	5000 on mac-mini	declared public (your LAN)
