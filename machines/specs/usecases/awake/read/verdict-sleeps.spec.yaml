description: 'awake.read says a Mac with no keep-awake sleeps normally, a plain verdict, and picks no term'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out | [.Mac, .Verdict, [.Choices[] | select(.Picked) | .Label]]'' | /usr/bin/tail -1'
      stdin: |
          {"v":2,"id":"1","watch":"awake.read","in":{}}
      exit: 0
      stdout: |
          ["macbook-pro",{"Tone":"plain","Sentence":"Sleeps normally."},[]]
