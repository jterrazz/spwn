description: 'station skills lists the skill files of this folder by name, with their description'
env: two-macs
runs:
    - command: 'skills create paper-reading'
      exit: 0
      stdout: |
          ●	paper-reading	created	~/.spwn/skills/paper-reading.md
    - command: 'skills create refactoring'
      exit: 0
      stdout: |
          ●	refactoring	created	~/.spwn/skills/refactoring.md
    - command: 'skills'
      exit: 0
      stdout: |
          # Skills
          ●	paper-reading	One-line description of what this skill does.
          ●	refactoring	One-line description of what this skill does.
