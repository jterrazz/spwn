description: 'station skills --on a VM reads the skills kept on that VM; This Mac keeps none'
env: two-macs
runs:
    - command: 'skills create paper-reading --on linux-1'
      exit: 0
      stdout: |
          	On linux-1:
          ●	paper-reading	created	~/.spwn/skills/paper-reading.md
    - command: 'skills --on linux-1'
      exit: 0
      stdout: |
          	On linux-1:
          # Skills
          ●	paper-reading	One-line description of what this skill does.
    - command: '--version >/dev/null; /usr/bin/jq -c "[(.macs[\"linux-1\"].stores.skills[\"\"] | map(.Name)), (.macs[\"macbook-pro\"].stores.skills // {} | length)]" world.json'
      exit: 0
      stdout: |
          [["paper-reading"],0]
