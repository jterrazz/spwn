description: 'station skills delete with another name typed is refused and the file is kept'
env: two-macs
runs:
    - command: 'skills create paper-reading'
      exit: 0
      stdout: |
          ●	paper-reading	created	~/.spwn/skills/paper-reading.md
    - command: 'skills delete paper-reading --confirm=refactoring'
      exit: 2
      stderr: |
          Error: you typed "refactoring", not "paper-reading"
          Hint: in a script: --confirm=paper-reading
    - command: 'skills'
      exit: 0
      stdout: |
          # Skills
          ●	paper-reading	One-line description of what this skill does.
