description: 'a sample reads This Mac''s counters into its history'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" world advance 1m; /usr/bin/jq -r ''.macs["macbook-pro"].engine.activity["macbook-pro"].series | .tiers[0].buckets[-1] as $b | "sampled: \($b.at != null), memory read: \($b.memory.mean > 0), disk read: \(.last.disk_total > 0)"'' world.json'
      exit: 0
      stdout: |
          sampled: true, memory read: true, disk read: true
