description: 'inside a server, the apps matrix is refused: station does not manage its apps'
env:
    - in-server
    - engine
runs:
    - command: 'guest serve --stdio | /usr/bin/jq -c ''.error'''
      stdin: |
          {"v":2,"id":"1","call":"apps.matrix","target":{},"in":{}}
      exit: 0
      stdout: |
          {"type":"not-for-this-machine","code":"section.not-for-this-machine","subject":"infra","detail":{"call":"apps.matrix","fix":"manage it with your own tooling: ssh infra","why":"infra is a server: Machines does not manage its apps"},"message":"infra is a server: Machines does not manage its apps","hint":"manage it with your own tooling: ssh infra"}
