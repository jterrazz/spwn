    - command: 'guest serve --stdio | /usr/bin/jq -c ''.out.Lines | map(.Text)'''
      stdin: |
          {"v":2,"id":"1","call":"journal.kept","target":{},"in":{"Since":"2026-11-04T00:00:00Z"}}
      exit: 0
      stdout: |
          ["gate-2 deleted","linux-1 restarted","node","node"]
