description: 'station automations --on a VM from a project no share of its start reaches is refused, exit 2'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /bin/mkdir site && /usr/bin/touch site/spwn.yaml && cd site && "$STATION" automations --on linux-1'
      exit: 2
      stderr: |
          Error: the project at ~/site is not shared with linux-1
          Hint: add it to linux-1's Machinefile vm.mounts
