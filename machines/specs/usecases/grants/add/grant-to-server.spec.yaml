description: 'A server keeps its own secrets: a grant to it is refused'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, field, subject, message, hint} end'''
      stdin: |
          {"v":2,"id":"1","call":"grants.add","in":{"Entry":"pw-2","To":"infra"}}
      exit: 0
      stdout: |
          {"code":"grant.to-server","field":null,"subject":"infra","message":"infra is a server: a grant never reaches it","hint":"give it its secrets with your own tooling"}
