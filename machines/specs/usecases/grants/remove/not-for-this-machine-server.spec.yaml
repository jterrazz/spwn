description: 'A server removes no grant: the vault is the Mac''s'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.this_mac = "infra"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, subject, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"grants.remove","in":{"Entry":"pw-1","To":"linux-1","Confirm":"yes"}}
      exit: 0
      stdout: |
          {"code":"section.not-for-this-machine","subject":"infra","message":"infra is a server: Machines does not manage its accounts"}
