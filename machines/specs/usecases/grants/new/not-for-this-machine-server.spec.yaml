description: 'A server grants nothing: the vault is the Macs'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.this_mac = "infra"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, field, subject, message, hint} end'''
      stdin: |
          {"v":2,"id":"1","watch":"grants.new","in":{"Entry":"pw-2"}}
      exit: 0
      stdout: |
          {"code":"section.not-for-this-machine","field":null,"subject":"infra","message":"infra is a server: Machines does not manage its accounts","hint":"manage it with your own tooling: ssh infra"}
