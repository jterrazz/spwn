description: 'station teams lists the teams declared, each with the agents of this folder that name it'
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ".macs[\"macbook-pro\"].stores.teams = [{\"Slug\":\"web\",\"Name\":\"Web Team\",\"Description\":\"Ships the site.\"},{\"Slug\":\"core\",\"Name\":\"Core\"}]" world.json > seeded.json && /bin/mv seeded.json world.json'
      exit: 0
    - command: 'agents create neo --team web'
      exit: 0
      stdout: |
          ●	neo	created	~/.spwn/agents/neo
    - command: 'agents create trinity --team web'
      exit: 0
      stdout: |
          ●	trinity	created	~/.spwn/agents/trinity
    - command: 'agents create smith'
      exit: 0
      stdout: |
          ●	smith	created	~/.spwn/agents/smith
    - command: 'teams'
      exit: 0
      stdout: |
          # Teams
          ●	core	Core	none
          ●	web	Web Team	neo, trinity	Ships the site.
