description: 'station teams <team> --on a VM reads the team kept on that VM'
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ".macs[\"linux-1\"].stores.teams = [{\"Slug\":\"web\",\"Name\":\"Web Team\"}]" world.json > seeded.json && /bin/mv seeded.json world.json'
      exit: 0
    - command: 'agents create neo --team web --on linux-1'
      exit: 0
      stdout: |
          	On linux-1:
          ●	neo	created	~/.spwn/agents/neo
    - command: 'teams web --on linux-1'
      exit: 0
      stdout: |
          	On linux-1:
          ●	web	Web Team	neo
          # Members
          ●	neo
    - command: 'teams web'
      exit: 2
      stderr: |
          Error: no team named "web"
          Hint: station teams
