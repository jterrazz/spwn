description: 'a stopped VM''s Overview is answered by its Mac from its record, its head saying it is stopped'
env:
    - stories
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | [.error, .out.Summary]'''
      stdin: |
          {"v":2,"id":"1","watch":"overview.read","target":{"name":"api"},"in":{}}
      exit: 0
      stdout: |
          [null,{"Head":{"Name":"api","Kind":"workspace","ThisMac":false,"Up":0},"Engine":"","Needs":[],"Lines":[],"VMs":null,"Pending":false,"Readiness":null,"Verdict":{"Tone":"plain","Sentence":"api is stopped.","Line":"Start it to read its pages."}}]
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | [.error, .out.Summary.Verdict]'''
      stdin: |
          {"v":2,"id":"1","call":"overview.read","target":{"name":"api"},"in":{}}
      exit: 0
      stdout: |
          [null,{"Tone":"plain","Sentence":"api is stopped.","Line":"Start it to read its pages."}]
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | [.error.code, .out.V2.Err]'''
      stdin: |
          {"v":2,"id":"1","call":"overview.read","target":{"name":"api"},"in":{"V2":true}}
      exit: 0
      stdout: |
          ["vm_stopped",null]
