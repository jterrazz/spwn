description: 'the verdict of a Mac with a VM whose create failed says it was not created, never down'
env:
    - two-macs
    - engine
runs:
    - command: 'world fault Hypervisor.Boot 1'
      exit: 0
    - command: 'machines create --memory 4G'
      exit: 1
      stderr: |
          Error: linux-2 did not boot: the hypervisor refused to boot it, as the world scripted it
          Hint: station machines start linux-2, or station machines delete linux-2
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out.Summary.Verdict | [.Tone, .Sentence]'' | /usr/bin/tail -1'
      stdin: |
          {"v":2,"id":"1","watch":"overview.read","in":{}}
      exit: 0
      stdout: |
          ["bad","linux-2 was not created."]
