description: 'station project create --from over a folder that exists is refused, exit 2, and writes nothing'
env: two-macs
runs:
    - command: 'project create --from matrix'
      exit: 0
      stdout: |
          ●	matrix	created	{{workdir}}/matrix
    - command: 'project create --from matrix'
      exit: 2
      stderr: |
          Error: {{workdir}}/matrix exists: a project is made as a new folder
          Hint: pick another name
