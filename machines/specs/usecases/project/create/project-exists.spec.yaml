description: 'station project create over a folder that exists is refused, exit 2, and writes nothing'
env: two-macs
runs:
    - command: 'project create site'
      exit: 0
      stdout: |
          ●	site	created	{{workdir}}/site
    - command: 'project create site'
      exit: 2
      stderr: |
          Error: {{workdir}}/site exists: a project is made as a new folder
          Hint: pick another name
