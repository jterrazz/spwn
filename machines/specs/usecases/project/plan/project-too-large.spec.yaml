description: 'station project plan refuses a name of the declaration past its budget, naming its kind'
env:
    - two-macs
    - engine
runs:
    - command: 'project create site'
      exit: 0
      stdout: |
          ●	site	created	{{workdir}}/site
    - command: '--version >/dev/null; "$STATION" world project "$HOME/site" edit agents/neo/a/b/c/d/e/f/g/h/i/j/k/l/m/n/o/p.md deep'
      exit: 0
    - command: '--version >/dev/null; /bin/mkdir -p site && cd site && "$STATION" project plan'
      exit: 2
      stderr: |
          Error: agents/neo/a/b/c/d/e/f/g/h/i/j/k/l/m/n/o is past the budget of a project's declaration: 4096 names in its folders, 16 deep, files of 4 MiB
          Hint: move it away, or move the project's agents elsewhere with folders: agents: <folder> in spwn.yaml, then station project plan
