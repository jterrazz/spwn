description: 'station project plan refuses a FIFO in the declaration, naming it, and waits on nothing'
env:
    - two-macs
    - engine
runs:
    - command: 'project create site'
      exit: 0
      stdout: |
          ●	site	created	{{workdir}}/site
    - command: '--version >/dev/null; "$STATION" world project "$HOME/site" fifo spwn/agents/neo/AGENTS.md'
      exit: 0
    - command: '--version >/dev/null; /bin/mkdir -p site && cd site &&"$STATION" project plan'
      exit: 2
      stderr: |
          Error: spwn/agents/neo/AGENTS.md is neither a file nor a folder: a project's declaration holds only those
          Hint: move it away, then station project plan
