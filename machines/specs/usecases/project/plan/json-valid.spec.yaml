description: 'station project plan --json of a valid project carries the verdict and the changes to apply'
env:
    - two-macs
    - engine
runs:
    - command: 'project create site'
      exit: 0
      stdout: |
          ●	site	created	{{workdir}}/site
    - command: '--version >/dev/null; /bin/mkdir -p site && cd site && "$STATION" project plan --json'
      exit: 0
      stdout: |
          {
            "schema": "station.project.plan/v1",
            "generated_at": "{{iso8601}}",
            "machine": {
              "name": "macbook-pro",
              "label": "This Mac",
              "kind": "computer",
              "on": null,
              "this_mac": true
            },
            "findings": [],
            "valid": true,
            "manifest": "{{workdir}}/site/spwn.yaml",
            "summary": {
              "errors": 0,
              "warnings": 0,
              "info": 0
            },
            "issues": [],
            "changes": [
              {
                "agent": "neo",
                "path": ".spwn/agents/neo/CLAUDE.md",
                "kind": "add",
                "byHand": false
              }
            ]
          }
