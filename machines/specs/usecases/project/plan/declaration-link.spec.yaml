description: 'station project plan refuses a linked folder of the declaration, naming it'
env:
    - two-macs
    - engine
runs:
    - command: 'project create site'
      exit: 0
      stdout: |
          ●	site	created	{{workdir}}/site
    - command: '--version >/dev/null; "$STATION" world project "$HOME/site" link skills /tmp/elsewhere'
      exit: 0
    - command: '--version >/dev/null; /bin/mkdir -p site && cd site && "$STATION" project plan'
      exit: 2
      stderr: |
          Error: skills is a link: a project's declaration is never read through one
          Hint: put the file it points to there instead, or move the project's skills elsewhere with folders: skills: <folder> in spwn.yaml, then station project plan
