description: 'station project apply --json never asks: one that overwrites refuses and names --yes'
env:
    - two-macs
    - engine
runs:
    - command: 'project create site'
      exit: 0
      stdout: |
          ●	site	created	{{workdir}}/site
    - command: '--version >/dev/null; /bin/mkdir -p site && cd site && "$STATION" project apply'
      exit: 0
      stdout: |
          	{{workdir}}/site/spwn.yaml	1 change to apply
          # To apply
          ●	.spwn/agents/neo/CLAUDE.md	add
          ●	{{workdir}}/site/spwn.yaml	applied, 1 change
    - command: '--version >/dev/null; "$STATION" world project "$HOME/site" render neo CLAUDE.md "# neo, anew"'
      exit: 0
    - command: '--version >/dev/null; /bin/mkdir -p site && cd site && "$STATION" project apply --json'
      exit: 2
      stdout: |
          {
            "schema": "station.error/v1",
            "type": "needs-confirmation",
            "code": "confirm.yes-needed",
            "subject": "overwrites .spwn/agents/neo/CLAUDE.md",
            "message": "refusing without --yes: overwrites .spwn/agents/neo/CLAUDE.md",
            "hint": "re-run with --yes",
            "fix": null
          }
      stderr: |
          Error: refusing without --yes: overwrites .spwn/agents/neo/CLAUDE.md
          Hint: re-run with --yes
