description: 'station project apply refuses the old spwn/ layout, naming the folders already at the root'
env:
    - two-macs
    - engine
runs:
    - command: 'project create site'
      exit: 0
      stdout: |
          ●	site	created	{{workdir}}/site
    - command: '--version >/dev/null; "$STATION" world project "$HOME/site" edit spwn/skills/focus.md "focus" && "$STATION" world project "$HOME/site" edit skills/review.md "review"'
      exit: 0
    - command: '--version >/dev/null; /bin/mkdir -p site && cd site && "$STATION" project apply --yes'
      exit: 2
      stderr: |
          Error: spwn/ is the old project layout: its folders now sit at the project's root. Move each one up (mv spwn/agents agents, and the same for skills, tools, hooks, commands, profiles), point knowledge: at its new path, change any .gitignore line naming spwn/, then run again. skills/ already sits at the root: merge what spwn/ holds of each into it, then remove spwn/.
          Hint: move what spwn/ holds to the root, then station project plan
    - command: '--version >/dev/null; /usr/bin/jq -c ".macs[\"macbook-pro\"].stores.projects[] | (.Record // {} | length)" world.json'
      exit: 0
      stdout: |
          0
