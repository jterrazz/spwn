description: 'station project --json carries the name, the root, the file and the agents'
env:
    - two-macs
    - engine
runs:
    - command: 'project create site'
      exit: 0
      stdout: |
          ●	site	created	{{workdir}}/site
    - command: '--version >/dev/null; /bin/mkdir site && cd site && "$STATION" project --json'
      exit: 0
      stdout: |
          {
            "schema": "station.project.show/v1",
            "generated_at": "{{iso8601}}",
            "machine": {
              "name": "macbook-pro",
              "label": "This Mac",
              "kind": "computer",
              "on": null,
              "this_mac": true
            },
            "findings": [],
            "name": "site",
            "root": "{{workdir}}/site",
            "manifest": "{{workdir}}/site/spwn.yaml",
            "agents": [
              "neo"
            ]
          }
