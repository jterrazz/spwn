description: 'a build VM boots with its disk unsynced: thrown away on any failure, it never waits on a flush'
fixture: ../../__fixtures__/build/
env: two-macs
runs:
    - command: 'images build base-ubuntu --binary $HOME/station-linux'
      exit: 0
      stdout: |
          ●	base-ubuntu	2026.11.04	built
    - command: '--version >/dev/null; /usr/bin/jq -r ''.macs["macbook-pro"].vms["station-image-base-ubuntu-2026.11.04"].booted.sync'' world.json'
      exit: 0
      stdout: |
          none
