description: 'macos has no recipe in station: it is fetched where it is released, never built'
env:
    - two-macs
    - engine
runs:
    - command: 'images build base-macos'
      exit: 2
      stderr: |
          Error: Machines has no recipe for base-macos: it is fetched, never built here
          Hint: station images update base-macos
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.error) | .error | {code, subject, message}'''
      stdin: |
          {"v":2,"id":"1","call":"images.build","in":{"Names":["base-macos"]}}
      exit: 0
      stdout: |
          {"code":"image.no-recipe","subject":"base-macos","message":"Machines has no recipe for base-macos: it is fetched, never built here"}
