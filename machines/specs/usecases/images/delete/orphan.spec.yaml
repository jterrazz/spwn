description: 'an orphan is deleted by its name like any other; a name with no record is no image'
env:
    - two-macs
    - engine
runs:
    - command: 'world edit macbook-pro images/station-linux/2026.11.17.json'
      stdin: |
          {
              "name": "station-linux",
              "version": "2026.11.17",
              "distro": "ubuntu",
              "distro_version": "24.04",
              "base": "ghcr.io/cirruslabs/ubuntu:24.04",
              "station": "v3.1.0",
              "recipe_sha": "23e975f7",
              "machinefile": "station-linux",
              "built_at": "2026-11-17T03:01:36Z",
              "size_gb": 5
          }
      exit: 0
    - command: 'world edit macbook-pro images/linux/2026.11.10.json'
      stdin: |
          {
              "name": "linux",
              "version": "2026.11.10",
              "base": "ghcr.io/cirruslabs/ubuntu:24.04",
              "station": "v3.0.0",
              "recipe_sha": "377d9009",
              "built_at": "2026-11-10T17:56:26Z",
              "size_gb": 4
          }
      exit: 0
    - command: 'images delete station-linux --yes </dev/null'
      exit: 0
      stdout: |
          ●	station-linux	2026.11.17	deleted
    - command: 'images delete linux@2026.11.10 --yes </dev/null'
      exit: 0
      stdout: |
          ●	linux	2026.11.10	deleted
    - command: 'images delete station-linux --yes </dev/null'
      exit: 2
      stderr: |
          Error: no image "station-linux"
          Hint: station images
    - command: 'images --json | /usr/bin/jq -c ''[.images[] | select(.orphan)] | length'''
      exit: 0
      stdout: |
          0
