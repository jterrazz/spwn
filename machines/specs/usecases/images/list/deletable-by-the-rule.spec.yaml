description: 'images.list says which version Delete is offered: not the newest, and no machine made from it'
env:
    - two-macs
    - engine
runs:
    - command: 'guest serve --stdio | /usr/bin/jq -s -c ''[.[] | select(.out)] | last | .out | map([.Mac, .Record.version, .Newest, .Deletable, .VMs])'''
      stdin: |
          {"v":2,"id":"1","call":"images.list","in":{}}
      exit: 0
      stdout: |
          [["macbook-pro","2026.11.01",true,false,["api","linux-1"]],["macbook-pro","2026.10.20",false,true,null]]
