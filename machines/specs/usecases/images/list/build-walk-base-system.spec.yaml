description: 'a build at base system lists its four steps with where each stands, step 1 of 4'
env:
    - two-macs
    - engine
runs:
    - command: 'world building base-ubuntu base-system'
      exit: 0
    - command: 'guest serve --stdio | /usr/bin/jq -s -c ''[.[] | select(.out)] | last | .out | map(select(.Building) | .Building | [.Step, .Position, .Sentence, [.Walk[] | [.Step, .State, .Word]]])'''
      stdin: |
          {"v":2,"id":"1","call":"images.list","in":{}}
      exit: 0
      stdout: |
          [["base-system",1,"Step 1 of 4",[["base-system","now","Base system"],["packages","next","Packages"],["settings","next","Settings"],["seal","next","Seal"]]]]
