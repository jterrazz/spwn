description: 'a Mac that holds no image lists each image as not built or not fetched yet, and --json holds none'
env: one-mac
runs:
    - command: 'images'
      exit: 0
      stdout: |
          ○	base-ubuntu				not built yet
          ○	base-debian				not built yet
          ○	base-macos				not fetched yet · station images update base-macos
    - command: 'images --json | /usr/bin/jq -c ''[.schema, .images]'''
      exit: 0
      stdout: |
          ["station.images.list/v1",[]]
