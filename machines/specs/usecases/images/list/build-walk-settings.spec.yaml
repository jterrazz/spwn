description: 'a build at settings lists its four steps with where each stands, step 3 of 4'
env:
    - two-macs
    - engine
runs:
    - command: 'world building base-ubuntu settings'
      exit: 0
    - command: 'guest serve --stdio | /usr/bin/jq -s -c ''[.[] | select(.out)] | last | .out | map(select(.Building) | .Building | [.Step, .Position, .Sentence, [.Walk[] | [.Step, .State, .Word]]])'''
      stdin: |
          {"v":2,"id":"1","call":"images.list","in":{}}
      exit: 0
      stdout: |
          [["settings",3,"Step 3 of 4",[["base-system","done","Base system"],["packages","done","Packages"],["settings","now","Settings"],["seal","next","Seal"]]]]
