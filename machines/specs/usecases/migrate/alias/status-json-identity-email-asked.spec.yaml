description: 'a git email other than the one the preferences ask is degraded; an unset preference asks none'
fixture:
    - ./__fixtures__/status/workspace/
    - ./__fixtures__/status/identity/
    - ./__fixtures__/status/email-asked/
runs:
    - command: 'status --json | /usr/bin/jq -c ''.identity | map(select(.name == "git-email") | [.name, .state, .value, .detail])'''
      exit: 0
      stdout: |
          [["git-email","degraded","you@example.com","expected me@example.com"]]
