description: 'completion offers the commands of the help, the bare overview first, never plumbing'
env: one-mac
runs:
    - command: '__complete "" 2>/dev/null | /usr/bin/grep -v "^:" | /usr/bin/cut -f1'
      exit: 0
      stdout: |
          overview
          machines
          devices
          images
          engine
          approvals
          apps
          settings
          disk
          ports
          accounts
          background
          awake
          activity
          agents
          skills
          project
          teams
          automations
          init
          use
          journal
          machinefile
          help
    - command: 'completion zsh | /usr/bin/grep -c "compdef _station station"'
      exit: 0
      stdout: |
          1
