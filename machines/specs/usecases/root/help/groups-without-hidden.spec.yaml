description: 'station help lists its groups and commands in one order, never an alias, never an empty group'
env: one-mac
runs:
    - command: 'help | /usr/bin/grep -E "^  [A-Z]" | /usr/bin/sed -E "s/ +$//"'
      exit: 0
      stdout: |4
            Set up and run this Mac, its VMs and your other Macs
            USAGE
            MACHINE
            AGENT
            SPWN
            FLAGS
    - command: 'help | /usr/bin/sed -n "/^  MACHINE/,/^  AGENT/p" | /usr/bin/grep -oE "^    [a-z]+ " | /usr/bin/tr -d " "'
      exit: 0
      stdout: |
          machines
          devices
          images
          engine
          apps
          settings
          disk
          ports
          accounts
          background
          awake
          activity
    - command: 'help | /usr/bin/sed -n "/^  AGENT/,/^  SPWN/p" | /usr/bin/grep -oE "^    [a-z]+ " | /usr/bin/tr -d " "'
      exit: 0
      stdout: |
          agents
          skills
          project
          teams
          automations
    - command: 'help | /usr/bin/sed -n "/^  SPWN/,/^  FLAGS/p" | /usr/bin/grep -oE "^    [a-z]+ " | /usr/bin/tr -d " "'
      exit: 0
      stdout: |
          overview
          init
          use
          journal
          machinefile
          help
    - command: '--help | /usr/bin/grep -cwE "^    (status|start|stop|shell|daemon|guest|completion|man|world|pipe|supervise)"'
      exit: 1
      stdout: |
          0
    - command: 'machines --help | /usr/bin/grep -cwE "supervise|pipe"'
      exit: 1
      stdout: |
          0
