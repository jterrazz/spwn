description: 'A code for an exchange that does not exist is refused'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, subject, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"accounts.answer","in":{"Exchange":"ex-404","Code":"good"}}
      exit: 0
      stdout: |
          {"code":"login.no-exchange","subject":"ex-404","message":"no sign-in ex-404 is in progress"}
