description: 'A code for a sign-in that asks for none is refused'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["macbook-pro"].accounts.exchanges = {"ex-9": {"program": "gh", "kind": "device-code", "site": "github.com", "expires": "2026-11-04T10:30:00Z"}}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, subject, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"accounts.answer","in":{"Exchange":"ex-9","Code":"good"}}
      exit: 0
      stdout: |
          {"code":"login.not-asking","subject":"ex-9","message":"sign-in ex-9 waits for no code"}
