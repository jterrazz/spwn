description: 'A workspace opens no link: it is the Mac''s to do'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.this_mac = "linux-1"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, subject, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"accounts.open","in":{"Exchange":"ex-9"}}
      exit: 0
      stdout: |
          {"code":"section.not-for-this-machine","subject":"linux-1","message":"passwords and grants are a Mac's"}
