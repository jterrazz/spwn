description: 'A sign-in that no longer works says why in its line and offers signing in again'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out.Programs[] | select(.State == "broken") | [.Program, .Action, .Line]'''
      stdin: |
          {"v":2,"id":"1","watch":"accounts.list","in":{"Machine":"linux-1"}}
      exit: 0
      stdout: |
          ["wrangler","sign-in-again","Refused at the provider"]
