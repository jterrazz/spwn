description: 'a granted row names the password it came from by its label'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out.Programs[] | select(.How == "granted") | [.Program, .Entry, .EntryLabel]'''
      stdin: |
          {"v":2,"id":"1","watch":"accounts.list","in":{"Machine":"linux-1"}}
      exit: 0
      stdout: |
          ["npm","pw-2","npm publish"]
