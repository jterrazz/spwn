description: 'A login that asks for a site off the list ends refused'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''del(.macs["macbook-pro"].accounts.programs.gh) | .macs["macbook-pro"].accounts.logins = {"gh": {"end": "site-refused"}}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.error) | .error | {code, field, subject, message, hint}'''
      stdin: |
          {"v":2,"id":"1","watch":"accounts.login","in":{"Program":"gh"}}
      exit: 0
      stdout: |
          {"code":"login.site-refused","field":null,"subject":"gh","message":"GitHub asked to open a site Machines does not know","hint":"nothing was opened"}
