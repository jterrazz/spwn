description: 'A server keeps its own sign-ins: the sign-out is refused'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.this_mac = "infra"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out | [.Program, .State, .Action] else .error | {code, subject, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"accounts.logout","in":{"Program":"gh","Confirm":"yes"}}
      exit: 0
      stdout: |
          {"code":"section.not-for-this-machine","subject":"infra","message":"infra is a server: station does not manage its accounts"}
