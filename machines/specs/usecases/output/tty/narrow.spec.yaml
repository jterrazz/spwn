              → sudo launchctl bootout system/com.bjango.istatmenus.installer &&
                sudo rm /Library/LaunchDaemons/com.bjango.istatmenus.installer.plist
            ◐ com.docker.socket  root  idle  Docker.app (gone)
              /Library/LaunchDaemons/com.docker.socket.plist
              → sudo launchctl bootout system/com.docker.socket &&
                sudo rm /Library/LaunchDaemons/com.docker.socket.plist
            ◐ com.docker.vmnetd  root  idle  Docker.app (gone)
              /Library/LaunchDaemons/com.docker.vmnetd.plist
              → sudo launchctl bootout system/com.docker.vmnetd &&
                sudo rm /Library/LaunchDaemons/com.docker.vmnetd.plist
          Machines    ● 1 · com.jterrazz.station.engine
