          OK             ● 7 · github-release, mise, go, ghostty, …
          Not for this machine  10 apps live on other machines

          → station apps update            the 2 updates
          → station apps install <app...>  install some
    - command: '--version >/dev/null; terminal --size 60x60 /usr/bin/env -u NO_COLOR COLUMNS=60 "$STATION" background'
      stdin: |
          scrollback
      exit: 0
      stdout: |
          This Mac · 14 background tasks · 1 failing · 3 orphans

          Failing
            ✗ com.example.brain.x-snapshot  user    ~/Librar…ot.plist
