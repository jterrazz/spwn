description: 'a 60-column read cuts details by their kind, never a name, a state word or a command'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 60x40 /usr/bin/env -u NO_COLOR COLUMNS=60 "$STATION" overview'
      stdin: |
          scrollback
      exit: 0
      stdout: |
          This Mac · macbook-pro · 8 things need you · Engine running

          Needs you
            ✗ com.example.brain.x-snapshot is failing, last exit 2
              station background remove com.example.brain.x-snapshot
            ◐ 1 mise update waiting
              station apps update --manager mise
            ◐ 1 brew update waiting
              station apps update --manager brew
            ◐ Firewall: off
              System Settings > Network > Firewall
            ◐ ~/.tart is misplaced  station disk move ~/.tart
            3 more: station overview --all
          Activity    memory 12.4 of 16 GB · 388 GB free
          Apps        ● 7 ok · ◐ 2 updates · ○ 105 not installed
          Settings    set by Machines · ○ 0 of 17 · checked
                      ● 8 of 9
          Disk        ◐ 388 GB free · 34.8 GB can rebuild
                      ◐ 1 misplaced
          Ports       Public 0 · Private 2
          Accounts    ● 3
          Background  ● 10 · ✗ 1 failing · ◐ 3 orphans
          Awake       ○ sleeps normally
          VMs         ○ api stopped · ● linux-1 running

          → station background remove com.example.brain.x-snapshot
          → station overview --all  for every line
    - command: '--version >/dev/null; terminal --size 60x60 /usr/bin/env -u NO_COLOR COLUMNS=60 "$STATION" apps'
      stdin: |
          scrollback
      exit: 0
      stdout: |
          This Mac · 114 apps for this Mac · 2 updates
            105 not installed

          Updates
            ◐ node  22.11.0 → 24.11.0  mise  update available
              → station apps update node
            ◐ gh    2.97.0 → 2.98.0    brew  update available
              → station apps update gh
