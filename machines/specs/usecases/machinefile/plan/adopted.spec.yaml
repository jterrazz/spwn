description: 'an app already there by another way than its method is adopted, never installed again'
fixture: ../../__fixtures__/rg-by-hand/
env: two-macs
runs:
    - command: 'world edit macbook-pro machinefiles/macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [jq, ripgrep]
      exit: 0
    - command: 'machinefile plan'
      exit: 0
      stdout: |
          # Adopted
          ?	ripgrep	brew	on PATH, not managed by brew
    - command: 'machinefile apply'
      exit: 0
      stdout: |
          # Adopted
          ?	ripgrep	brew	on PATH, not managed by brew
          ●	homebrew	5.0.1	script	the manager of jq
          ●	jq	1.8.1	brew
          ◐	ripgrep		brew	adopted · on PATH, not managed by brew
    - command: 'apps | /usr/bin/grep "	ripgrep	"'
      exit: 0
      stdout: |
          ?	ripgrep		brew	on PATH, not managed by brew
    - command: 'machinefile plan'
      exit: 0
      stdout: |
          # Adopted
          ?	ripgrep	brew	on PATH, not managed by brew
    - command: 'machinefile drift'
      exit: 0
      stdout: |
          # Packages
          ●	homebrew	script	present
          ●	jq	brew	present
          ?	ripgrep	brew	adopted · on PATH, not managed by brew
