description: 'a plan carries an extra as extra, never as a removal, whatever apply --remove would do'
fixture: ../../__fixtures__/homebrew/
env:
    - two-macs
    - engine
runs:
    - command: 'world edit macbook-pro machinefiles/macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [jq, fd, eza]
      exit: 0
    - command: 'apply > /dev/null'
      exit: 0
    - command: 'world edit macbook-pro machinefiles/macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [jq, eza]
      exit: 0
    - command: 'guest serve --stdio | /usr/bin/jq -c ''.out | {Extra: [.Extra[] | {Package: .Step.Package, Action, Condition: .Seen.Condition}], Actions: [.Lines[].Action] | unique}'''
      stdin: |
          {"v":2,"id":"1","call":"machinefile.plan","target":{},"in":{}}
      exit: 0
      stdout: |
          {"Extra":[{"Package":"fd","Action":"extra","Condition":"present"}],"Actions":["keep"]}
    - command: 'plan --json | /usr/bin/jq -c ''.extra'''
      exit: 0
      stdout: |
          [{"package":"fd","method":"brew","machinefile":"macbook-pro","condition":"present","action":"remove"}]
