description: 'a computer that says vm, itself or through a file it extends, is refused naming the file'
env: two-macs
runs:
    - command: 'world edit macbook-pro machinefiles/macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: macbook-pro
          machine: { kind: computer, system: { os: macos } }
          extends: [base-macos]
      exit: 0
    - command: 'machinefile explain'
      exit: 2
      stderr: |
          Error: macbook-pro is a computer, and built-in/machinefiles/base-macos.machine.yaml says vm: vm is a workspace's or a server's
          Hint: remove vm, or say kind: workspace or server
