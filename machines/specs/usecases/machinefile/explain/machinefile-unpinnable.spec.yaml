description: 'a range its method cannot hold is refused naming the manager that can, which then holds it'
env: two-macs
runs:
    - command: 'world edit macbook-pro catalog/command-line/jq.yaml'
      stdin: |
          package: station.package/v1
          kind: app
          name: jq
          description: Command-line JSON processor
          provides: [jq]
          methods:
              - { os: macos, brew: jq }
              - { os: any, mise: { name: jq, version: latest } }
      exit: 0
    - command: 'world edit macbook-pro machinefiles/macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [{ name: jq, version: '1.7' }]
      exit: 0
    - command: 'machinefile explain'
      exit: 2
      stderr: |
          Error: jq 1.7: brew holds only its newest, never 1.7 (~/.config/station/machinefiles/macbook-pro.machine.yaml:4)
          Hint: mise can: { name: jq, version: "1.7", manager: mise }
    - command: 'world edit macbook-pro machinefiles/macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [{ name: jq, version: '1.7', manager: mise }]
      exit: 0
    - command: 'machinefile explain apps.jq'
      exit: 0
      stdout: |
          # macbook-pro
          	apps.jq	1.7	user	macbook-pro
          	apps.jq.method	mise	user	jq
          	apps.jq.because	its one method for macos	user	jq
