description: 'a versioned formula (postgresql@18) holds its own major and refuses any other'
fixture: ../../__fixtures__/homebrew/
env: two-macs
runs:
    - command: 'world edit macbook-pro machinefiles/macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [{ name: postgres, version: '17' }]
      exit: 0
    - command: 'machinefile explain apps.postgres'
      exit: 2
      stderr: |
          Error: postgres 17: brew holds only its newest of 18 (postgresql@18), never 17 (~/.config/station/machinefiles/macbook-pro.machine.yaml:4)
          Hint: no method of postgres for this system holds it: drop its version
    - command: 'world edit macbook-pro machinefiles/macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [{ name: postgres, version: '18' }]
      exit: 0
    - command: 'machinefile explain apps.postgres'
      exit: 0
      stdout: |
          # macbook-pro
          	apps.postgres	18	user	macbook-pro
          	apps.postgres.method	brew	built-in	postgres
          	apps.postgres.because	its one method for macos	built-in	postgres
    - command: 'machinefile apply'
      exit: 0
      stdout: |
          # To install
          ○	postgres	brew
          # To set
          ○	postgres	shell	~/.zshrc [station:postgres/path]: 1 line
          ●	homebrew	5.0.1	script	the manager of postgres
          ●	postgres	1.0.0	brew
          ●	postgres		shell	~/.zshrc [station:postgres/path]: written
