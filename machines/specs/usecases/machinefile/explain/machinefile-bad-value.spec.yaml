description: 'an option the package lacks or a secret written out is refused; a vault: reference is a secret'
env: two-macs
runs:
    - command: 'world edit macbook-pro machinefiles/macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: macbook-pro
          machine: { kind: computer, system: { os: macos } }
          settings:
              autologin: { colour: blue }
      exit: 0
    - command: 'machinefile explain'
      exit: 2
      stderr: |
          Error: autologin's colour: no option of autologin (~/.config/station/machinefiles/macbook-pro.machine.yaml:5)
          Hint: station machinefile explain
    - command: 'world edit macbook-pro machinefiles/macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: macbook-pro
          machine: { kind: computer, system: { os: macos } }
          settings:
              autologin: { password: hunter2 }
      exit: 0
    - command: 'machinefile explain'
      exit: 2
      stderr: |
          Error: autologin's password: a secret is a vault: reference (`vault:<name>`), never written out (~/.config/station/machinefiles/macbook-pro.machine.yaml:5)
          Hint: station machinefile explain
    - command: 'world edit macbook-pro machinefiles/macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: macbook-pro
          machine: { kind: computer, system: { os: macos } }
          settings:
              autologin: { password: "vault:agent-password" }
      exit: 0
    - command: 'machinefile explain settings.autologin'
      exit: 0
      stdout: |
          # macbook-pro
          	settings.autologin	listed	user	macbook-pro
          	settings.autologin.method	builtin	built-in	autologin
          	settings.autologin.because	its one method for macos	built-in	autologin
          	settings.autologin.password	vault:agent-password	user	macbook-pro
