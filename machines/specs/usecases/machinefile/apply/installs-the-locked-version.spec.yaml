description: 'an app the lock holds is installed by its method at its version, and explain names the lock'
fixture: ../../__fixtures__/homebrew/
env: two-macs
runs:
    - command: 'world edit macbook-pro machinefiles/macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [python]
      exit: 0
    - command: 'world edit macbook-pro machinefiles/macbook-pro.lock'
      stdin: |
          lock: station.lock/v1
          machinefile: macbook-pro
          apps:
              - { name: python, method: mise, version: 3.12.7 }
      exit: 0
    - command: 'plan'
      exit: 0
      stdout: |
          # To install
          ○	python	mise	locked 3.12.7
    - command: 'apply'
      exit: 0
      stdout: |
          # To install
          ○	python	mise	locked 3.12.7
          ●	homebrew	5.0.1	script	the manager of mise
          ●	mise	2026.10.1	brew	the manager of python
          ●	python	3.12.7	mise
    - command: 'explain apps.python'
      exit: 0
      stdout: |
          # macbook-pro
          	apps.python	listed	user	macbook-pro
          	apps.python.method	mise	lock	macbook-pro
          	apps.python.because	locked	lock	macbook-pro
          	apps.python.locked	3.12.7	lock	macbook-pro
    - command: '--version >/dev/null; /usr/bin/jq -r ''.macs["macbook-pro"].files["machinefiles/macbook-pro.lock"]'' world.json'
      exit: 0
      stdout: |+
          lock: station.lock/v1
          machinefile: macbook-pro
          apps:
              - name: homebrew
                method: script
                version: 5.0.1
              - name: mise
                method: brew
                version: 2026.10.1
              - name: python
                method: mise
                version: 3.12.7

