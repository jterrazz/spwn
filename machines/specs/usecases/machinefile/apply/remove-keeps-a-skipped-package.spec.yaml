description: 'apply --remove keeps an optional package the Machinefile still lists, skipped on this system'
fixture: ../../__fixtures__/homebrew/
env: two-macs
runs:
    - command: 'world edit macbook-pro machinefiles/macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [jq, fd]
      exit: 0
    - command: 'machinefile apply'
      exit: 0
      stdout: |
          # To install
          ○	fd	brew
          ●	homebrew	5.0.1	script	the manager of jq
          ●	jq	1.8.1	brew
          ●	fd	10.3.0	brew
    - command: 'world edit macbook-pro machinefiles/macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [jq, { name: fd, manager: mise, optional: true }]
      exit: 0
    - command: 'machinefile plan'
      exit: 0
    - command: 'machinefile apply --remove --yes'
      exit: 0
      stdout: |
          ●	homebrew	5.0.1	script	the manager of jq
          ●	jq	1.8.1	brew
    - command: 'apps fd | /usr/bin/head -1'
      exit: 0
      stdout: |
          ●	fd	10.3.0	brew
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["macbook-pro"].stores.ledger | map(.package)'' world.json'
      exit: 0
      stdout: |
          ["fd"]
