description: 'an app apply --remove takes back leaves the spwn skill, and the apps that stay keep their line'
fixture: ../../__fixtures__/homebrew/
env: two-macs
runs:
    - command: 'world edit macbook-pro machinefiles/macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [jq, fd, eza]
      exit: 0
    - command: 'machinefile apply >/dev/null'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq -r ''.macs["macbook-pro"].stores.spwn_skill'' world.json | /usr/bin/grep -e "^- .fd.:" -e "^- .eza.:"'
      exit: 0
      stdout: |
          - `eza`: Modern ls replacement
          - `fd`: Find files by name, .gitignore respected: fd ‹pattern› [path]; fd -e ‹extension› by extension
    - command: 'world edit macbook-pro machinefiles/macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [jq, fd]
      exit: 0
    - command: 'machinefile apply --remove --yes >/dev/null'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq -r ''.macs["macbook-pro"].stores.spwn_skill'' world.json | /usr/bin/grep -e "^- .fd.:" -e "^- .eza.:"'
      exit: 0
      stdout: |
          - `fd`: Find files by name, .gitignore respected: fd ‹pattern› [path]; fd -e ‹extension› by extension
