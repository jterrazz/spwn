description: 'a package of the shared source in a newer schema stops the files read with update station'
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["macbook-pro"].preferences.machinefile = {source: {name: "studio", url: "https://example.com/studio.git"}} | .sources = {"https://example.com/studio.git": {head: "1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d", commits: {"1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d": {"packages/command-line/jq.yaml": "package: station.package/v2\nkind: app\nname: jq\n"}}}}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'guest serve --stdio | /usr/bin/jq -c ''.error | {code, message}'''
      stdin: |
          {"v":2,"id":"1","call":"machinefile.files","target":{},"in":{}}
      exit: 0
      stdout: |
          {"code":"catalog.newer-schema","message":"studio@1a2b3c4/packages/command-line/jq.yaml is station.package/v2, newer than this station reads (station.package/v1)"}
