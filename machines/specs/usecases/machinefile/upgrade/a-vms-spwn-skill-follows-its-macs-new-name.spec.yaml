description: 'a renamed Mac is named by the skill of its VM at the update after the VM restarts'
fixture: ../../__fixtures__/build/
env: two-macs
runs:
    - command: 'world edit macbook-pro machinefiles/studio-linux.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: studio-linux
          machine: { kind: workspace, system: { os: ubuntu, version: '24.04' } }
          extends: [base-ubuntu]
          vm:
            resources: { memory: 4G }
          apps: [jq]
      exit: 0
    - command: 'images build studio-linux --binary $HOME/station-linux >/dev/null'
      exit: 0
    - command: 'machines create --memory 4G web --from studio-linux >/dev/null'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq -r ''.macs["web"].stores.spwn_skill'' world.json | /usr/bin/grep -e "^- Mac: "'
      exit: 0
      stdout: |
          - Mac: `macbook-pro`, the Mac this VM runs on
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["macbook-pro"].preferences.name = "studio-laptop"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'machines restart web >/dev/null'
      exit: 0
    - command: 'machinefile update --on web >/dev/null'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq -r ''.macs["web"].stores.spwn_skill'' world.json | /usr/bin/grep -e "^- Mac: "'
      exit: 0
      stdout: |
          - Mac: `studio-laptop`, the Mac this VM runs on
