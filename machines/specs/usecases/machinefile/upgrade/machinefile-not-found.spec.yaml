description: 'upgrade on a machine with no Machinefile names the gesture that gives it one'
fixture: ../../__fixtures__/homebrew/
env: two-macs
runs:
    - command: 'machinefile update'
      exit: 2
      stderr: |
          Error: no Machinefile named macbook-pro
          Hint: give this machine one: station init --machinefile <name>
