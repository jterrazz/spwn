description: 'a port audiences names is shared with its own audience, its neighbours with the rights'
env: two-macs
runs:
    - command: 'world edit macbook-pro machinefiles/linux-1.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: linux-1
          machine: { kind: workspace }
          ports: { open: 3000-3999, to: private, except: [3000], audiences: { 3000: local } }
      exit: 0
    - command: 'world listen linux-1 "*:3000" node'
      exit: 0
    - command: 'world listen linux-1 "*:3001" node'
      exit: 0
    - command: 'ports | /usr/bin/grep -e "	3000	" -e "	3001	"'
      exit: 0
      stdout: |
          ●	linux-1	3001	private	https://macbook-pro.tail1234.ts.net:40001	shared	node
          ●	linux-1	3000	this machine only	http://127.0.0.1:{{port}}	shared	node	probably Node or Next
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["macbook-pro"] | {reserved: [(.stores.reservations // [])[] | [.guest_port, .host_port, .to]], shared: [(.tailnet.shares // [])[] | [.Port, .Reserved, .To]], funnel: .tailnet.funnel}'' world.json'
      exit: 0
      stdout: |
          {"reserved":[[3000,40000,"local"],[3001,40001,null]],"shared":[[40001,40001,"private"]],"funnel":null}
