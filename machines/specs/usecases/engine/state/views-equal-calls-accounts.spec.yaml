description: 'this Mac''s sign-ins and its VM''s are their call''s answers'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; echo ''{"v":2,"id":"1","watch":"engine.state","in":{"keys":["accounts.list","accounts.list:linux-1","accounts.list:api"],"revision":2}}'' | "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out.event == "snapshot") | .out.slices | map_values(.value)'' > views.json & echo ''{"v":2,"id":"1","watch":"accounts.list","in":{}}'' | "$STATION" guest serve --stdio | /usr/bin/jq -c -s ''map(select(.out)) | {"accounts.list": .[-1].out}'' > call0.json & echo ''{"v":2,"id":"1","watch":"accounts.list","in":{"Machine":"linux-1"}}'' | "$STATION" guest serve --stdio | /usr/bin/jq -c -s ''map(select(.out)) | {"accounts.list:linux-1": .[-1].out}'' > call1.json & echo ''{"v":2,"id":"1","watch":"accounts.list","in":{"Machine":"api"}}'' | "$STATION" guest serve --stdio | /usr/bin/jq -c -s ''map(select(.out)) | {"accounts.list:api": .[-1].out}'' > call2.json & wait'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq -c -s add call0.json call1.json call2.json > calls.json; /usr/bin/jq -c -s ''def differ(a; b): [ (a | paths(scalars|true)) as $p | select((a | getpath($p)) != (b | getpath($p))) | ($p | map(tostring) | join(".")) ] + [ (b | paths(scalars|true)) as $p | select((a | getpath($p)) == null and (b|getpath($p)) != null) | ($p | map(tostring) | join(".")) ] | unique; .[0] as $v | .[1] as $c | $v | keys | map({key: ., value: differ($v[.]; $c[.])}) | from_entries'' views.json calls.json'
      exit: 0
      stdout: |
          {"accounts.list":[],"accounts.list:api":[],"accounts.list:linux-1":[]}
