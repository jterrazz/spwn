description: 'a Mac whose engine serves no state is too old: its slice unread, never read by older calls'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["mac-mini"].station = "dev" | .macs["macbook-pro"].station = "dev" | .macs["mac-mini"].lacks = ["engine.state"]'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out.event == "snapshot") | .out.slices["mac:mac-mini"] | [.state, .why, (.value != null)]'''
      stdin: |
          {"v":2,"id":"1","watch":"engine.state","in":{"keys":["mac:mac-mini"],"revision":1}}
      exit: 0
      stdout: |
          ["unread","far-too-old",false]
