description: 'with the mini offline, the views are still their calls'' answers but for when each was read'
env:
    - mini-offline
    - engine
runs:
    - command: '--version >/dev/null; echo ''{"v":2,"id":"1","watch":"engine.state","in":{"keys":["machines.list","overview.read","overview.read+elsewhere"],"revision":1}}'' | "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out.event == "snapshot") | .out.slices | map_values(.value)'' > views.json & echo ''{"v":2,"id":"1","watch":"machines.list","in":{}}'' | "$STATION" guest serve --stdio | /usr/bin/jq -c -s ''map(select(.out)) | {"machines.list": .[-1].out}'' > list.json & echo ''{"v":2,"id":"1","watch":"overview.read","in":{"Elsewhere":true}}'' | "$STATION" guest serve --stdio | /usr/bin/jq -c -s ''map(select(.out)) | {"overview.read+elsewhere": .[-1].out}'' > elsewhere.json & wait'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq -c -s add list.json elsewhere.json > calls.json; /usr/bin/jq -c -s ''def differ(a; b): [ (a | paths(scalars)) as $p | select((a | getpath($p)) != (b | getpath($p))) | ($p | map(tostring) | join(".")) ] + [ (b | paths(scalars)) as $p | select((a | getpath($p)) == null and (b|getpath($p)) != null) | ($p | map(tostring) | join(".")) ] | unique; .[0] as $v | .[1] as $c | {list: differ($v["machines.list"]; $c["machines.list"]), elsewhere: differ($v["overview.read+elsewhere"]; $c["overview.read+elsewhere"]), own: differ($v["overview.read"]; $c["overview.read+elsewhere"])} '' views.json calls.json'
      exit: 0
      stdout: |
          {"list":["All.Read"],"elsewhere":["Summary.Read"],"own":["Summary.Read","Summary.Verdict.Sentence","Summary.Verdict.Tone"]}
