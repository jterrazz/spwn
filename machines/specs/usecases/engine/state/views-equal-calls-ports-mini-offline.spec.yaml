description: 'with the mini offline, every machine''s ports are still their call''s answer'
env:
    - mini-offline
    - engine
runs:
    - command: '--version >/dev/null; echo ''{"v":2,"id":"1","watch":"engine.state","in":{"keys":["ports.list+all-machines","ports.list:macbook-pro"],"revision":1}}'' | "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out.event == "snapshot") | .out.slices | map_values(.value)'' > views.json & echo ''{"v":2,"id":"1","call":"ports.list","in":{"AllMachines":true}}'' | "$STATION" guest serve --stdio | /usr/bin/jq -c -s ''map(select(.out)) | {"ports.list+all-machines": .[-1].out}'' > call0.json & echo ''{"v":2,"id":"1","call":"ports.list","in":{"Of":"macbook-pro"}}'' | "$STATION" guest serve --stdio | /usr/bin/jq -c -s ''map(select(.out)) | {"ports.list:macbook-pro": .[-1].out}'' > call1.json & wait'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq -c -s add call0.json call1.json > calls.json; /usr/bin/jq -c -s ''def differ(a; b): [ (a | paths(scalars|true)) as $p | select((a | getpath($p)) != (b | getpath($p))) | ($p | map(tostring) | join(".")) ] + [ (b | paths(scalars|true)) as $p | select((a | getpath($p)) == null and (b|getpath($p)) != null) | ($p | map(tostring) | join(".")) ] | unique; .[0] as $v | .[1] as $c | $v | keys | map({key: ., value: differ($v[.]; $c[.])}) | from_entries'' views.json calls.json'
      exit: 0
      stdout: |
          {"ports.list+all-machines":[],"ports.list:macbook-pro":[]}
