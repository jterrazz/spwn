description: 'this Mac holds the other Mac''s stream: its slices and its VMs arrive fresh with the first frame'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out.event == "snapshot") | .out.slices | to_entries | map(select(.key | endswith(":mac-mini") or endswith(":infra"))) | map([.key, .value.state, (.value.why // ""), (.value.value != null)])'''
      stdin: |
          {"v":2,"id":"1","watch":"engine.state","in":{"keys":["mac:*","overview:*"],"revision":2}}
      exit: 0
      stdout: |
          [["mac:mac-mini","fresh","",true],["overview:infra","fresh","",true],["overview:mac-mini","fresh","",true]]
