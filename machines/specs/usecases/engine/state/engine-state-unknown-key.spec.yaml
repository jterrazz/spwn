description: 'a key of no family of the store is refused on its keys'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .error then .error | {code, field} elif .out.event == "opened" then [.out.event, .out.stream, .out.state, .out.fit.verdict] else [.out.event, (.out.slices | to_entries | map([.key, .value.state, (.value.value != null)]))] end'''
      stdin: |
          {"v":2,"id":"1","watch":"engine.state","in":{"keys":["apps:macbook-pro"],"revision":2}}
      exit: 0
      stdout: |
          {"code":"engine.state-unknown-key","field":"keys"}
