description: 'with no release that carries a Mac binary, the latest release is not known yet'
env:
    - two-macs
    - engine
runs:
    - command: 'world upgrade macbook-pro v0.21.0'
      exit: 0
    - command: 'world release v0.22.0 no-asset'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out | {Installed, Latest, Behind, Head, Notes, Checked: (.Checked != null), Refused: .Refused.Message} else .error | {code, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"engine.refresh-release","in":{}}
      exit: 0
      stdout: |
          {"Installed":"v0.21.0","Latest":null,"Behind":false,"Head":{"Tone":"plain","Sentence":"The latest release is not known yet."},"Notes":null,"Checked":true,"Refused":null}
