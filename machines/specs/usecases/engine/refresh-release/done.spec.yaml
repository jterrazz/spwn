description: 'asked again now, GitHub''s latest release is kept and read'
env:
    - two-macs
    - engine
runs:
    - command: 'world upgrade macbook-pro v0.21.0'
      exit: 0
    - command: 'world release v0.22.0'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out | {Installed, Latest, Behind, Head, Notes, Checked: (.Checked != null), Refused: .Refused.Message} else .error | {code, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"engine.refresh-release","in":{}}
      exit: 0
      stdout: |
          {"Installed":"v0.21.0","Latest":"v0.22.0","Behind":true,"Head":{"Tone":"new","Sentence":"spwn v0.22.0 is out.","Line":"This Mac runs v0.21.0."},"Notes":"https://github.com/jterrazz/spwn/releases/tag/v0.22.0","Checked":true,"Refused":null}
