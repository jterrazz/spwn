description: 'a latest release whose tag no version reads is not taken, the previous one stays'
env:
    - two-macs
    - engine
runs:
    - command: 'world upgrade macbook-pro v0.21.0'
      exit: 0
    - command: 'world release v0.21.0'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio > /dev/null'
      stdin: |
          {"v":2,"id":"1","call":"engine.refresh-release","in":{}}
      exit: 0
    - command: 'world release v0.22'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out | {Installed, Latest, Behind, Head, Notes, Checked: (.Checked != null), Refused: .Refused.Message} else .error | {code, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"engine.refresh-release","in":{}}
      exit: 0
      stdout: |
          {"Installed":"v0.21.0","Latest":"v0.21.0","Behind":false,"Head":{"Tone":"ok","Sentence":"This Mac runs the latest release."},"Notes":"https://github.com/jterrazz/spwn/releases/tag/v0.21.0","Checked":true,"Refused":null}
