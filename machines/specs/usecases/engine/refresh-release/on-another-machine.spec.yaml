description: 'the mini asks GitHub for its own engine'
env:
    - two-macs
    - engine
runs:
    - command: 'world release v0.22.0'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq ''.this_mac = "mac-mini"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'world upgrade mac-mini v0.22.0'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out | {Installed, Latest, Behind, Head, Notes, Checked: (.Checked != null), Refused: .Refused.Message} else .error | {code, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"engine.refresh-release","in":{}}
      exit: 0
      stdout: |
          {"Installed":"v0.22.0","Latest":"v0.22.0","Behind":false,"Head":{"Tone":"ok","Sentence":"This Mac runs the latest release."},"Notes":"https://github.com/jterrazz/spwn/releases/tag/v0.22.0","Checked":true,"Refused":null}
