description: 'start on a Mac that has not approved Local Network checks for 90 s, then says what to do'
env: engine-stopped
runs:
    - command: 'world local-network macbook-pro not-approved'
      exit: 0
    - command: 'engine start'
      exit: 0
      stdout: |
          ●	engine	running · {{string}}
          ◐	local network	checking · if macOS asks, approve station on macbook-pro's screen, or in System Settings > Privacy & Security > Local Network
    - command: 'machines --this-mac'
      exit: 0
      stdout: |
          ●	macbook-pro	Mac	macbook-pro	Engine running
          ○	api	Workspace	macbook-pro	Stopped · persistent	4 CPU	8 GB
          ○	linux-1	Workspace	macbook-pro	Stopped · ephemeral	4 CPU	8 GB
    - command: 'world advance 90s'
      exit: 0
    - command: 'machines --this-mac'
      exit: 0
      stdout: |
          ●	macbook-pro	Mac	macbook-pro	Engine running
          ○	api	Workspace	macbook-pro	Stopped · persistent	4 CPU	8 GB
          ○	linux-1	Workspace	macbook-pro	Stopped · ephemeral	4 CPU	8 GB
          # Needs you
          ◐	This Mac	macbook-pro has not approved station for Local Network	approve station on macbook-pro's screen, or in System Settings > Privacy & Security > Local Network
    - command: 'world local-network macbook-pro approved'
      exit: 0
    - command: 'machines --this-mac'
      exit: 0
      stdout: |
          ●	macbook-pro	Mac	macbook-pro	Engine running
          ○	api	Workspace	macbook-pro	Stopped · persistent	4 CPU	8 GB
          ○	linux-1	Workspace	macbook-pro	Stopped · ephemeral	4 CPU	8 GB
