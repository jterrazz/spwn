description: 'inside a server, the Guides are refused: only a Mac runs an engine'
env:
    - in-server
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .error then .error | {code, field} else .out end'''
      stdin: |
          {"v":2,"id":"1","call":"engine.guides","in":{}}
      exit: 0
      stdout: |
          {"code":"section.not-for-this-machine","field":null}
