description: 'a create whose VM gets no address reads failed at Network, Try again its repair'
env:
    - two-macs
    - engine
runs:
    - command: 'world fault Hypervisor.Address'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | .error.code // .out.VM.Name'''
      stdin: |
          {"v":2,"id":"1","call":"machines.create-workspace","in":{"Request":{"Name":"linux-4","Image":"base-ubuntu","Size":{"MemoryBytes":4294967296}}}}
      exit: 0
      stdout: |
          null
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | .out.guides[]? // .error'''
      stdin: |
          {"v":2,"id":"1","call":"engine.guides","in":{}}
      exit: 0
      stdout: |
          {"id":"machines.create:linux-4","act":"machines.create","subject":"linux-4","steps":[{"id":"cloning","label":"Disk","status":"done"},{"id":"booting","label":"Boot","status":"done"},{"id":"address","label":"Network","status":"failed"},{"id":"ssh","label":"SSH","status":"next"}],"view":{"illustration":"boot-failed","headline":{"now":"Network failed","next":""},"sentence":"linux-4 is kept, failing Has an address: none after 60 s","move":"owner","kept":"linux-4 runs, but its set-up did not finish.","action":{"label":"Try again","call":"machines.start","args":{"VM":"linux-4"}},"quiet":{"label":"Delete linux-4","call":"machines.delete","args":{"VM":"linux-4"},"confirm":"linux-4"}},"ended":"failed","line":"Creating linux-4 failed at Network","live":false}
