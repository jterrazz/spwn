description: 'a create tags each progress with its step, the first with its Guide, then reads done'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | .out // .error'''
      stdin: |
          {"v":2,"id":"1","call":"engine.guides","in":{}}
      exit: 0
      stdout: |
          {"guides":[]}
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.progress or .out or .error) | if .progress then [.progress.act, .progress.step, .progress.task, .progress.guide.line] elif .out then .out.VM.Name else .error.code end'''
      stdin: |
          {"v":2,"id":"1","call":"machines.create-workspace","in":{"Request":{"Name":"linux-4","Image":"base-ubuntu","Size":{"MemoryBytes":4294967296}}}}
      exit: 0
      stdout: |
          ["machines.create:linux-4","cloning","cloning station-image-base-ubuntu-2026.11.01","Creating linux-4: Disk"]
          ["machines.create:linux-4","cloning","cloning station-image-base-ubuntu-2026.11.01",null]
          ["machines.create:linux-4","booting","Running",null]
          ["machines.create:linux-4","booting","Running",null]
          ["machines.create:linux-4","address","Has an address",null]
          ["machines.create:linux-4","address","Has an address",null]
          ["machines.create:linux-4","ssh","SSH answers",null]
          ["machines.create:linux-4","ssh","SSH answers",null]
          "linux-4"
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | .out.guides[]? // .error'''
      stdin: |
          {"v":2,"id":"1","call":"engine.guides","in":{}}
      exit: 0
      stdout: |
          {"id":"machines.create:linux-4","act":"New machine","subject":"linux-4","steps":[{"id":"cloning","label":"Disk","status":"done"},{"id":"booting","label":"Boot","status":"done"},{"id":"address","label":"Network","status":"done"},{"id":"ssh","label":"SSH","status":"done"}],"view":{"illustration":"done","headline":{"now":"linux-4 is ready.","next":"Open it in your terminal."},"sentence":"linux-4 runs on macbook-pro.","move":"owner","action":{"label":"Open linux-4","nav":"machine:linux-4"}},"ended":"done","line":"linux-4 is ready","live":false}
