description: 'an ephemeral that powers off while its hypervisor does not answer is kept, stopped'
env:
    - two-macs-tart
    - engine
runs:
    - command: 'world fault Hypervisor.Disks'
      exit: 0
    - command: 'world poweroff-inside linux-1'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["macbook-pro"] | {disk: .vms["linux-1"].disk, record: .vms["linux-1"].kept.lifetime, ports: [.stores.reservations[]? | select(.vm == "linux-1") | .host_port], tailscale: [.tailnet.shares[]?.Reserved], accounts: [.accounts.passwords[]? | select(any(.Grants[]?; .To == "linux-1")) | .Program], ssh: .ssh.blocks["linux-1"].behind}'' world.json'
      exit: 0
      stdout: |
          {"disk":true,"record":"ephemeral","ports":[40001,40002],"tailscale":[],"accounts":["npm"],"ssh":"macbook-pro"}
    - command: 'machines --this-mac'
      exit: 0
      stdout: |
          ●	macbook-pro	Mac	macbook-pro	Engine running
          ○	api	Workspace	macbook-pro	Stopped · persistent	4 CPU	8 GB
          ○	linux-1	Workspace	macbook-pro	Stopped · ephemeral	4 CPU	8 GB
          # Needs you
          ✗	This Mac	tart is not installed or does not answer	station apps install tart
