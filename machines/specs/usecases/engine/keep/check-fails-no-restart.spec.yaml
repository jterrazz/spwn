description: 'a health check that passed then fails is red and needs you, no restart'
env: two-macs
runs:
    - command: 'machines infra | /usr/bin/grep Check'
      exit: 0
      stdout: |
          ●	Check passes	https://infra:6443/readyz
    - command: 'world fault CheckRunner.Run'
      exit: 0
    - command: 'world advance 60s'
      exit: 0
    - command: 'machines'
      exit: 0
      stdout: |
          ●	macbook-pro	Mac	macbook-pro	Engine running
          ○	api	Workspace	macbook-pro	Stopped · persistent	4 CPU	8 GB
          ●	linux-1	Workspace	macbook-pro	Running · ephemeral	4 CPU	8 GB
          ●	mac-mini	Mac	mac-mini	Engine running
          ◐	infra	Server	mac-mini	Running · always on	8 CPU	24 GB	check failing since 10:01
          # Needs you
          ✗	infra	check failing since 10:01
    - command: 'machines infra | /usr/bin/grep -E "Check|Restarts"'
      exit: 0
      stdout: |
          ◐	Check failing	since 10:01 · https://infra:6443/readyz
          ●	Restarts	↺ 0 · none since boot
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["mac-mini"].vms.infra.pid'' world.json'
      exit: 0
      stdout: |
          2001
