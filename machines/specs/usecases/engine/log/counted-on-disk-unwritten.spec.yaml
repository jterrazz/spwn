description: 'engine.log says so when the disk counts a log file station has written no line in'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["macbook-pro"].disk.files["~/.local/state/station/logs/engine.log"] = 120000000'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"engine.log","in":{}}
      exit: 0
      stdout: |
          {"Lines":[],"Empty":"The engine has written no line here yet."}
