description: 'a pre-release made the latest is out for a Mac on the release before it'
env:
    - two-macs
    - engine
runs:
    - command: 'world upgrade macbook-pro v0.20.0'
      exit: 0
    - command: 'world release v0.21.0-alpha.1'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio > /dev/null'
      stdin: |
          {"v":2,"id":"1","call":"engine.refresh-release","in":{}}
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out | {Installed, Latest, Behind, Head, Notes, Checked: (.Checked != null), Refused: .Refused.Message} else .error | {code, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"engine.read-release","in":{}}
      exit: 0
      stdout: |
          {"Installed":"v0.20.0","Latest":"v0.21.0-alpha.1","Behind":true,"Head":{"Tone":"new","Sentence":"spwn v0.21.0-alpha.1 is out.","Line":"This Mac runs v0.20.0."},"Notes":"https://github.com/jterrazz/spwn/releases/tag/v0.21.0-alpha.1","Checked":true,"Refused":null}
