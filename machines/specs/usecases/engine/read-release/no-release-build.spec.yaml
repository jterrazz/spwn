description: 'a build of no release is never behind, whatever the latest release is'
env:
    - two-macs
    - engine
runs:
    - command: 'world upgrade macbook-pro dev'
      exit: 0
    - command: 'world release v0.22.0'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio > /dev/null'
      stdin: |
          {"v":2,"id":"1","call":"engine.refresh-release","in":{}}
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out | {Installed, Latest, Behind, Head, Notes, Checked: (.Checked != null), Refused: .Refused.Message} else .error | {code, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"engine.read-release","in":{}}
      exit: 0
      stdout: |
          {"Installed":"dev","Latest":"v0.22.0","Behind":false,"Head":{"Tone":"plain","Sentence":"This Mac runs a build of no release."},"Notes":"https://github.com/jterrazz/spwn/releases/tag/v0.22.0","Checked":true,"Refused":null}
