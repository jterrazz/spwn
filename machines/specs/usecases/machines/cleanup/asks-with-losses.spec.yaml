description: 'a cleanup on a terminal names each stopped ephemeral workspace and its losses, then asks'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: 'machines stop linux-1 --yes'
      exit: 0
      stdout: |
          ●	linux-1	stopped, kept
    - command: '--version >/dev/null; terminal --size 140x30 "$STATION" machines cleanup'
      stdin: |
          see Delete linux-1?
          send y
          scrollback
      exit: 0
      stdout: |
          ┃ Delete linux-1?
          ┃ linux-1 · stopped · goes with its disk (50 GB), 2 shared ports and 1 grant
          ┃
          ●       linux-1 deleted · with its disk, its ports and its grants
    - command: 'machines | /usr/bin/grep -c linux-1'
      exit: 1
      stdout: |
          0
