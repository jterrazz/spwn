description: 'a created VM whose guest does not connect in 60 s fails SSH answers, and is kept'
env: two-macs
runs:
    - command: 'world fault Guest.Dial'
      exit: 0
    - command: 'machines create --memory 4G'
      exit: 1
      stderr: |
          Error: linux-2 is kept, failing SSH answers: none after 60 s
          Hint: station machines start linux-2, or station machines delete linux-2
