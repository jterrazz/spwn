description: 'a first start names a grant this Mac does not confirm by its code and subject in its json'
fixture: ../../__fixtures__/build/
env: two-macs
runs:
    - command: 'world edit macbook-pro machinefiles/studio-linux.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: studio-linux
          machine: { kind: workspace, system: { os: ubuntu, version: '24.04' } }
          extends: [base-ubuntu]
          vm: { resources: { memory: 4G } }
          accounts: { grants: [npm] }
      exit: 0
    - command: 'images build studio-linux --binary $HOME/station-linux >/dev/null'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["web"] = .macs["linux-1"] | .macs["macbook-pro"].accounts.presence = "refused"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'machines create --memory 4G web --from studio-linux --json | /usr/bin/jq -c .boot.grants'
      exit: 0
      stdout: |
          [{"program":"npm","code":"grant.presence-refused","subject":"pw-2"}]
    - command: '--version >/dev/null; /usr/bin/jq -c ''[.macs["macbook-pro"].accounts.passwords[] | [.ID, [.Grants[]? | .To]]]'' world.json'
      exit: 0
      stdout: |
          [["pw-1",[]],["pw-2",["linux-1"]],["pw-3",[]]]
