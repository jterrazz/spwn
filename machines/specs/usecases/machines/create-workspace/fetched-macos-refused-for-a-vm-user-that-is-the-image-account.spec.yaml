description: 'a fetched macOS workspace is refused for a VM user that is the image account, and stopped'
fixture: ../../__fixtures__/build/
env: one-mac
runs:
    - command: 'world upstream-login admin admin'
      exit: 0
    - command: 'images update base-macos'
      exit: 0
      stdout: |
          ●	base-macos	26.6.2	fetched
    - command: 'machines create mac-1 --image base-macos'
      exit: 1
      stderr: |
          Error: mac-1 is kept, failing SSH answers: the VM user 'admin' cannot be a fetched macOS guest's, whose lockdown retires admin and root: set another vm_user in preferences.json, then start mac-1
          Hint: station machines start mac-1, or station machines delete mac-1
    - command: 'machines --this-mac'
      exit: 0
      stdout: |
          ●	macbook-pro	Mac	macbook-pro	Engine running
          ○	mac-1	Workspace	macbook-pro	Stopped · ephemeral	4 CPU	8 GB	Failed at SSH 4 of 4
          # Needs you
          ✗	mac-1	was not created: it failed at SSH	station machines start mac-1
    - command: 'machines start mac-1'
      exit: 1
      stderr: |
          Error: mac-1 is kept, failing SSH answers: the VM user 'admin' cannot be a fetched macOS guest's, whose lockdown retires admin and root: set another vm_user in preferences.json, then start mac-1
          Hint: station machines start mac-1, or station machines delete mac-1
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs[.this_mac].vms["mac-1"] | {login: .guest.login, closed: .guest.closed, unlocked: .guest.unlocked, ran: [.guest.ran[]? | select(startswith("/usr/local/bin/station guest") | not) | sub("/tmp/station[.][A-Za-z0-9X]+"; "<folder>")]}'' world.json'
      exit: 0
      stdout: |
          {"login":{"user":"admin","password":"admin"},"closed":null,"unlocked":null,"ran":[]}
