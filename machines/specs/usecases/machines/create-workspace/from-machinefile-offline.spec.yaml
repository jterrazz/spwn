description: 'a create with no network keeps the workspace and what its image baked, each other app unfinished'
fixture: ../../__fixtures__/build/
env: two-macs
runs:
    - command: 'world edit macbook-pro machinefiles/studio-linux.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: studio-linux
          machine: { kind: workspace, system: { os: ubuntu, version: '24.04' } }
          extends: [base-ubuntu]
          vm: { resources: { memory: 4G } }
          apps: [jq, ripgrep]
      exit: 0
    - command: 'images build studio-linux --binary $HOME/station-linux >/dev/null'
      exit: 0
    - command: 'world fault Installer.Install'
      exit: 0
    - command: 'machines create --memory 4G web --from studio-linux'
      exit: 0
      stdout: |
          ●	Running
          ●	Has an address	192.168.64.5
          ●	SSH answers
          ●	Boot phase	studio-linux	2 settings set
          ◐	ohmyzsh	not installed: the install failed: its output is in ~/.local/state/station/logs/ohmyzsh.log
          ◐	jq	not installed: the install failed: its output is in ~/.local/state/station/logs/jq.log
          ◐	ripgrep	not installed: the install failed: its output is in ~/.local/state/station/logs/ripgrep.log
          ◐	3 apps to finish	station machinefile apply --on web
          ●	web	Created	Ephemeral · 4 CPU · 4 GB · 20 GB
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["web"].apps.apt.installed // {} | [has("git"), has("jq"), has("ripgrep")]'' world.json'
      exit: 0
      stdout: |
          [true,false,false]
