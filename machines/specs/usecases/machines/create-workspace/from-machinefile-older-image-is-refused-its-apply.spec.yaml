description: 'a workspace from an image older than its apply is made, the apply refused, the rebuild named'
fixture: ../../__fixtures__/build/
env: two-macs
runs:
    - command: 'world edit macbook-pro machinefiles/studio-linux.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: studio-linux
          machine: { kind: workspace, system: { os: ubuntu, version: '24.04' } }
          extends: [base-ubuntu]
          vm: { resources: { memory: 4G } }
          apps: [jq]
          settings: { github-login: {} }
      exit: 0
    - command: 'images build studio-linux --binary $HOME/station-linux >/dev/null'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["web"].lacks = ["machinefile.apply.leave-asking", "machinefile.apply.within"]'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'machines create --memory 4G web --from studio-linux'
      exit: 0
      stdout: |
          ●	Running
          ●	Has an address	192.168.64.5
          ●	SSH answers
          ●	Boot phase	studio-linux
          ◐	studio-linux	not applied: the machine's image is older than this station: rebuild it (station images build studio-linux)
          ◐	Apps to finish	station machinefile apply --on web
          ●	web	Created	Ephemeral · 4 CPU · 4 GB · 20 GB
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["web"].apps.apt.installed // {} | has("jq")'' world.json'
      exit: 0
      stdout: |
          false
