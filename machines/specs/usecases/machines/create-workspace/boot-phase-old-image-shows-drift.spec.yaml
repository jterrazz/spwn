description: 'a workspace from an image its Machinefile moved on from shows that drift at its first start'
fixture: ../../__fixtures__/build/
env: two-macs
runs:
    - command: 'world edit macbook-pro machinefiles/studio-linux.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: studio-linux
          machine: { kind: workspace, system: { os: ubuntu, version: '24.04' } }
          extends: [base-ubuntu]
          vm: { resources: { memory: 4G }, image: { bake: [mise, git] } }
      exit: 0
    - command: 'images build studio-linux --binary $HOME/station-linux >/dev/null'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq ''(.macs["macbook-pro"].stores.images[] | select(.name == "studio-linux") | .lock) = "lock: station.lock/v1\nmachinefile: studio-linux\napps:\n  - { name: mise, method: script, version: 2026.11.1 }\n  - { name: git, method: apt }\n" | .macs["web"] = .macs["linux-1"]'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'world edit macbook-pro machinefiles/studio-linux.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: studio-linux
          machine: { kind: workspace, system: { os: ubuntu, version: '24.04' } }
          extends: [base-ubuntu]
          vm: { resources: { memory: 4G }, image: { bake: [mise, git, jq] } }
      exit: 0
    - command: 'machines create --memory 4G web --from studio-linux'
      exit: 0
      stdout: |
          ●	Running
          ●	Has an address	192.168.64.5
          ●	SSH answers
          ●	Boot phase	studio-linux	8 apps installed · 2 settings set
          ◐	Drift	its image is behind its Machinefile	jq is not baked into the image · linux-kernel is not baked into the image
          ●	web	Created	Ephemeral · 4 CPU · 4 GB · 20 GB
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["web"].apps.apt.installed // {} | keys | map(select(startswith("linux-")))'' world.json'
      exit: 0
      stdout: |
          []
    - command: 'machines delete web --confirm=web'
      exit: 0
      stdout: |
          ●	web	deleted
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["web"] = .macs["linux-1"]'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'machines create --memory 4G web --from studio-linux --json | /usr/bin/jq -c ''{template, applied: [.boot.applied[].name], unfinished: .boot.unfinished, drift: .boot.drift}'''
      exit: 0
      stdout: |
          {"template":"studio-linux","applied":["mise","ohmyzsh","docker","apt","git","build-essential","playwright-deps","jq"],"unfinished":[],"drift":["jq is not baked into the image","linux-kernel is not baked into the image"]}
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["web"].apps.apt.installed // {} | [has("jq"), (keys | map(select(startswith("linux-"))))]'' world.json'
      exit: 0
      stdout: |
          [true,[]]
