description: 'a first start with two passwords for a program grants neither'
fixture: ../../__fixtures__/build/
env: two-macs
runs:
    - command: 'world edit macbook-pro machinefiles/studio-linux.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: studio-linux
          machine: { kind: workspace, system: { os: ubuntu, version: '24.04' } }
          extends: [base-ubuntu]
          vm: { resources: { memory: 4G } }
          accounts: { grants: [npm] }
      exit: 0
    - command: 'images build studio-linux --binary $HOME/station-linux >/dev/null'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["web"] = .macs["linux-1"] | .macs["macbook-pro"].accounts.passwords += [{ID: "pw-4", Label: "npm second", Program: "npm", Kind: "token", Added: "2026-10-13T09:00:00Z", Grants: []}]'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'machines create --memory 4G web --from studio-linux | /usr/bin/grep -E "Boot|npm|Created"'
      exit: 0
      stdout: |
          ●	Boot phase	studio-linux	7 apps installed · 2 settings set
          ◐	npm	not granted: more than one password for npm in this Mac's vault: grant one from the window
          ●	web	Created	Ephemeral · 4 CPU · 4 GB · 20 GB
    - command: '--version >/dev/null; /usr/bin/jq -c ''[.macs["macbook-pro"].accounts.passwords[] | [.ID, [.Grants[]? | .To]]]'' world.json'
      exit: 0
      stdout: |
          [["pw-1",[]],["pw-2",["linux-1"]],["pw-3",[]],["pw-4",[]]]
