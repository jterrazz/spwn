description: 'a Mac account that is no VM user, with no vm_user set, is refused before any VM is made'
fixture: ../../__fixtures__/build/
env: dotted-account
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.user = "Jterrazz.Ops"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'world upstream-login admin admin'
      exit: 0
    - command: 'images update base-macos'
      exit: 0
      stdout: |
          ●	base-macos	26.6.2	fetched
    - command: 'machines create mac-1 --image base-macos'
      exit: 1
      stderr: |
          Error: this Mac's account "Jterrazz.Ops" is not a VM user, and preferences.json sets no vm_user: a VM user is a lowercase short name (a-z first, then up to 31 of a-z, 0-9, _, . and -, never a dot last), never admin or root
          Hint: set vm_user in ~/.config/station/preferences.json
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs[.this_mac].vms["mac-1"]'' world.json'
      exit: 0
      stdout: |
          null
