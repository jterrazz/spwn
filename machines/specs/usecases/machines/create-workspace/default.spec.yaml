description: 'a bare create makes linux-1 as its Machinefile says: health, ports, then Created, ephemeral, 8 GB'
env: two-macs
runs:
    - command: 'machines delete linux-1 --confirm=linux-1 >/dev/null'
      exit: 0
    - command: 'machines create'
      exit: 0
      stdout: |
          ●	Running
          ●	Has an address	192.168.64.5
          ●	SSH answers
          ●	vite	5173	{{url}}
          ●	expo	8081	{{url}}
          ●	linux-1	Created	Ephemeral · 4 CPU · 8 GB · 20 GB
    - command: 'machines --this-mac'
      exit: 0
      stdout: |
          ●	macbook-pro	Mac	macbook-pro	Engine running
          ○	api	Workspace	macbook-pro	Stopped · persistent	4 CPU	8 GB
          ●	linux-1	Workspace	macbook-pro	Running · ephemeral	4 CPU	8 GB
