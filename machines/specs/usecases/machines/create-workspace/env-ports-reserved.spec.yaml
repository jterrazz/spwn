description: 'a create reserves the env port of the package its Machinefile installs, Vite''s alone'
env: two-macs
runs:
    - command: 'world edit macbook-pro machinefiles/linux-2.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: linux-2
          machine: { kind: workspace, system: { os: ubuntu, version: '24.04' } }
          apps: [vite]
      exit: 0
    - command: 'machines create --memory 4G | /usr/bin/grep -E "vite|expo"'
      exit: 0
      stdout: |
          ●	vite	5173	{{url}}
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["macbook-pro"] | {reserved: [.stores.reservations[] | select(.vm == "linux-2") | [.guest_port, .host_port]], env: .vms["linux-2"].kept.env}'' world.json'
      exit: 0
      stdout: |
          {"reserved":[[5173,40000]],"env":{"STATION_PUBLIC_HOST":"macbook-pro.tail1234.ts.net","__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS":"macbook-pro.tail1234.ts.net"}}
