description: 'on a terminal, create without tart offers it; yes installs tart, starts the engine, makes the VM'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - no-engine
    - terminal
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["macbook-pro"].hypervisor = "none"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; terminal --size 120x30 "$STATION" machines create --memory 4G'
      stdin: |
          see Install tart now?
          send y
          scrollback
      exit: 0
      stdout: |
          ○ tart is required by machines · station apps install tart
          ┃ Install tart now?
          ┃
          ●       tart    1.0.0   shell
          ●       tart-launcher                   ~/.local/bin/tart
          ✓ cloning station-image-base-ubuntu-2026.11.01 · <1s
          ✓ Running · <1s
          ✓ Has an address · <1s
          ✓ SSH answers · <1s
          ●       Running
          ●       Has an address  192.168.64.5
          ●       SSH answers
          ●       linux-1 Created Ephemeral · 4 CPU · 4 GB · 20 GB
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["macbook-pro"] | [(.jobs // {} | keys), (.vms | keys)]'' world.json'
      exit: 0
      stdout: |
          [["com.jterrazz.station.engine"],["linux-1","station-image-base-ubuntu-2026.11.01"]]
