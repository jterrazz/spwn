description: 'a create that builds its image asks nothing, says the build first, and starts the engine with it'
env: no-engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''del(.macs["macbook-pro"].stores.images, .macs["macbook-pro"].vms)'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'machines create </dev/null'
      exit: 2
      stderr: |
          base-ubuntu is built first, which takes several minutes
          Error: this station is not a released version: there is no release binary to put in the image
          Hint: download station-linux-arm64 from https://github.com/jterrazz/spwn/releases, then station images build base-ubuntu --binary <that file>
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["macbook-pro"].jobs // {} | keys'' world.json'
      exit: 0
      stdout: |
          ["com.jterrazz.station.engine"]
