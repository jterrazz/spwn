description: 'a create says in its json why its guest did not write the spwn skill'
fixture: ../../__fixtures__/build/
env: two-macs
runs:
    - command: 'world edit macbook-pro machinefiles/studio-linux.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: studio-linux
          machine: { kind: workspace, system: { os: ubuntu, version: '24.04' } }
          extends: [base-ubuntu]
          vm: { resources: { memory: 4G } }
          apps: [jq]
      exit: 0
    - command: 'images build studio-linux --binary $HOME/station-linux >/dev/null'
      exit: 0
    - command: 'world fault Skill.Write'
      exit: 0
    - command: 'machines create --memory 4G web --from studio-linux --json | /usr/bin/jq -c ''[.boot.skill_failed, (.boot.unfinished | length)]'''
      exit: 0
      stdout: |
          ["open ~/.agents/skills/spwn/SKILL.md: permission denied",0]
