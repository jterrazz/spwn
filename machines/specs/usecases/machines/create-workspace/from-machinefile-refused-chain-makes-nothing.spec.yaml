description: 'create --from a refused chain makes no VM and grants nothing, its image built'
fixture: ../../__fixtures__/build/
env: two-macs
runs:
    - command: 'world edit macbook-pro machinefiles/ai-kit.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: ai-kit
          accounts: { signins: [claude], grants: [npm] }
      exit: 0
    - command: 'world edit macbook-pro machinefiles/studio-linux.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: studio-linux
          machine: { kind: workspace, system: { os: ubuntu, version: '24.04' } }
          extends: [base-ubuntu, ai-kit]
          vm: { resources: { memory: 4G } }
      exit: 0
    - command: 'images build studio-linux --binary $HOME/station-linux >/dev/null'
      exit: 0
    - command: 'world edit macbook-pro machinefiles/cloud-kit.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: cloud-kit
          accounts: { grants: [claude] }
      exit: 0
    - command: 'world edit macbook-pro machinefiles/studio-linux.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: studio-linux
          machine: { kind: workspace, system: { os: ubuntu, version: '24.04' } }
          extends: [base-ubuntu, ai-kit, cloud-kit]
          vm: { resources: { memory: 4G } }
      exit: 0
    - command: 'machines create --memory 4G web --from studio-linux'
      exit: 2
      stderr: |
          Error: account claude is given two ways, by ai-kit (~/.config/station/machinefiles/ai-kit.machine.yaml) and cloud-kit (~/.config/station/machinefiles/cloud-kit.machine.yaml), neither extending the other
          Hint: say claude in studio-linux, which extends both
    - command: 'machines --json | /usr/bin/jq -c ''[.macs[].vms[].name]'''
      exit: 0
      stdout: |
          ["api","linux-1","infra"]
    - command: '--version >/dev/null; /usr/bin/jq -c ''[.macs["macbook-pro"].accounts.passwords[]? | [.ID, [.Grants[]? | .To]]]'' world.json'
      exit: 0
      stdout: |
          [["pw-1",[]],["pw-2",["linux-1"]],["pw-3",[]]]
