description: 'a fetched macOS workspace whose lockdown is cut before its key runs it again at its next login'
fixture: ../../__fixtures__/build/
env: one-mac
runs:
    - command: 'world upstream-login admin admin'
      exit: 0
    - command: 'world lockdown-cut before-key'
      exit: 0
    - command: 'images update base-macos'
      exit: 0
      stdout: |
          ●	base-macos	26.6.2	fetched
    - command: 'machines create mac-1 --image base-macos | /usr/bin/tail -1'
      exit: 0
      stdout: |
          ●	mac-1	Created	Ephemeral · 4 CPU · 8 GB · 80 GB
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs[.this_mac].vms["mac-1"].guest | {login, unlocked, ran: [.ran[]? | select(startswith("/usr/local/bin/station guest") | not) | sub("/tmp/station[.][A-Za-z0-9X]+"; "<folder>")]}'' world.json'
      exit: 0
      stdout: |
          {"login":null,"unlocked":null,"ran":["/usr/bin/mktemp -d <folder>","sudo -n /bin/bash <folder>/lockdown.sh","/usr/bin/mktemp -d <folder>","sudo -n /bin/bash <folder>/lockdown.sh","/bin/test -f /var/db/station/locked","/bin/test -f /var/db/station/locked"]}
