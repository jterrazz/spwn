description: 'a delete drops the stops of sharing the owner chose for the VM'
env: two-macs
runs:
    - command: 'ports stop-sharing linux-1 7000 --yes'
      exit: 0
      stdout: |
          ●	linux-1:7000	not shared
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["macbook-pro"].preferences.ports.not_shared'' world.json'
      exit: 0
      stdout: |
          ["linux-1:7000"]
    - command: 'machines delete linux-1 --confirm=linux-1'
      exit: 0
      stdout: |
          ●	linux-1	deleted
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["macbook-pro"].preferences.ports.not_shared'' world.json'
      exit: 0
      stdout: |
          null
