description: 'a delete a session asks is kept as done by that session; a name that is no session is refused'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; STATION_SESSION=Lot_Shell "$STATION" machines delete linux-1 --confirm=linux-1'
      exit: 2
      stderr: |
          Error: machines.delete cannot read its input
          Hint: check the request against by
    - command: '--version >/dev/null; STATION_SESSION=review-bot "$STATION" machines delete linux-1 --confirm=linux-1'
      exit: 0
      stdout: |
          ●	linux-1	deleted
    - command: 'guest serve --stdio | /usr/bin/jq -c ''.out.Lines // [] | .[] | {Machine, Call, Text, By, Outcome}'''
      stdin: |
          {"v":2,"id":"1","call":"journal.kept","in":{}}
      exit: 0
      stdout: |
          {"Machine":"linux-1","Call":"machines.delete","Text":"linux-1 deleted","By":"review-bot","Outcome":"done"}
