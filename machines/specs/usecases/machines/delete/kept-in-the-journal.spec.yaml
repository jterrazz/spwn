description: 'a deleted workspace is kept in its Mac''s journal, done by you'
env:
    - two-macs
    - engine
runs:
    - command: 'machines delete linux-1 --confirm=linux-1'
      exit: 0
      stdout: |
          ●	linux-1	deleted
    - command: 'guest serve --stdio | /usr/bin/jq -c ''.out.Lines // [] | .[] | {Machine, Call, Text, By, Outcome}'''
      stdin: |
          {"v":2,"id":"1","call":"journal.kept","in":{}}
      exit: 0
      stdout: |
          {"Machine":"linux-1","Call":"machines.delete","Text":"linux-1 deleted","By":"you","Outcome":"done"}
