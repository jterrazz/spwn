description: 'on a terminal, a workspace stops with no question, and the outcome says how to start it again'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 100x20 /usr/bin/env -u NO_COLOR COLUMNS=100 "$STATION" machines stop linux-1'
      stdin: |
          within 20 exit 0
          screen
      exit: 0
      stdout: |
          ✓ linux-1 · stopped, kept

          → station machines start linux-1
    - command: 'machines | /usr/bin/grep linux-1'
      exit: 0
      stdout: |
          ○	linux-1	Workspace	macbook-pro	Stopped · ephemeral	4 CPU	8 GB
