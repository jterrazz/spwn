description: 'a stop keeps an ephemeral workspace with its disk, and --yes, needed no more, is still taken (SP-5)'
env: two-macs
runs:
    - command: 'machines stop linux-1 --yes'
      exit: 0
      stdout: |
          ●	linux-1	stopped, kept
    - command: 'machines --this-mac'
      exit: 0
      stdout: |
          ●	macbook-pro	Mac	macbook-pro	Engine running
          ○	api	Workspace	macbook-pro	Stopped · persistent	4 CPU	8 GB
          ○	linux-1	Workspace	macbook-pro	Stopped · ephemeral	4 CPU	8 GB
