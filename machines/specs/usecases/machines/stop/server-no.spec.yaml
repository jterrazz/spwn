description: 'on a terminal, a server stop asks yes or no; no changes nothing, exits 1, with no error'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 100x20 /usr/bin/env -u NO_COLOR COLUMNS=100 "$STATION" machines stop infra --on mac-mini'
      stdin: |
          within 10 see Stop infra?
          send n
          within 20 exit 1
          screen
      exit: 1
      stdout: |
          ┃ Stop infra? What it serves stops until you start it again.
          ┃
          Nothing changed.
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["mac-mini"].vms.infra | {running: (.pid > 0), want: .kept.want}'' world.json'
      exit: 0
      stdout: |
          {"running":true,"want":"running"}
