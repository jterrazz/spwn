description: 'a create held at its boot keeps its cloning line, and ends with each step kept once let go'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal /usr/bin/env -u NO_COLOR "$STATION" machines create --memory 4G linux-2 | /usr/bin/sed -E "s/ · (<1s|[0-9]+s)$/ · took/"'
      stdin: |
          see On which Mac?
          send \x1b[B
          send \r
          see Running
          see ✓ cloning
          run "$STATION" machines | /usr/bin/grep linux-2 >seen
          run "$STATION" world unhold mac-mini linux-2
          see Created
          scrollback
      exit: 0
      stdout: |
          ┃ On which Mac?
          ┃ macbook-pro  2 VMs
          ✓ cloning station-image-base-ubuntu-2026.11.01 · took
          ✓ Running · took
          ✓ Has an address · took
          ✓ SSH answers · took
          Changes
            ● Running
            ● Has an address  192.168.64.5
            ● SSH answers
            ● linux-2         Created       Ephemeral · 4 CPU · 4 GB · 20 GB

          → ssh linux-2
    - command: '--version >/dev/null; /bin/cat seen'
      exit: 0
      stdout: |
          	linux-2	Workspace	mac-mini	Creating · ephemeral	4 CPU	4 GB	boot 2 of 4
    - command: 'machines --json | /usr/bin/jq -c ''[.macs[].vms[] | select(.name == "linux-2") | {state, birth}]'''
      exit: 0
      stdout: |
          [{"state":"running","birth":null}]
    - command: '--version >/dev/null; /usr/bin/jq -c ''.script'' world.json'
      exit: 0
      stdout: |
          null
