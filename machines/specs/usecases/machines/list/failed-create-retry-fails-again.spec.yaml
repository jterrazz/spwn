description: 'a start that fails again answers the new failure, which the VM keeps until a start answers'
env:
    - two-macs
    - engine
runs:
    - command: 'world fault Hypervisor.Boot 2'
      exit: 0
    - command: 'machines create --memory 4G'
      exit: 1
      stderr: |
          Error: linux-2 did not boot: the hypervisor refused to boot it, as the world scripted it
          Hint: station machines start linux-2, or station machines delete linux-2
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.error) | .error | {code, message}'''
      stdin: |
          {"v":2,"id":"1","call":"machines.start","in":{"VM":"linux-2"}}
      exit: 0
      stdout: |
          {"code":null,"message":"linux-2 did not boot: the hypervisor refused to boot it, as the world scripted it"}
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | [.out.All.Macs[].VMs[]? | select(.Name == "linux-2") | [.Standing, .Gestures, .Birth.failed, .Birth.step, .Birth.cause]][0]'' | /usr/bin/tail -1'
      stdin: |
          {"v":2,"id":"1","watch":"machines.list","in":{}}
      exit: 0
      stdout: |
          ["not-created",["try-again"],true,"booting","linux-2 did not boot: the hypervisor refused to boot it, as the world scripted it"]
    - command: 'machines start linux-2'
      exit: 0
      stdout: |
          ●	linux-2	started
