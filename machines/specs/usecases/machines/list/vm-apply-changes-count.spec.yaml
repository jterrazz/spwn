description: 'an apply on a VM makes its Mac read its drift again, and its head says the new count'
env:
    - stories
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["linux-1"].passwordless = true'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | [.out.All.Macs[].VMs[]? | select(.Name == "linux-1") | [.Head, .Pending]][0]'' | /usr/bin/tail -1'
      stdin: |
          {"v":2,"id":"1","watch":"machines.list","in":{"ThisMac":true}}
      exit: 0
      stdout: |
          [{"Tone":"warn","Sentence":"Running, with 8 differences from its file.","Line":"Lot L2.5, settings from a machine file. Up 2 h."},null]
    - command: 'machinefile apply --on linux-1 --yes >/dev/null'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | [.out.All.Macs[].VMs[]? | select(.Name == "linux-1") | [.Head, .Pending]][0]'' | /usr/bin/tail -1'
      stdin: |
          {"v":2,"id":"1","watch":"machines.list","in":{"ThisMac":true}}
      exit: 0
      stdout: |
          [{"Tone":"warn","Sentence":"Running, with 6 differences from its file.","Line":"Lot L2.5, settings from a machine file. Up 2 h."},null]
