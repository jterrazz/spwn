description: 'a server held in a loop, one restarting and a suspended workspace say their standing and gestures'
env:
    - standings
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | [.out.All.Macs[] | [.Name, [.VMs[]? | [.Name, .State, .Standing, .Head.Tone, .Head.Sentence, .Gestures]]]]'' | /usr/bin/tail -1'
      stdin: |
          {"v":2,"id":"1","watch":"machines.list","in":{}}
      exit: 0
      stdout: |
          [["macbook-pro",[["loop-1","broken","down","bad","loop-1 is down.",["stop","restart"]],["restart-1","running","restarting","new","Restarting.",["stop","restart"]],["suspended-1","suspended","suspended","plain","Suspended.",["start"]]]],["mac-mini",[]]]
