description: 'a start of a VM whose create failed finishes its create and takes the failure off'
env:
    - two-macs
    - engine
runs:
    - command: 'world fault Hypervisor.Boot 1'
      exit: 0
    - command: 'machines create --memory 4G'
      exit: 1
      stderr: |
          Error: linux-2 did not boot: the hypervisor refused to boot it, as the world scripted it
          Hint: station machines start linux-2, or station machines delete linux-2
    - command: 'machines start linux-2'
      exit: 0
      stdout: |
          ●	linux-2	started
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | [.out.All.Macs[].VMs[]? | select(.Name == "linux-2") | [.State, .Standing, .Head.Sentence, .Head.Line, .Gestures, .Birth.failed, .Birth.step, .Birth.sentence]][0]'' | /usr/bin/tail -1'
      stdin: |
          {"v":2,"id":"1","watch":"machines.list","in":{}}
      exit: 0
      stdout: |
          ["running","running","Running.","Up 1 min.",["stop"],null,null,null]
