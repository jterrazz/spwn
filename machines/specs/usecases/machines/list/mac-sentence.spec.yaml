description: 'machines.list tells each Mac in one sentence: its engine, and how it sleeps'
env:
    - stories
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out.All.Macs | map([.Name, .Sentence])'' | /usr/bin/tail -1'
      stdin: |
          {"v":2,"id":"1","watch":"machines.list","in":{}}
      exit: 0
      stdout: |
          [["macbook-pro","Engine running. Awake until 18:00, lid closed."],["mac-mini","Engine running. Never sleeps."],["macbook-air","Asleep, not seen for 2 h."]]
