description: 'a Mac that does not answer is told by since when it is not seen, never down'
env:
    - mini-offline
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out.All.Macs | map([.Name, .Sentence])'' | /usr/bin/tail -1'
      stdin: |
          {"v":2,"id":"1","watch":"machines.list","in":{}}
      exit: 0
      stdout: |
          [["macbook-pro","Engine running. Sleeps normally."],["mac-mini","Not seen for 6 h. Asleep or off the network."]]
