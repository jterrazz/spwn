description: 'a running VM heads its row with how many differences from its file its Mac keeps'
env:
    - stories
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | [.out.All.Macs[].VMs[]? | select(.Name == "linux-1") | [.Head, .Pending]][0]'' | /usr/bin/tail -1'
      stdin: |
          {"v":2,"id":"1","watch":"machines.list","in":{"ThisMac":true}}
      exit: 0
      stdout: |
          [{"Tone":"warn","Sentence":"Running, with 8 differences from its file.","Line":"Lot L2.5, settings from a machine file. Up 2 h."},null]
