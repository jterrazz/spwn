description: 'on a terminal, an up server''s restart asks yes or no naming what stops, then restarts it'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 100x20 /usr/bin/env -u NO_COLOR COLUMNS=100 "$STATION" machines restart infra --on mac-mini'
      stdin: |
          within 10 see Restart infra?
          send y
          within 30 exit 0
          screen
      exit: 0
      stdout: |
          ┃ Restart infra? What it serves stops while it restarts.
          ┃
          On mac-mini:
          Changes
            ● Running
            ● Has an address
            ● SSH answers
            ● infra           restarted
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["mac-mini"].vms.infra | {pid, want: .kept.want}'' world.json'
      exit: 0
      stdout: |
          {"pid":1002,"want":"running"}
