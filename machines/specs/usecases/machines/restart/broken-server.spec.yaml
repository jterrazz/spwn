description: 'a server a reboot loop broke is offered its restart, never its delete, and the repair asks nothing'
env:
    - two-macs
    - engine
runs:
    - command: 'world reboot-inside infra'
      exit: 0
    - command: 'world reboot-inside infra'
      exit: 0
    - command: 'world reboot-inside infra'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | [.out.All.Macs[].VMs[]? | select(.Name == "infra") | [.State, .Standing, .Gestures]][0]'' | /usr/bin/tail -1'
      stdin: |
          {"v":2,"id":"1","watch":"machines.list","in":{}}
      exit: 0
      stdout: |
          ["broken","down",["stop","restart"]]
    - command: 'overview --on mac-mini | /usr/bin/grep infra'
      exit: 0
      stdout: |
          ✗	infra is broken: rebooting in a loop	station machines restart infra --on mac-mini
          	VMs	○ infra stopped
    - command: 'machines restart infra --on mac-mini'
      exit: 0
      stdout: |
          	On mac-mini:
          ●	Running
          ●	Has an address	192.168.64.5
          ●	SSH answers
          ●	infra	restarted
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | [.out.All.Macs[].VMs[]? | select(.Name == "infra") | [.State, .Standing, .Gestures]][0]'' | /usr/bin/tail -1'
      stdin: |
          {"v":2,"id":"1","watch":"machines.list","in":{}}
      exit: 0
      stdout: |
          ["running","healthy",["stop","restart"]]
