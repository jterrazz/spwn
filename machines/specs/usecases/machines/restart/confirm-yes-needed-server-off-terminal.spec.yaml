description: 'off a terminal, an up server''s restart without --yes is refused before any effect'
env: two-macs
runs:
    - command: 'machines restart infra --on mac-mini'
      exit: 2
      stderr: |
          Error: refusing to restart without --yes
          Hint: re-run with --yes
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["mac-mini"].vms.infra | {pid, want: .kept.want}'' world.json'
      exit: 0
      stdout: |
          {"pid":2001,"want":"running"}
