description: '--yes never answers a server''s typed question: the restart is refused and infra keeps its run'
env: two-macs
runs:
    - command: 'machines restart infra --on mac-mini --yes'
      exit: 2
      stderr: |
          Error: restarting a server needs its name
          Hint: --confirm=infra
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["mac-mini"].vms.infra | {pid, want: .kept.want}'' world.json'
      exit: 0
      stdout: |
          {"pid":2001,"want":"running"}
