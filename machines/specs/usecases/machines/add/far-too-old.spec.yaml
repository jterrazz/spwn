description: 'a Mac that runs an older station is added, with the version it runs and how to update it there'
env: mini-old
runs:
    - command: 'world upgrade mac-mini v0.0.9'
      exit: 0
    - command: 'machines forget mac-mini --yes'
      exit: 0
      stdout: |
          ●	mac-mini	forgotten · nothing changed on it
    - command: 'machines add mac-mini --user jterrazz.agent'
      exit: 0
      stdout: |
          ●	mac-mini	added · ssh answers · station v0.0.9
          ◐	mac-mini	runs v0.0.9 · update station there (curl -fsSL https://spwn.sh/install.sh | bash)
    - command: 'machines | /usr/bin/grep mac-mini'
      exit: 0
      stdout: |
          ◐	mac-mini	Mac	mac-mini	Online · runs v0.0.9
          ◐	mac-mini	runs v0.0.9	update station there (curl -fsSL https://spwn.sh/install.sh | bash)
