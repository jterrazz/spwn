description: 'a refusal past the engine''s first 90 s reads refused, and its fix is the Local Network pane'
env:
    - engine-stopped
    - engine
runs:
    - command: 'world local-network macbook-pro not-approved'
      exit: 0
    - command: 'engine start >/dev/null'
      exit: 0
    - command: 'world advance 90s'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | .out // .error'''
      stdin: |
          {"v":2,"id":"1","call":"approvals.list","in":{}}
      exit: 0
      stdout: |
          {"mac":"macbook-pro","rows":[{"id":"local-network","state":"refused","holder":"station","required":true,"sentence":"Spwn reaches the VMs it runs and your Macs nearby.","fix":{"Call":"","Args":null,"On":"","Confirm":"","Command":"","Path":"approve station on macbook-pro's screen, or in System Settings > Privacy & Security > Local Network","Pane":"x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension"}}]}
