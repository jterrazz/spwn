description: 'station accounts remove on a Mac takes the password out of its vault and ends its grants'
env:
    - two-macs
    - engine
runs:
    - command: 'accounts remove "npm publish" --yes'
      exit: 0
      stdout: |
          ●	npm publish	out of macbook-pro's vault · 1 grant ended
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out | [.Entries[] | .Label]'''
      stdin: |
          {"v":2,"id":"1","watch":"vault.list","in":{}}
      exit: 0
      stdout: |
          ["GitHub deploy","Claude Max"]
