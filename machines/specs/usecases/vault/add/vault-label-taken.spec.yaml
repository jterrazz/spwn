description: 'A label already in the vault is refused and names its field'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, field, subject, message} end'''
      stdin: |
          {"v":2,"id":"1","call":"vault.add","in":{"Label":"GitHub deploy","Program":"gh","Kind":"token","From":"typed","Value":"correct horse"}}
      exit: 0
      stdout: |
          {"code":"vault.label-taken","field":"label","subject":"GitHub deploy","message":"a password is already labeled \"GitHub deploy\""}
