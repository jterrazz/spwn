description: 'the mini offers the sheet of its own vault'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.this_mac = "mac-mini"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out | {intro: .Intro, captures: (.Captures | length)}'''
      stdin: |
          {"v":2,"id":"1","watch":"vault.new","in":{}}
      exit: 0
      stdout: |
          {"intro":"It is kept in mac-mini's Keychain; you can then grant it to a machine.","captures":0}
