description: 'the add sheet names the kinds each program takes typed and the one offered first'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out | .Programs[] | [.Program, .Label, .Kinds, .Kind]'''
      stdin: |
          {"v":2,"id":"1","watch":"vault.new","in":{}}
      exit: 0
      stdout: |
          ["gh","GitHub",["fine-grained","token"],"fine-grained"]
          ["npm","npm",["token","fine-grained"],"token"]
          ["claude","Claude",["oauth-token","api-key"],"oauth-token"]
          ["wrangler","Cloudflare",["token","fine-grained"],"token"]
