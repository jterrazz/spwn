description: 'station agents sleep tidies the Mind and logs the day into its journal layer'
env: two-macs
runs:
    - command: 'agents create neo'
      exit: 0
      stdout: |
          ●	neo	created	~/.spwn/agents/neo
    - command: 'agents sleep neo'
      exit: 0
      stdout: |
          ●	neo	0 playbooks archived, 0 sessions pruned
    - command: 'agents neo'
      exit: 0
      stdout: |
          ●	neo		claude-code	~/.spwn/agents/neo	A blank-slate agent; replace this one-liner with what neo is for.
          # Layers
          ●	journal	sleep-2026-11-04.md
          ●	playbooks	empty
