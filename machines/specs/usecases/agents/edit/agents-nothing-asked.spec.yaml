description: 'station agents edit with neither --team nor --harness is refused, exit 2'
env: two-macs
runs:
    - command: 'agents create neo'
      exit: 0
      stdout: |
          ●	neo	created	~/.spwn/agents/neo
    - command: 'agents edit neo'
      exit: 2
      stderr: |
          Error: nothing to change on neo
          Hint: --team <team> or --harness <harness>
