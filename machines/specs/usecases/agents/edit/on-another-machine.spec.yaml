description: 'station agents edit --on a VM edits the agent kept on that VM'
env: two-macs
runs:
    - command: 'agents create neo --on linux-1'
      exit: 0
      stdout: |
          	On linux-1:
          ●	neo	created	~/.spwn/agents/neo
    - command: 'agents edit neo --team web --on linux-1'
      exit: 0
      stdout: |
          	On linux-1:
          ●	neo	team web, harness claude-code
