description: 'station agents fork --on a VM forks the agent kept on that VM'
env: two-macs
runs:
    - command: 'agents create neo --on linux-1'
      exit: 0
      stdout: |
          	On linux-1:
          ●	neo	created	~/.spwn/agents/neo
    - command: 'agents fork neo --as trinity --on linux-1'
      exit: 0
      stdout: |
          	On linux-1:
          ●	trinity	forked from neo
