description: 'station agents create of a name taken is refused, exit 2'
env: two-macs
runs:
    - command: 'agents create neo'
      exit: 0
      stdout: |
          ●	neo	created	~/.spwn/agents/neo
    - command: 'agents create neo'
      exit: 2
      stderr: |
          Error: an agent named "neo" exists
          Hint: pick another name
