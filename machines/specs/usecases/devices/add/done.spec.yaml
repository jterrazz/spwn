description: 'a device added with the owner present is kept, sealed, with every channel'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, subject, message, hint} end'''
      stdin: |
          {"v":2,"id":"1","call":"devices.add","in":{"Name":"laptop","Key":"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGmY0fN5lE8XqXhcG0OB1oCw0SYqC0f6M1bM1jR5e9wz laptop@home"}}
      exit: 0
      stdout: |
          {"name":"laptop","key":"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGmY0fN5lE8XqXhcG0OB1oCw0SYqC0f6M1bM1jR5e9wz","fingerprint":"SHA256:cT5hNh5Eo/0cBgMbx4JlmcPYDZoZXd37eJaUqyKQd2M","channels":["herdr","pipe","spwn-api"],"added":"{{iso8601}}"}
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out | {mac, devices: [.devices[] | [.name, .fingerprint, .channels]], broken: [.broken[] | .name]}'''
      stdin: |
          {"v":2,"id":"1","call":"devices.list","in":{}}
      exit: 0
      stdout: |
          {"mac":"macbook-pro","devices":[["laptop","SHA256:cT5hNh5Eo/0cBgMbx4JlmcPYDZoZXd37eJaUqyKQd2M",["herdr","pipe","spwn-api"]]],"broken":[]}
