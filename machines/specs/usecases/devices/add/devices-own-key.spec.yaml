description: 'this Mac''s own device key is never an entry: its VMs trust it already'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; key=$(printf ''{"v":2,"id":"1","call":"devices.list","in":{}}\n'' | "$STATION" guest serve --stdio | /usr/bin/jq -r ''select(.out) | .out.key''); printf ''{"v":2,"id":"1","call":"devices.add","in":{"Name":"self","Key":"%s"}}\n'' "$key" | "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, subject, message, hint} end'''
      exit: 0
      stdout: |
          {"code":"devices.own-key","subject":"self","message":"that is this Mac's own device key: its VMs trust it already","hint":"add the key the other device's station devices --json shows"}
