description: 'a request through engine attach is far even when its frame says nothing: no device is added'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" engine attach | /usr/bin/jq -c ''select(.out or .error) | if .out then .out.name else .error | {code, subject} end'''
      stdin: |
          {"v":2,"id":"1","call":"devices.add","in":{"Name":"laptop","Key":"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGmY0fN5lE8XqXhcG0OB1oCw0SYqC0f6M1bM1jR5e9wz"}}
      exit: 0
      stdout: |
          {"code":"devices.add-here-only","subject":"laptop"}
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out | {devices, broken}'''
      stdin: |
          {"v":2,"id":"1","call":"devices.list","in":{}}
      exit: 0
      stdout: |
          {"devices":[],"broken":[]}
