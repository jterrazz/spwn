description: 'a name that is no machine name is refused before anything is asked'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, subject, message, hint} end'''
      stdin: |
          {"v":2,"id":"1","call":"devices.add","in":{"Name":"My Laptop","Key":"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGmY0fN5lE8XqXhcG0OB1oCw0SYqC0f6M1bM1jR5e9wz"}}
      exit: 0
      stdout: |
          {"code":"devices.bad-name","subject":"My Laptop","message":"\"My Laptop\" is no device name: 1 to 40 lowercase letters, digits and -","hint":"name it as the device names itself: run station devices there"}
