description: 'a Mac that cannot ask for presence adds nothing'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["macbook-pro"].presence = "absent"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, subject, message, hint} end'''
      stdin: |
          {"v":2,"id":"1","call":"devices.add","in":{"Name":"laptop","Key":"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGmY0fN5lE8XqXhcG0OB1oCw0SYqC0f6M1bM1jR5e9wz"}}
      exit: 0
      stdout: |
          {"code":"devices.no-presence","subject":"laptop","message":"this Mac cannot ask you to confirm: laptop was not added","hint":"unlock this Mac's screen and add it again"}
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out | {mac, devices: [.devices[] | [.name, .fingerprint, .channels]], broken: [.broken[] | .name]}'''
      stdin: |
          {"v":2,"id":"1","call":"devices.list","in":{}}
      exit: 0
      stdout: |
          {"mac":"macbook-pro","devices":[],"broken":[]}
