description: 'a channel that does not exist is refused, hello among them'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, subject, message, hint} end'''
      stdin: |
          {"v":2,"id":"1","call":"devices.add","in":{"Name":"laptop","Key":"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGmY0fN5lE8XqXhcG0OB1oCw0SYqC0f6M1bM1jR5e9wz","Channels":["pipe","hello"]}}
      exit: 0
      stdout: |
          {"code":"devices.bad-channels","subject":"pipe,hello","message":"\"pipe,hello\" names no channels: each is spwn-api, pipe or herdr, once","hint":"leave --channels out to allow all three"}
