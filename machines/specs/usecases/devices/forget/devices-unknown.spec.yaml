description: 'a name the device book does not hold is refused, nothing asked'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out or .error) | if .out then .out else .error | {code, subject, message, hint} end'''
      stdin: |
          {"v":2,"id":"1","call":"devices.forget","in":{"Name":"laptop","Confirm":"laptop"}}
      exit: 0
      stdout: |
          {"code":"devices.unknown","subject":"laptop","message":"this Mac's device book holds no laptop","hint":"station devices"}
