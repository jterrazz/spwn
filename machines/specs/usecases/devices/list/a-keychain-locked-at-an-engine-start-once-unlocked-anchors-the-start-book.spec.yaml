description: 'a keychain locked at an engine start, once unlocked, anchors the start book with its own head'
env:
    - two-macs
    - engine
runs:
    - command: 'devices add laptop ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGmY0fN5lE8XqXhcG0OB1oCw0SYqC0f6M1bM1jR5e9wz --channels pipe >/dev/null'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["macbook-pro"].stores.devices_anchor_unreadable = true'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'world engine-crash macbook-pro'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out.Summary | [.Needs[] | select(.Subject == "devices") | [.Text, .Upkeep, .Detail]]'' | /usr/bin/tail -1'
      stdin: |
          {"v":2,"id":"1","watch":"overview.read","in":{}}
      exit: 0
      stdout: |
          [["The device book is not checked yet","needs-you",""]]
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["macbook-pro"].stores.devices_anchor_unreadable = false'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out | {stale, devices: [.devices[] | .name], broken: [.broken[] | .name]}'''
      stdin: |
          {"v":2,"id":"1","call":"devices.list","in":{}}
      exit: 0
      stdout: |
          {"stale":false,"devices":["laptop"],"broken":[]}
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.out) | .out.Summary | [.Needs[] | select(.Subject == "devices") | [.Text, .Upkeep, .Detail]]'' | /usr/bin/tail -1'
      stdin: |
          {"v":2,"id":"1","watch":"overview.read","in":{}}
      exit: 0
      stdout: |
          []
