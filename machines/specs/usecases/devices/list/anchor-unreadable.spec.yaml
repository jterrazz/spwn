description: 'a keychain that cannot be read trusts no entry: the read and a forget are refused, nothing written'
env:
    - two-macs
    - engine
runs:
    - command: 'devices add laptop ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGmY0fN5lE8XqXhcG0OB1oCw0SYqC0f6M1bM1jR5e9wz >/dev/null'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["macbook-pro"].stores.devices_anchor_unreadable = true'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'devices'
      exit: 1
      stderr: |
          Error: the device book's head is not readable in the login keychain: security: SecKeychainSearchCopyNext: User interaction is not allowed.
          Hint: run station devices --help
    - command: 'devices forget laptop --confirm=laptop'
      exit: 1
      stderr: |
          Error: the device book's head is not readable in the login keychain: security: SecKeychainSearchCopyNext: User interaction is not allowed.
          Hint: run station devices forget --help
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["macbook-pro"].stores | {devices: [.devices[] | .name], devices_generation}'' world.json'
      exit: 0
      stdout: |
          {"devices":["laptop"],"devices_generation":1}
