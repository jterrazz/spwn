description: 'wiki.read at 30s drops the prose and shows a quiet block no group holds not at all'
env:
    - one-mac
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["macbook-pro"].wiki = {"head":"c1","commits":{"c1":{"wiki.yaml":"wiki: spwn.wiki/v1\nfloors:\n    - id: intention\n      name: Intention\n      question: Why\n    - id: product\n      name: Product\n      question: What\n    - id: domains\n      name: Domains\n      question: Which words\n    - id: architecture\n      name: Architecture\n      question: Where\n    - id: code\n      name: Code\n      question: Which lines\nseats:\n    - id: vision\n      name: Vision\n      path: [blueprint/]\n      reads: [tell, define]\n      home: blueprint/home\nbudget: 2min\n","blueprint/home.md":"# Home\n\nThe one page of the wiki.\n\n<Term id=\"seat\" means=\"who a page is written for\" />\n"}}}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'guest serve --stdio | /usr/bin/jq -c ''.out | [.Budget, [.Sections[].Items[] | select(.Block) | .Block.Shown], ([.Sections[].Items[] | select(.Block | not)] | length)]'''
      stdin: |
          {"v":2,"id":"1","call":"wiki.read","target":{},"in":{"Page":"blueprint/home","Budget":"30s"}}
      exit: 0
      stdout: |
          ["30s",["none"],0]
