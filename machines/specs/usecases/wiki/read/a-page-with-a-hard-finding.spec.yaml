description: 'wiki.read serves a page that holds a hard finding, its verdict counting it'
env:
    - one-mac
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["macbook-pro"].wiki = {"head":"c1","commits":{"c1":{"wiki.yaml":"wiki: spwn.wiki/v1\nfloors:\n    - id: intention\n      name: Intention\n      question: Why\n    - id: product\n      name: Product\n      question: What\n    - id: domains\n      name: Domains\n      question: Which words\n    - id: architecture\n      name: Architecture\n      question: Where\n    - id: code\n      name: Code\n      question: Which lines\nseats:\n    - id: vision\n      name: Vision\n      path: [blueprint/]\n      reads: [tell, define]\n      home: blueprint/home\nbudget: 2min\n","blueprint/home.md":"# Home\n\nThe one page of the wiki.\n\n<Table id=\"all\" of=\"term\" in={ref(\"blueprint/nowhere\")} columns={[\"means\"]} />\n"}}}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'guest serve --stdio | /usr/bin/jq -c ''.out | {page: .Page.ID, verdict: .Verdict}'''
      stdin: |
          {"v":2,"id":"1","call":"wiki.read","target":{},"in":{"Page":"blueprint/home"}}
      exit: 0
      stdout: |
          {"page":"blueprint/home","verdict":{"Hard":1,"Soft":5}}
