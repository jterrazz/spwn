description: 'wiki.read serves a page at its four stops at once, and how long each reads'
env:
    - one-mac
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["macbook-pro"].wiki = {"head":"c1","commits":{"c1":{"wiki.yaml":"wiki: spwn.wiki/v1\nfloors:\n    - id: intention\n      name: Intention\n      question: Why\n    - id: product\n      name: Product\n      question: What\n    - id: domains\n      name: Domains\n      question: Which words\n    - id: architecture\n      name: Architecture\n      question: Where\n    - id: code\n      name: Code\n      question: Which lines\nseats:\n    - id: vision\n      name: Vision\n      path: [blueprint/]\n      reads: [tell, define]\n      home: blueprint/home\nbudget: 2min\n","blueprint/home.md":"# Home\n\nThe one page of the wiki. It holds one term.\n\nA seat is a reader: the one a page is written for. Each page has one.\n\n<Term id=\"seat\" means=\"who a page is written for\" />\n","blueprint/notes.png":"png"}}}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'guest serve --stdio | /usr/bin/jq -c ''.out | {reading: [.Reading[] | [.Words, .Label, .Same]], lede: .Lede.Ranks, items: [.Sections[].Items[] | [(.Block.Address // .Prose.ID), .Ranks, .Max]], first: [.Sections[].Items[] | select(.Prose) | .Prose.First[].Text]}'''
      stdin: |
          {"v":2,"id":"1","call":"wiki.read","target":{},"in":{"Page":"blueprint/home"}}
      exit: 0
      stdout: |
          {"reading":[[13,"≈ 3 s",false],[22,"≈ 6 s",false],[33,"≈ 9 s",false],[36,"≈ 10 s",false]],"lede":["word","line","card","card"],"items":[["p0.0",["word","line","card","card"],"card"],["blueprint/home#seat",["word","line","line","card"],"full"]],"first":["A seat is a reader:"]}
