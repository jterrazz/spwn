description: 'wiki.map with a page open holds its sections and their blocks, by the ids wiki.read serves'
env:
    - one-mac
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["macbook-pro"].wiki = {"head":"c1","commits":{"c1":{"wiki.yaml":"wiki: spwn.wiki/v1\nfloors:\n    - id: intention\n      name: Intention\n      question: Why\n    - id: product\n      name: Product\n      question: What\n    - id: domains\n      name: Domains\n      question: Which words\n    - id: architecture\n      name: Architecture\n      question: Where\n    - id: code\n      name: Code\n      question: Which lines\nseats:\n    - id: vision\n      name: Vision\n      path: [blueprint/]\n      reads: [tell, define]\n      home: blueprint/home\nbudget: 2min\n","blueprint/home.md":"# Home\n\nThe one page of the wiki.\n\n## Words\n\nA seat is a reader: the one a page is written for.\n\n<Term id=\"seat\" means=\"who a page is written for\" />\n"}}}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'guest serve --stdio | /usr/bin/jq -c ''.out | {open: .Open, nodes: [.Nodes[] | select(.Depth > 2) | [.ID, .Kind, .Parent, .Kids, .Ref, .Label, .Kicker, .Line, .Icon, .Count]]}'''
      stdin: |
          {"v":2,"id":"1","call":"wiki.map","target":{},"in":{"Open":"blueprint/home"}}
      exit: 0
      stdout: |
          {"open":"P:blueprint/home","nodes":[["C:blueprint/home:1","section","P:blueprint/home",["B:blueprint/home:p1.0","B:blueprint/home:seat"],"words","Words","Section","seat","define",2],["B:blueprint/home:p1.0","prose","C:blueprint/home:1",[],"p1.0","A seat is…","Paragraph","A seat is a reader:","para",null],["B:blueprint/home:seat","block","C:blueprint/home:1",[],"seat","seat","Term","who a page is written for","term",null]]}
