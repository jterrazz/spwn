description: 'init on another Mac runs there, its steps read back here'
env: two-macs
runs:
    - command: 'init --on mac-mini'
      exit: 0
      stdout: |
          	On mac-mini:
          # To move
          ○	~/go/pkg/mod	to ~/.cache/go/mod	2.3 GB
          	On mac-mini:
          ●	name	mac-mini
          ●	zshrc
          ●	relocate	bunfig, go env, mise settings, npmrc, moved ~/go
          # Machinefile
          	none bound by init: init --machinefile binds one
