description: 'a named Mac refuses another name, and keeps its own'
env: two-macs
runs:
    - command: 'init --name other'
      exit: 2
      stderr: |
          Error: this Mac is named "macbook-pro", not "other"
          Hint: run station init without --name
    - command: 'init --name macbook-pro --yes | /usr/bin/grep name'
      exit: 0
      stdout: |
          ●	name	macbook-pro
