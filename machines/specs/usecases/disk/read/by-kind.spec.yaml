description: 'disk.read tells a mac''s disk by kind, and what its caches can free'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["macbook-pro"].disk.files["~/.rustup/toolchains/stable/lib"] = 12000000000'' world.json > w.json && /bin/mv w.json world.json; "$STATION" guest serve --stdio | /usr/bin/jq -s -c ''[.[] | select(.out)] | last | .out | {kinds: [.Kinds[] | [.Kind, .Bytes]], can: .CanFree}'''
      stdin: |
          {"v":2,"id":"1","watch":"disk.read","in":{}}
      exit: 0
      stdout: |
          {"kinds":[["system",21400000000],["apps",12000000000],["your-data",430800000000],["caches",34800000000],["machines",107000000000],["image-cache",0],["free",388000000000]],"can":{"Bytes":34800000000,"Sentence":"Caches hold 34.8 GB. Each app rebuilds its own when it needs it.","Call":"disk.free"}}
