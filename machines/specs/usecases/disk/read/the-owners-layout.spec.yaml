description: 'the owner''s layout: every disk in Machines'' home is Machines'', whoever made the VM'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["macbook-pro"] |= (.disk.total = 2000000000000 | .disk.free = 1346000000000 | .disk.system = 1 | .disk.files = {"~/.rustup/toolchains/stable/lib": 6100000000, "~/Library/Caches/go-build/00/a": 9000000000, "~/.local/share/station/vms/cache/OCIs/ghcr.io/cirruslabs/macos/disk.img": 113000000000, "~/Music/Music/Media/x": 81000000000, "~/.claude/projects/x": 24000000000, "/Applications/League of Legends.app/Contents/x": 39000000000, "/Applications/Teamfight Tactics.app/Contents/x": 11000000000} | .vms["development-linux"] = (.vms["linux-1"] | .size.Disk = 116000000000) | .vms |= del(.["linux-1"], .api) | .vms["development-macos"] = {"disk": true, "pid": 4712, "size": {"CPUs": 0, "Memory": 0, "Disk": 116000000000}} | .vms["station-e2e-xcode-e6a11b9cb78a"] = {"disk": true, "size": {"CPUs": 0, "Memory": 0, "Disk": 77000000000}})'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -s -c ''[.[] | select(.out)] | last | .out | {used: .Used, kinds: [.Kinds[] | [.Kind, .Bytes]], holds: [.Station.Holds[] | [.Holder, .Bytes]], itself: .Station.Itself, can: .CanFree.Sentence}'''
      stdin: |
          {"v":2,"id":"1","watch":"disk.read","in":{}}
      exit: 0
      stdout: |
          {"used":654000000000,"kinds":[["system",1],["apps",6100000000],["your-data",209899999999],["caches",122000000000],["machines",316000000000],["free",1346000000000]],"holds":[["machine-disks",116000000000],["images",7000000000],["other-vms",193000000000],["leftovers",0],["logs",0],["this-mac",338000000000],["free",1346000000000]],"itself":"This Mac itself holds 338 GB.","can":"Caches hold 122 GB. Each app rebuilds its own when it needs it."}
