description: 'disk free --on another Mac frees that Mac''s caches, and this Mac keeps its own'
env: two-macs
runs:
    - command: 'disk free homebrew --on mac-mini'
      exit: 0
      stdout: |
          	On mac-mini:
          ●	homebrew	1.1 GB freed
          ●	Freed	1.1 GB	nothing is lost
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs | {mini: .["mac-mini"].disk.files["~/Library/Caches/Homebrew/downloads/x"], here: .["macbook-pro"].disk.files["~/Library/Caches/Homebrew/downloads/x"]}'' world.json'
      exit: 0
      stdout: |
          {"mini":null,"here":2100000000}
