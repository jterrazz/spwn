description: '--on a VM name two Macs hold is refused, naming each, before any ssh to it; so is an unheld name'
fixture:
    - ../../__fixtures__/far-mac/
    - ./__fixtures__/far-vm/
env: engine
runs:
    - command: 'apps --on linux-9 2> err.txt; echo "exit $?"; /usr/bin/grep -c "engine is not running" err.txt; /usr/bin/grep -c linux-9 .calls; /usr/bin/sort .calls; /usr/bin/cat err.txt'
      exit: 0
      stdout: |
          exit 2
          0
          0
          ssh -o BatchMode=yes -o ConnectTimeout=5 -o ServerAliveInterval=2 -o ServerAliveCountMax=2 -- x sh -c 'PATH="$HOME/.local/bin:/usr/local/bin:$PATH" exec station "$@"' station engine attach
          ssh -o BatchMode=yes -o ConnectTimeout=5 -o ServerAliveInterval=2 -o ServerAliveCountMax=2 -- y sh -c 'PATH="$HOME/.local/bin:/usr/local/bin:$PATH" exec station "$@"' station engine attach
          Error: linux-9 is on x and y: name one, linux-9.x
          Hint: station machines
    - command: 'apps --on nope; echo "exit $?"; /usr/bin/grep -c nope .calls'
      exit: 1
      stdout: |
          exit 2
          0
      stderr: |
          Error: no machine named "nope"
          Hint: station machines
