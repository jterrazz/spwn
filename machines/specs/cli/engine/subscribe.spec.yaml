description: 'the keep-awake watch streams each change and a guard''s end, and refuses an unknown page'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/socket-client/
    - ../../__fixtures__/power/
env: engine
runs:
    - command: '--version > /dev/null; "$STATION" engine run 2> engine.log & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; ( printf ''{"v":2,"id":"1","watch":"page","in":{"pages":["keep-awake"],"revision":5}}\n''; n=0; until /usr/bin/jq -e ''select(.out.event=="page")'' stream.jsonl > /dev/null 2>&1 || [ $n -ge 100 ]; do /bin/sleep 0.1; n=$((n+1)); done; printf ''{"v":2,"id":"2","call":"engine.hello"}\n''; n=0; until /usr/bin/jq -s -e ''([.[]|select(.out.event=="page")|.out.page.sections[0].items[0].row.cells[0].kind]|reduce .[] as $x ([]; if last==$x then . else .+[$x] end)|length==5) and any(.[]; .out.event=="notice")'' stream.jsonl > /dev/null 2>&1 || [ $n -ge 150 ]; do /bin/sleep 0.1; n=$((n+1)); done ) | socket .local/state/station/engine.sock > stream.jsonl & s=$!; n=0; until /usr/bin/jq -e ''select(.out.event=="page")'' stream.jsonl > /dev/null 2>&1 || [ $n -ge 100 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" awake 4h > /dev/null; n=0; until /usr/bin/jq -s -e --arg k on ''[.[]|select(.out.event=="page")|.out.page.sections[0].items[0].row.cells[0].kind]|reduce .[] as $x ([]; if last==$x then . else .+[$x] end)|length==2 and last==$k'' stream.jsonl > /dev/null 2>&1 || [ $n -ge 100 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" awake off > /dev/null; n=0; until /usr/bin/jq -s -e --arg k off ''[.[]|select(.out.event=="page")|.out.page.sections[0].items[0].row.cells[0].kind]|reduce .[] as $x ([]; if last==$x then . else .+[$x] end)|length==3 and last==$k'' stream.jsonl > /dev/null 2>&1 || [ $n -ge 100 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" awake 4h > /dev/null; n=0; until /usr/bin/jq -s -e --arg k on ''[.[]|select(.out.event=="page")|.out.page.sections[0].items[0].row.cells[0].kind]|reduce .[] as $x ([]; if last==$x then . else .+[$x] end)|length==4 and last==$k'' stream.jsonl > /dev/null 2>&1 || [ $n -ge 100 ]; do /bin/sleep 0.1; n=$((n+1)); done; echo 20 > power/battery; echo battery > power/source; wait $s; /usr/bin/jq -c ''select(.out.stream)|[.id, .out.stream]'' stream.jsonl; /usr/bin/jq -c ''select(.id != "1")|.id'' stream.jsonl; /usr/bin/jq -r ''select(.out.event=="page")|.out.page.id'' stream.jsonl | /usr/bin/sort -u; /usr/bin/jq -r ''select(.out.event=="page")|.out.page.sections[0].items[0].row.cells[0].kind'' stream.jsonl | /usr/bin/uniq; /usr/bin/jq -c ''select(.out.event=="notice")|.out.notice'' stream.jsonl; printf ''{"v":2,"id":"3","watch":"page","in":{"pages":["nope"],"revision":5}}\n'' | socket .local/state/station/engine.sock | /usr/bin/jq -c ''[.out == null, .error.code]''; kill $d; wait $d'
      exit: 0
      stdout: |
          ["1","station.page/v1"]
          keep-awake
          off
          on
          off
          on
          off
          {"kind":"awake_ended","icon":"moon","text":"Awake stopped on This Mac: battery 20 %"}
          [true,"unknown_page"]
