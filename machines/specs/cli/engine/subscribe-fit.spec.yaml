description: 'a watch of pages opens on the verdict of the revision its client draws; only a fit is sent a page'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/socket-client/
    - ../../__fixtures__/power/
env: engine
runs:
    - command: '--version > /dev/null; "$STATION" engine run 2> engine.log & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; for r in 5 6 4 none; do if [ $r = none ]; then i=''{"pages":["keep-awake"]}''; else i="{\"pages\":[\"keep-awake\"],\"revision\":$r}"; fi; ( printf ''{"v":2,"id":"1","watch":"page","in":%s}\n'' "$i"; /bin/sleep 1 ) | socket .local/state/station/engine.sock > "$r.jsonl"; /usr/bin/jq -c ''select(.out.stream)|[.out.page, .out.fit.verdict, .out.fit.engine, .out.fit.app]'' "$r.jsonl"; /usr/bin/jq -s -c ''[.[]|select(.out.event=="page")]|length|"pages: \(.)"'' "$r.jsonl"; done; kill $d; wait $d'
      exit: 0
      stdout: |
          [5,"fits",5,5]
          "pages: 1"
          [5,"engine-older",5,6]
          "pages: 0"
          [5,"app-older",5,4]
          "pages: 0"
          [5,"app-older",5,0]
          "pages: 0"
