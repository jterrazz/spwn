description: 'the engine reads This Mac before any watch; the menubar watch streams the popover to ready'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/socket-client/
    - ../../__fixtures__/power/
env: engine
runs:
    - command: '--version > /dev/null; "$STATION" engine run 2> engine.log & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; : > .calls; n=0; until printf ''{"v":2,"id":"0","watch":"engine.state","in":{"keys":["local"],"revision":1}}\n'' | "$STATION" guest serve --stdio 2>/dev/null | /usr/bin/jq -e ''select(.out.event == "snapshot") | [.out.slices // {} | keys[] | split(":")[0]] | unique == ["activity","awake","mac","overview","ports","signins"]'' > /dev/null || [ $n -ge 100 ]; do /bin/sleep 0.1; n=$((n+1)); done; /usr/bin/grep -E "^(launchctl|sysctl|tart|tailscale) " .calls | /usr/bin/cut -d" " -f1-2 | /usr/bin/sort -u | /usr/bin/paste -sd,; ( printf ''{"v":2,"id":"1","watch":"page","in":{"pages":["menubar"],"revision":5}}\n''; n=0; until [ -e refreshed ] || [ $n -ge 100 ]; do /bin/sleep 0.1; n=$((n+1)); done ) | socket .local/state/station/engine.sock > stream.jsonl & s=$!; n=0; until /usr/bin/jq -e ''select(.out.event=="page")'' stream.jsonl > /dev/null 2>&1 || [ $n -ge 100 ]; do /bin/sleep 0.1; n=$((n+1)); done; printf ''{"v":2,"id":"2","call":"engine.refresh","in":{"pages":["menubar"]}}\n{"v":2,"id":"3","call":"engine.refresh","in":{"pages":["nope"]}}\n'' | socket .local/state/station/engine.sock | /usr/bin/jq -c ''[.id, (.error == null), .error.code]''; : > refreshed; wait $s; /usr/bin/jq -c ''select(.out.stream)|[.id, .out.pages]'' stream.jsonl; /usr/bin/jq -r ''select(.out.event=="page")|.out.page.state'' stream.jsonl | /usr/bin/uniq | /usr/bin/head -2; /usr/bin/jq -c ''select(.out.event=="page")|[.out.page.id, [.out.page.sections[].id]]'' stream.jsonl | /usr/bin/tail -1; /usr/bin/jq -c ''select(.out.event=="page")|[.out.page.actions[]|select(.on=="page")|[.id, .run.call // "terminal"]]'' stream.jsonl | /usr/bin/tail -1; /usr/bin/jq -c ''select(.out.event=="page")|[.out.page.actions[]|select(.on=="row")|[.id, .run.call, .rows]]'' stream.jsonl | /usr/bin/tail -1; /usr/bin/grep -c -E "^(launchctl|sysctl|tart) " .calls | /usr/bin/awk ''{print ($1 > 0)}''; kill $d; wait $d'
      exit: 0
      stdout: |
          launchctl list,launchctl print-disabled,sysctl -n,tailscale serve,tailscale status,tart --version,tart list
          ["2",true,null]
          ["3",false,"unknown_page"]
          ["1",["menubar"]]
          ready
          ["menubar",["this-mac","empty","macs","shortcuts","needs-you","machines"]]
          [["new-vm","machines.create-workspace"],["open-station","terminal"],["stop-all","engine.stop"]]
          [["new-vm:x","machines.create-workspace",["x"]],["add-mac",null,["add-mac"]],["awake-keep","awake.keep",["awake"]]]
          1
