package: station.package/v1
kind: setting
name: autologin
description: GUI auto-login for a user (FileVault-aware)
needs: [sudo, terminal]
reversible: true
options:
    - name: user
      label: User to log in
      help: the account that logs in by itself at boot, no default
      type: string
      required: true
    - name: password
      label: Password of the user
      type: string
      secret: true
      required: true
      default-env: AGENT_PASSWORD
sets:
    - { key: /etc/kcpassword, value: present }
methods:
    - os: macos
      machine: computer
      builtin: autologin
writes:
    - path: /etc/kcpassword
      level: kept
      note: the login password of the user who logs in, obfuscated
    - path: /Library/Preferences/com.apple.loginwindow
      level: settings
      note: '`autoLoginUser` in `com.apple.loginwindow`'
