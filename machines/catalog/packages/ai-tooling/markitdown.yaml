package: station.package/v1
kind: app
name: markitdown
description: Convert files to Markdown for LLMs
agent: 'Read a PDF, Word, Excel, PowerPoint or HTML file as Markdown: markitdown <file> -o <file>.md'
provides: [markitdown]
requires: [uv]
version-read:
    pattern: markitdown (\d+\.\d+\.\d+)
methods:
    - os: macos
      machine: [workspace, server]
      uv: markitdown[all]
    - family: linux
      script:
          check: markitdown --version
          run: uv tool install --upgrade 'markitdown[all]'
          undo: uv tool uninstall markitdown
