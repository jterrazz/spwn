package: station.package/v1
kind: app
name: agent-browser
description: Browser automation CLI for AI agents
agent: 'Drive a real browser from the shell: agent-browser open <url>, then agent-browser snapshot; agent-browser --help lists the rest'
provides: [agent-browser]
requires: [bun]
methods:
    - os: macos
      machine: [workspace, server]
      bun: agent-browser
    - family: linux
      bun: agent-browser
disk:
    installed: [~/.agent-browser/browsers]
    no-erase: 'the browsers are the app: station apps remove agent-browser'
