package: station.package/v1
kind: app
name: playwright-browsers
description: Chromium runtime for website specs (@jterrazz/test)
agent: 'The Chromium that Playwright tests run in is already here: run the specs (npx playwright test), never download a browser'
requires: [node]
version-read:
    path: ~/Library/Caches/ms-playwright/chromium*
methods:
    - os: macos
      machine: [workspace, server]
      script:
          run: npx playwright install chromium
    - family: linux
      script:
          run: npx playwright install chromium
disk:
    installed: [~/Library/Caches/ms-playwright, '{cache}/ms-playwright']
    no-erase: 'the browsers are the app: station apps remove playwright-browsers'
