package: station.package/v1
kind: app
name: desktop-session
description: A virtual screen and its window manager kept running for the user of a Linux VM, from its start and with no login, so every process of that user, a non-interactive ssh command included, finds the display and the session bus
requires: [desktop-session-deps]
methods:
    # outside: on Ubuntu, pam_systemd gives an ssh session DBUS_SESSION_BUS_ADDRESS once the user's bus socket exists, and nothing gives it DISPLAY: zsh reads ~/.zshenv for every command, bash run by sshd reads ~/.bashrc, whose interactive guard at its top ends the read, so the block goes before it; ~/.config/environment.d reaches the user's units and the bus's activations alone.
    - family: debian
      machine: [workspace, server]
      needs: [sudo]
      script:
          check: |
              test -e "/var/lib/systemd/linger/$(/usr/bin/id -un)" && test -L "$HOME/.config/systemd/user/default.target.wants/station-xvfb.service" && test -L "$HOME/.config/systemd/user/default.target.wants/station-matchbox.service" && /usr/bin/grep -qxF '# >>> station:desktop-session >>>' "$HOME/.zshenv"
          undo: |
              export XDG_RUNTIME_DIR=/run/user/$(id -u)
              systemctl --user disable --now station-matchbox.service station-xvfb.service
              rm -f "$HOME/.config/systemd/user/station-xvfb.service" "$HOME/.config/systemd/user/station-matchbox.service" "$HOME/.config/environment.d/60-station-desktop-session.conf"
              systemctl --user daemon-reload
              for rc in .zshenv .bashrc; do
                [ -f "$HOME/$rc" ] && sed -i '/^# >>> station:desktop-session >>>$/,/^# <<< station:desktop-session <<<$/d' "$HOME/$rc"
              done
              sudo -n loginctl disable-linger "$(id -un)"
          run: |
              set -eu
              export XDG_RUNTIME_DIR=/run/user/$(id -u)
              sudo -n loginctl enable-linger "$(id -un)"
              i=0
              until [ -S "$XDG_RUNTIME_DIR/systemd/private" ]; do
                i=$((i+1))
                [ "$i" -le 100 ] || { echo "the user manager of $(id -un) did not start" >&2; exit 1; }
                sleep 0.1
              done
              units=$HOME/.config/systemd/user
              mkdir -p "$units" "$HOME/.config/environment.d"
              cat > "$units/station-xvfb.service" <<'UNIT'
              [Unit]
              Description=Xvfb, the virtual screen :99 of the desktop session
              Wants=station-matchbox.service

              [Service]
              ExecStart=/usr/bin/Xvfb :99 -screen 0 1280x800x24
              Restart=on-failure

              [Install]
              WantedBy=default.target
              UNIT
              cat > "$units/station-matchbox.service" <<'UNIT'
              [Unit]
              Description=matchbox, the window manager of the desktop session
              BindsTo=station-xvfb.service
              After=station-xvfb.service

              [Service]
              Environment=DISPLAY=:99
              ExecStartPre=/usr/bin/timeout 10 /bin/sh -c 'until [ -S /tmp/.X11-unix/X99 ]; do sleep 0.1; done'
              ExecStart=/usr/bin/matchbox-window-manager
              Restart=on-failure

              [Install]
              WantedBy=default.target
              UNIT
              echo DISPLAY=:99 > "$HOME/.config/environment.d/60-station-desktop-session.conf"
              systemctl --user daemon-reload
              systemctl --user enable --now station-xvfb.service station-matchbox.service
              for rc in .zshenv .bashrc; do
                f=$HOME/$rc
                if ! grep -qxF '# >>> station:desktop-session >>>' "$f" 2>/dev/null; then
                  { printf '%s\n' '# >>> station:desktop-session >>>' 'export DISPLAY=:99' 'export DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS:-unix:path=/run/user/$UID/bus}"' '# <<< station:desktop-session <<<'; cat "$f" 2>/dev/null || true; } > "$f.station"
                  mv "$f.station" "$f"
                fi
              done
