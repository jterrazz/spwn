package: station.package/v1
kind: app
name: tailscale
description: 'The Tailscale app: each Mac is a node, and Machines reads it'
provides: [tailscale]
then: [tailscale-cli]
bundle: Tailscale
supersedes: tailscale
accepts: [app-store]
updates: self
methods:
    - os: macos
      machine: computer
      cask: tailscale-app
disk:
    paths:
        - path: ~/Library/Application Scripts/*io.tailscale.*
          level: kept
          os: macos
          machine: computer
    installed:
        - /Applications/Tailscale.app
        - /usr/local/bin/tailscale
        - ~/.local/bin/tailscale
    removal:
        ~/.local/bin/tailscale: 'written by the `tailscale-cli` setting for the App Store app: `station settings off tailscale-cli` removes it'
    no-erase: "nothing to erase: the login is the Tailscale app's"
