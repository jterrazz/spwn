package: station.package/v1
kind: setting
name: authorized-key
description: "Public keys allowed to sign in over ssh, in a block of a user's authorized_keys"
needs: [sudo]
reversible: true
options:
    - name: user
      label: The account the keys sign in as
      type: string
      required: true
      default: root
    - name: key
      label: 'The public keys, one per line: type base64 [comment]'
      type: string
      required: true
sets:
    - { key: ~user/.ssh/authorized_keys, value: the block station:authorized-key }
methods:
    - family: linux
      authorized-keys: { block: station:authorized-key }
writes:
    - path: ~user/.ssh/authorized_keys
      level: settings
      note: "the block station:authorized-key, between its two marker lines (`/root/.ssh` for root); the folder and the file losing the write of group and others when they have it and the user owns them, each made 0700 and 0600 and the user's when station makes it, one already there keeping its owner; off takes the file and the folder away once empty when station made them"
    - path: /var/lib/station/authorized-keys.json
      level: settings
      note: "root's, 0600: every file station wrote the block in, the block's text and whether station made the file and its folder, which drift and off read, whoever runs station"
    - path: /var/lib/station/authorized-keys.lock
      level: settings
      note: "empty: the lock apply and off hold around the record; inside it each ~/.ssh they write in is held, the folder itself, the lock the VM's guest takes too"
