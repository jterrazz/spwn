package: station.package/v1
kind: setting
name: git-identity
description: The name and email every commit carries, for the whole user
requires: [git]
reversible: true
options:
    - name: name
      label: Name on commits
      type: string
      required: true
    - name: email
      label: Email on commits
      type: string
      required: true
sets:
    - { key: user.name, value: the name option }
    - { key: user.email, value: the email option }
methods:
    - os: any
      builtin: git-identity
writes:
    - path: ~/.gitconfig
      level: settings
      note: '`git config --global` user.name and user.email where Machines wrote them, and station.identity, those keys and the digest of their values, which off checks before it takes them back; an identity git already holds that Machines did not write is refused, never replaced'
    - path: '{config}/git/config'
      level: settings
      note: 'instead of `~/.gitconfig` when only this file exists: `git config --global` writes here then'
