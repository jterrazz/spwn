package: station.package/v1
kind: app
name: tart
description: "Virtual machines on Apple silicon: the engine of Machines' VMs"
provides: [tart]
then: [tart-launcher]
version-read:
    args: [tart, --version]
    pattern: ^(\S+)
methods:
    - os: macos
      machine: computer
      script:
          run: |
              set -euo pipefail
              d="$HOME/.local/share"
              case "${XDG_DATA_HOME:-}" in /*) d="$XDG_DATA_HOME" ;; esac
              mkdir -p "$d/station/vms" "$HOME/.local/bin"
              new=$(mktemp -d "$d/station/tart.new.XXXXXX")
              trap 'rm -rf "$new"' EXIT
              curl -fsSL https://github.com/cirruslabs/tart/releases/latest/download/tart.tar.gz | tar -xz -C "$new"
              fresh=$("$new/tart.app/Contents/MacOS/tart" --version)
              now=$("$d/station/tart/tart.app/Contents/MacOS/tart" --version 2>/dev/null || true)
              [ "$fresh" != "$now" ] || exit 0
              old="$d/station/tart.old.$$"
              [ ! -e "$d/station/tart" ] || mv "$d/station/tart" "$old"
              mv "$new" "$d/station/tart" || { [ ! -e "$old" ] || mv "$old" "$d/station/tart"; exit 1; }
              rm -rf "$old"
disk:
    paths:
        - path: '{data}/station/vms/cache/OCIs'
          level: cache
          note: 'the image cache: the upstream disks Tart pulled, freed only by name (`station disk free tart`), since the next image built or fetched from one downloads it again'
        - path: '{data}/station/vms/cache/IPSWs'
          level: cache
        - path: '{data}/station/vms/tmp'
          level: cache
        - path: ~/Library/Caches/com.github.cirruslabs.tart
          level: cache
          note: Tart's NSURLCache
    installed: ['{data}/station/tart', ~/.local/bin/tart]
    free:
        - run: [tart, prune, --entries=caches, --older-than=0]
          uses: tart
        - delete: [~/Library/Caches/com.github.cirruslabs.tart/*]
    no-erase: "station's data are VMs and images: station machines delete <vm>, station images delete <image>"
    misplaced:
        - path: ~/.tart
          busy: tart
          move:
              - from: ~/.tart
                to: '{data}/station/vms'
          then: [tart-launcher]
          yours: [~/.tart/vms]
        - path: ~/.local/opt
          busy: tart
          move:
              - from: ~/.local/opt/tart.app
                to: '{data}/station/tart/tart.app'
              - from: ~/.local/opt/LICENSE
                to: '{data}/station/tart/LICENSE'
          prune: [~/.local/opt]
          then: [tart-launcher]
