package: station.package/v1
kind: app
name: tmux
description: Terminal multiplexer for persistent sessions
agent: "Keep a long command alive past your shell: tmux new -d -s <name> '<command>', tmux ls, tmux attach -t <name>"
provides: [tmux]
then: [tmux-dotfiles]
methods:
    - os: macos
      brew: tmux
    - family: debian
      needs: [sudo]
      apt: { packages: [tmux] }
disk:
    paths:
        - path: ~/.tmux.conf
          level: settings
    no-erase: 'nothing to erase: keys and logins are kept'
