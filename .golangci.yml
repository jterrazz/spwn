version: '2'
run:
    modules-download-mode: readonly
    # invariant: every exclusion path below is relative to this file, whichever module the run starts in.
    relative-path-mode: cfg
linters:
    enable:
        - depguard
        - forbidigo
    settings:
        forbidigo:
            # invariant: a read of a project goes through a root opened at its folder (packages/platform's Tree and
            # FS), never a plain call that a name, a "..", an absolute path or a link of the declaration could direct
            # outside it; the packages it binds are the scope rule of the exclusions below.
            analyze-types: true
            forbid:
                - pattern: ^os\.(Open|OpenFile|ReadFile|ReadDir|Stat|Lstat|DirFS|Readlink|OpenRoot|OpenInRoot)$
                  pkg: ^os$
                  msg: a project is read through platform.Within or platform.FS, never a plain os read nor a root of its own
                - pattern: ^ioutil\.(ReadFile|ReadDir)$
                  pkg: ^io/ioutil$
                  msg: a project is read through platform.Within or platform.FS, never a plain ioutil read
                - pattern: ^filepath\.(Walk|WalkDir|Glob|EvalSymlinks)$
                  pkg: ^path/filepath$
                  msg: a project is walked through platform.Tree's WalkDir, never a plain filepath walk or link resolution
                - pattern: ^syscall\.Open$
                  pkg: ^syscall$
                  msg: a project is read through platform.Within or platform.FS, never a raw open
        depguard:
            # invariant: each rule denies a layer the imports of the layers above it.
            # L1 platform imports nothing; L2 activity, authentication, upgrade import L1;
            # L3 dependency, agent import L1-L2; L4 project L1-L3; L5 compile L1-L4;
            # L6 world L1-L5; L7 apps/cli anything
            rules:
                build-compile:
                    files:
                        - '**/packages/compile/**'
                    deny:
                        - pkg: spwn.sh/packages/world
                          desc: L5 (build) must not import L6 (runtime)
                domain-agent:
                    files:
                        - '**/packages/agent/**'
                    deny:
                        - pkg: spwn.sh/packages/project
                          desc: L3 (domain) must not import L4 (project)
                        - pkg: spwn.sh/packages/compile
                          desc: L3 (domain) must not import L5 (build)
                        - pkg: spwn.sh/packages/world
                          desc: L3 (domain) must not import L6 (runtime)
                domain-deps:
                    files:
                        - '**/packages/dependency/**'
                    deny:
                        - pkg: spwn.sh/packages/project
                          desc: L3 (domain) must not import L4 (project)
                        - pkg: spwn.sh/packages/compile
                          desc: L3 (domain) must not import L5 (build)
                        - pkg: spwn.sh/packages/world
                          desc: L3 (domain) must not import L6 (runtime)
                platform:
                    files:
                        - '**/packages/platform/**'
                    deny:
                        - pkg: spwn.sh/packages/dependency
                        - pkg: spwn.sh/packages/agent
                        - pkg: spwn.sh/packages/project
                        - pkg: spwn.sh/packages/compile
                        - pkg: spwn.sh/packages/world
                platform-activity:
                    files:
                        - '**/packages/activity/**'
                    deny:
                        - pkg: spwn.sh/packages/dependency
                        - pkg: spwn.sh/packages/agent
                        - pkg: spwn.sh/packages/project
                        - pkg: spwn.sh/packages/compile
                        - pkg: spwn.sh/packages/world
                platform-authentication:
                    files:
                        - '**/packages/authentication/**'
                    deny:
                        - pkg: spwn.sh/packages/dependency
                        - pkg: spwn.sh/packages/agent
                        - pkg: spwn.sh/packages/project
                        - pkg: spwn.sh/packages/compile
                        - pkg: spwn.sh/packages/world
                platform-upgrade:
                    files:
                        - '**/packages/upgrade/**'
                    deny:
                        - pkg: spwn.sh/packages/dependency
                        - pkg: spwn.sh/packages/agent
                        - pkg: spwn.sh/packages/project
                        - pkg: spwn.sh/packages/compile
                        - pkg: spwn.sh/packages/world
                engine-linked:
                    files:
                        - '**/packages/project/**'
                        - '**/packages/transpile/**'
                        - '**/packages/automation/**'
                        - '**/packages/runtimes/**'
                        - '**/packages/agent/**'
                        - '**/packages/activity/**'
                        - '**/packages/platform/**'
                    deny:
                        - pkg: spwn.sh/packages/dependency/builtin
                          desc: the engine links these packages, and the built-in catalog embeds a generated copy it must not carry
                project-layer:
                    files:
                        - '**/packages/project/**'
                    deny:
                        - pkg: spwn.sh/packages/compile
                          desc: L4 (project) must not import L5 (build)
                        - pkg: spwn.sh/packages/world
                          desc: L4 (project) must not import L6 (runtime)
        errcheck:
            check-type-assertions: true
    exclusions:
        generated: lax
        presets:
            - comments
            - common-false-positives
            - legacy
            - std-error-handling
        rules:
            - linters:
                  - errcheck
              path: _test\.go
            # invariant: forbidigo binds the packages that read a project: its loader, the transpiler's source, the
            # dependency packages that read spwn.lock, spwn/tools/ and a tool's files, the architect, which reads
            # spwn/skills/, spwn/hooks/, spwn/commands/ and the agents' Minds into a world, and the automation engine.
            - linters:
                  - forbidigo
              path-except: ^packages/(architect/|automation/|project/|transpile/source/|dependency/(refs/|lockfile\.go|internal/manifest/|internal/adapters/local/))
            # outside: an fs automation watches the host folder its declaration names, which may be outside the
            # project by design: plan says so as an advice, and the watcher lists names and times there, reading no
            # file's bytes.
            - linters:
                  - forbidigo
              path: ^packages/automation/(automation|fs_source)\.go$
            # outside: NOT YET ROOTED, the run receipts (.spwn/runs.jsonl) and the schedule state
            # (.spwn/automations/state.json) are read and written by their plain paths, so a link a cloned project
            # carries there is followed; machines/TODO.md records it.
            - linters:
                  - forbidigo
              path: ^packages/automation/(receipts|state)\.go$
            # outside: a world's workspaces are host folders the declaration names to mount, each stat'd as given
            # before its bind.
            - linters:
                  - forbidigo
              path: ^packages/architect/spawn\.go$
              source: os\.Stat\(abs\)
            # outside: a world's knowledge is stat'd as spwn.yaml's knowledge: path gives it, before its bind; plan
            # refuses one outside the project, `spwn up` takes it as resolved (apps/cli/world/project.go).
            - linters:
                  - forbidigo
              path: ^packages/architect/spawn\.go$
              source: os\.Stat\(opts\.Knowledge\)
            # outside: a test builds the project it reads, and reads it back to judge what the code read.
            - linters:
                  - forbidigo
              path: _test\.go
            # outside: the organization and team files live in ~/.spwn, the user's own, never in a project.
            - linters:
                  - forbidigo
              path: ^packages/project/(organization|team)\.go$
            # outside: discovery searches upward from a folder for the spwn.yaml that makes a project, before there
            # is a project folder to root a read at.
            - linters:
                  - forbidigo
              path: ^packages/project/internal/discovery/
        paths:
            - third_party$
            - examples$
formatters:
    exclusions:
        generated: lax
        paths:
            - third_party$
            - examples$
