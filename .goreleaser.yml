version: 2

project_name: spwn

# value: goreleaser's staging area is an artefact (uploaded to the release and never read back), so it lives under .artifacts/, which `release --clean` empties alone
dist: .artifacts/goreleaser

before:
    hooks:
        # invariant: the embedded catalog is a gitignored mirror of catalog/ that only `go generate` writes; without it every build fails on `pattern all:content: no matching files found`
        - sh -c "cd packages/dependency && go generate ./..."

builds:
    - id: spwn
      dir: apps/cli
      main: ./cmd/spwn
      binary: spwn
      env:
          - CGO_ENABLED=0
      goos:
          - linux
          - darwin
      goarch:
          - amd64
          - arm64
      ldflags:
          - -s -w -X spwn.sh/apps/cli.Version={{.Version}}
      # invariant: on a signed run (MACOS_SIGN=true, set by the publish workflow's signing job, on its macOS runner) each darwin binary is signed with the Developer ID and notarized before it is archived; any other target, or a snapshot run by hand, passes through unsigned
      hooks:
          post:
              - cmd: scripts/sign-macos.sh binary {{ .Target }} {{ .Path }}
                output: true

archives:
    - id: spwn
      builds:
          - spwn
      name_template: 'spwn_{{ .Os }}_{{ .Arch }}'
      format: tar.gz
      format_overrides:
          - goos: windows
            format: zip

# invariant: .artifacts/station/ holds station's binaries, Station.app.zip, Spwn_darwin_arm64.zip and, on a signed run, the window's update (Spwn.app.tar.gz, its .sig and latest.json), which the publish workflow builds and downloads before goreleaser runs; one checksums.txt lists them beside spwn's archives, the file station's image builder and the installer both read
checksum:
    name_template: 'checksums.txt'
    extra_files:
        - glob: ./.artifacts/station/*

changelog:
    sort: asc
    filters:
        exclude:
            - '^docs:'
            - '^test:'
            - '^chore:'

release:
    github:
        owner: jterrazz
        name: spwn
    draft: false
    prerelease: false
    make_latest: true
    extra_files:
        - glob: ./.artifacts/station/*
    name_template: 'v{{.Version}}'
